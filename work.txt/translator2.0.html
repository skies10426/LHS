<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Tab</title>
<link rel="icon" type="image/png" href="logo-chrome-1.png">
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#202124;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    background:#1e1e1e;
    border:1px solid #3a3a3a;
    width:800px;
    max-width:100%;
    padding:30px;
    border-radius:15px;
    box-shadow:0 12px 30px rgba(0,0,0,.55);
}

h1{
    text-align:center;
    margin-bottom:25px;
    color:#fff;
}

.controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.select-group{
    flex:1;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
    color:#fff;
}

select{
    width:100%;
    padding:10px;
    border:1px solid #fff;
    border-radius:8px;
    background:#2b2b2b;
    color:#fff;
}

.swap-btn{
    margin-top:25px;
    padding:10px 15px;
    border:none;
    background:#f1f3f4;
    color:#202124;
    border-radius:8px;
    cursor:pointer;
    font-size:18px;
}

.text-area{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-bottom:20px;
}

textarea{
    width:100%;
    height:180px;
    resize:none;
    padding:15px;
    border:1px solid #fff;
    border-radius:10px;
    font-size:16px;
    background:#2b2b2b;
    color:#fff;
}

button.translate-btn{
    width:100%;
    padding:14px;
    background:#f1f3f4;
    color:#202124;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

button.translate-btn:hover{
    background:#e8eaed;
}

@media(max-width:700px){
    .text-area{
        grid-template-columns:1fr;
    }
}
</style>
</head>
<body>

<div class="container">
    <h1>🌐 Language Translator</h1>

    <div class="controls">
        <div class="select-group">
            <label>Translate From</label>
            <select id="fromLang">
                <option value="en">English</option>
                <option value="hi">Hindi</option>
                <option value="es">Spanish</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="it">Italian</option>
                <option value="ja">Japanese</option>
            </select>
        </div>

        <button class="swap-btn" onclick="swapLanguages()">⇄</button>

        <div class="select-group">
            <label>Translate To</label>
            <select id="toLang">
                <option value="hi">Hindi</option>
                <option value="en">English</option>
                <option value="es">Spanish</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="it">Italian</option>
                <option value="ja">Japanese</option>
            </select>
        </div>
    </div>

    <div class="text-area">
        <textarea id="inputText" placeholder="Enter text to translate..."></textarea>

        <textarea id="outputText" placeholder="Translation appears here..." readonly></textarea>
    </div>

    <button class="translate-btn" onclick="translateText()">
        Translate
    </button>
</div>

<script>
async function translateText() {

    const text = document.getElementById("inputText").value.trim();
    const from = document.getElementById("fromLang").value;
    const to = document.getElementById("toLang").value;
    const output = document.getElementById("outputText");

    if(text === ""){
        alert("Please enter text.");
        return;
    }

    output.value = "Translating...";

    try{
        const response = await fetch(
            `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`
        );

        const data = await response.json();

        output.value = data.responseData.translatedText;

    }catch(error){
        output.value = "Translation failed. Please try again.";
        console.error(error);
    }
}

function swapLanguages(){

    const from = document.getElementById("fromLang");
    const to = document.getElementById("toLang");

    let temp = from.value;
    from.value = to.value;
    to.value = temp;

    const input = document.getElementById("inputText");
    const output = document.getElementById("outputText");

    let tempText = input.value;
    input.value = output.value;
    output.value = tempText;
}
</script>

</body>
</html>
