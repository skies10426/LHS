<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sskies :: Algebra I Study Terminal</title>
<link rel="icon" type="image/png" href="logo-chrome-1.png"> 
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --black:#0a0a0a;
  --panel:#131314;
  --panel-2:#1a1a1b;
  --panel-3:#1f1f21;
  --line:#2c2c2e;
  --line-soft:#202022;
  --white:#f0f0f0;
  --gray-1:#cfcfcf;
  --gray-2:#9a9a9c;
  --gray-3:#6a6a6c;
  --gray-4:#454547;
  --glow:rgba(240,240,240,.4);
  --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 10px 26px -14px rgba(0,0,0,.8);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--black);
  color:var(--gray-1);
  font-family:'VT323', monospace;
  font-size:19px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.disp,.nav-label,.pin,.eyebrow,button{font-family:'Press Start 2P', monospace;}
code,.mono,.formula{font-family:'JetBrains Mono',monospace;}

/* ===== ASCII backdrop ===== */
#ascii-bg{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:0;
  pointer-events:none;
  background:radial-gradient(ellipse at 20% 15%, #1c1c1d 0%, #0a0a0a 55%);
}

/* layout shell */
.shell{
  position:relative;
  z-index:2;
  display:flex;
  min-height:100vh;
}

/* ===== SIDEBAR ===== */
.sidebar{
  --w-collapsed:66px;
  --w-expanded:290px;
  width:var(--w-expanded);
  flex:none;
  background:rgba(19,19,20,.86);
  backdrop-filter:blur(10px);
  color:var(--gray-1);
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
  overflow-x:hidden;
  border-right:1px solid var(--line-soft);
  transition:width .28s cubic-bezier(.4,0,.2,1);
}
.sidebar.collapsed{width:var(--w-collapsed);}
.sidebar::-webkit-scrollbar{width:6px;}
.sidebar::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px;}

.sidebar-head{
  padding:20px 16px 14px;
  border-bottom:1px solid var(--line-soft);
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:8px;
}
.sidebar-head .brand{display:flex; align-items:center; gap:10px; min-width:0;}
.sidebar-head .brand-mark{
  width:32px;height:32px;flex:none;
  background:linear-gradient(155deg,#e8e8e8,#3a3a3a 70%);
  border-radius:4px;
  display:flex; align-items:center; justify-content:center;
  font-family:'Press Start 2P',monospace;
  font-size:12px;
  color:#0a0a0a;
}
.sidebar-head .tag{
  display:block;
  font-family:'Press Start 2P',monospace;
  font-size:8px;
  letter-spacing:.06em;
  color:var(--gray-3);
  margin-bottom:8px;
  white-space:nowrap;
  overflow:hidden;
}
.sidebar-head h1{
  font-size:12px;
  margin:0 0 6px;
  line-height:1.5;
  color:var(--white);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.sidebar-head p{
  margin:0;
  font-size:15px;
  color:var(--gray-3);
  font-family:'VT323',monospace;
  white-space:nowrap;
  overflow:hidden;
}
.sidebar-head .brand-text{min-width:0; overflow:hidden;}
.sidebar.collapsed .brand-text{display:none;}

.collapse-btn{
  flex:none;
  width:26px; height:26px;
  border-radius:4px;
  border:1px solid var(--line);
  background:var(--panel-2);
  color:var(--gray-2);
  cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:transform .28s ease, background .15s ease, color .15s ease;
}
.collapse-btn:hover{background:var(--panel-3); color:var(--white);}
.collapse-btn svg{width:13px;height:13px;}
.sidebar.collapsed .collapse-btn svg{transform:rotate(180deg);}

.nav-group{padding:10px 0 6px;}
.nav-label{
  font-family:'Press Start 2P',monospace;
  font-size:8.5px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--gray-4);
  padding:14px 16px 8px;
  white-space:nowrap;
  overflow:hidden;
}
.sidebar.collapsed .nav-label{opacity:0; height:0; padding-top:0; padding-bottom:0; overflow:hidden;}
.nav-btn{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  text-align:left;
  background:none;
  border:none;
  color:var(--gray-2);
  font-family:'VT323',monospace;
  font-size:17px;
  padding:9px 16px 9px 14px;
  cursor:pointer;
  border-left:3px solid transparent;
  transition:background .12s, color .12s, border-color .12s;
  white-space:nowrap;
  overflow:hidden;
}
.nav-btn .num{
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  color:var(--gray-4);
  width:20px;
  flex:none;
}
.nav-btn:hover{background:var(--panel-2); color:var(--white);}
.nav-btn.active{
  background:var(--panel-3);
  border-left-color:var(--white);
  color:var(--white);
}
.sidebar-foot{
  padding:14px 16px 20px;
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  color:var(--gray-4);
  border-top:1px solid var(--line-soft);
  margin-top:10px;
  white-space:nowrap;
  overflow:hidden;
}
.sidebar-foot .decode{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--gray-2);
  letter-spacing:.02em;
}
.sidebar-foot .decode .cursor{
  display:inline-block; width:6px; height:11px;
  background:var(--gray-2); margin-left:2px; vertical-align:-1px;
  animation:blink 1s steps(1) infinite;
}
@keyframes blink{50%{opacity:0;}}

/* ===== MAIN ===== */
.main{
  flex:1;
  min-width:0;
  position:relative;
  background:var(--black);
}
.topbar{
  position:sticky;
  top:0;
  z-index:5;
  background:rgba(10,10,10,.86);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line-soft);
  padding:16px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.topbar .crumbs{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--gray-3);
  letter-spacing:.06em;
  text-transform:uppercase;
}
.topbar .pagebadge{
  font-family:'Press Start 2P',monospace;
  font-size:9px;
  color:var(--black);
  background:var(--gray-1);
  padding:5px 9px;
  border-radius:3px;
}
.content{
  max-width:880px;
  margin:0 auto;
  padding:40px 40px 110px;
  position:relative;
  z-index:2;
}
.page{display:none;}
.page.active{display:block; animation:fade .25s ease;}
@keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

.page h2.title{
  font-family:'Press Start 2P',monospace;
  font-size:22px;
  line-height:1.6;
  margin:0 0 14px;
  color:var(--white);
  text-shadow:0 0 20px var(--glow);
}
.page .sub{
  color:var(--gray-2);
  font-size:18px;
  margin:0 0 30px;
  max-width:640px;
  font-family:'VT323',monospace;
}
.tear{
  border:none;
  border-top:1px dashed var(--line);
  margin:30px 0;
}

/* formula cards */
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-left:4px solid var(--gray-1);
  border-radius:4px;
  padding:20px 22px;
  margin:0 0 22px;
  box-shadow:var(--shadow);
}
.card h3{
  margin:0 0 12px;
  font-size:13px;
  line-height:1.6;
  color:var(--white);
  display:flex;
  align-items:center;
  gap:10px;
}
.card h3 .pin{
  font-family:'Press Start 2P',monospace;
  font-size:8px;
  background:var(--gray-1);
  color:var(--black);
  padding:4px 7px;
  border-radius:3px;
  letter-spacing:.02em;
}
.formula{
  display:block;
  font-size:18px;
  font-weight:600;
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:4px;
  padding:12px 16px;
  margin:6px 0 14px;
  color:var(--white);
  overflow-x:auto;
}
.card .row{margin:10px 0; font-size:17.5px;}
.card .row b{
  font-family:'Press Start 2P',monospace;
  font-size:9.5px;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:var(--gray-3);
  display:block;
  margin-bottom:5px;
}
.card .remember{
  background:var(--panel-2);
  border:1px dashed var(--gray-3);
  border-radius:4px;
  padding:9px 12px;
  font-size:17px;
}
.card .example{
  font-family:'JetBrains Mono',monospace;
  font-size:13.5px;
  background:var(--panel-3);
  border:1px solid var(--line);
  border-radius:4px;
  padding:9px 12px;
  color:var(--gray-1);
}

/* mistakes */
.mistake{
  display:flex;
  gap:16px;
  background:var(--panel);
  border:1px solid var(--line);
  border-left:4px solid var(--gray-2);
  border-radius:4px;
  padding:16px 18px;
  margin-bottom:14px;
}
.mistake .no{
  font-family:'Press Start 2P',monospace;
  color:var(--white);
  font-size:12px;
  flex:none;
}
.mistake .wrong{color:var(--gray-3); font-family:'JetBrains Mono',monospace; font-size:13.5px;}
.mistake .right{color:var(--white); font-family:'JetBrains Mono',monospace; font-size:13.5px;}

/* top 100 */
.fact-group{margin-bottom:28px;}
.fact-group h3{
  color:var(--white);
  border-bottom:1px solid var(--line);
  padding-bottom:8px;
  font-size:12px;
}
.fact-list{list-style:none; margin:14px 0 0; padding:0; counter-reset:fact;}
.fact-list li{
  counter-increment:fact;
  padding:8px 0 8px 42px;
  position:relative;
  border-bottom:1px solid var(--line-soft);
  font-size:17.5px;
}
.fact-list li::before{
  content:counter(fact);
  position:absolute;
  left:0; top:7px;
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  color:var(--black);
  background:var(--gray-2);
  width:24px; height:24px;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
}

/* cram sheet grid */
.cram-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
.cram-cell{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:4px;
  padding:12px 14px;
}
.cram-cell h4{
  margin:0 0 8px;
  font-size:10px;
  color:var(--white);
  font-family:'Press Start 2P',monospace;
  text-transform:uppercase;
  letter-spacing:.02em;
}
.cram-cell .f{
  font-family:'JetBrains Mono',monospace;
  font-size:13px;
  display:block;
  margin:4px 0;
  color:var(--gray-1);
}
@media(max-width:640px){.cram-grid{grid-template-columns:1fr;}}

/* checklist (night before) */
.checklist{list-style:none; margin:0; padding:0;}
.checklist li{
  display:flex; gap:12px; align-items:flex-start;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:4px;
  padding:12px 14px;
  margin-bottom:10px;
  font-size:17.5px;
}
.checklist .box{
  flex:none; width:18px; height:18px;
  border:2px solid var(--gray-2);
  border-radius:3px;
  margin-top:3px;
}
.timebox{
  font-family:'Press Start 2P',monospace;
  font-size:8px;
  color:var(--black);
  background:var(--gray-1);
  padding:4px 8px;
  border-radius:3px;
  margin-right:10px;
  white-space:nowrap;
}

/* practice tests */
.qcard{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:4px;
  padding:16px 18px;
  margin-bottom:14px;
}
.qcard .qhead{
  display:flex; gap:10px; align-items:baseline;
  font-family:'VT323',monospace;
  font-weight:600;
  font-size:19px;
  margin-bottom:8px;
}
.qcard .qnum{
  font-family:'Press Start 2P',monospace;
  color:var(--black);
  background:var(--gray-1);
  border-radius:3px;
  padding:3px 8px;
  font-size:9px;
}
.qcard details{
  margin-top:10px;
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:4px;
  padding:8px 12px;
}
.qcard summary{
  cursor:pointer;
  font-family:'Press Start 2P',monospace;
  font-size:9px;
  color:var(--white);
}
.qcard .ans{
  font-family:'JetBrains Mono',monospace;
  font-size:13.5px;
  margin-top:8px;
  color:var(--gray-1);
}

.callout{
  background:var(--panel);
  border-left:3px solid var(--gray-1);
  border-radius:4px;
  padding:12px 16px;
  margin:16px 0;
  font-size:17px;
}
.callout.warn{border-left-color:var(--gray-2);}
.callout.tip{border-left-color:var(--gray-3);}

/* vocab / step lists (new) */
.vocab-list{list-style:none; margin:10px 0 0; padding:0;}
.vocab-list li{
  padding:8px 0;
  border-bottom:1px solid var(--line-soft);
  font-size:17.5px;
}
.vocab-list li b{color:var(--white); font-family:'JetBrains Mono',monospace; font-size:15px;}
.steps-list{margin:10px 0 0; padding-left:22px;}
.steps-list li{margin-bottom:8px; font-size:17.5px;}
.tag-pill{
  display:inline-block;
  font-family:'Press Start 2P',monospace;
  font-size:8px;
  letter-spacing:.03em;
  color:var(--gray-3);
  border:1px solid var(--line);
  border-radius:3px;
  padding:3px 7px;
  margin:2px 6px 2px 0;
}

/* graphs (new) */
.graph-wrap{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:4px;
  padding:14px;
  margin:10px 0 18px;
  box-shadow:var(--shadow);
}
.graph-wrap svg{display:block; width:100%; height:auto;}
.graph-caption{
  font-family:'JetBrains Mono',monospace;
  font-size:12.5px;
  color:var(--gray-3);
  text-align:center;
  margin-top:8px;
}
.graph-row{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;}
.graph-row .graph-wrap{margin:0;}
@media(max-width:760px){.graph-row{grid-template-columns:1fr;}}

/* quiz (new) */
.quiz-q{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:4px;
  padding:14px 16px;
  margin-bottom:12px;
}
.quiz-q .qn{font-size:17.5px; color:var(--gray-1); margin-bottom:8px;}
.quiz-q .opts{display:flex; flex-direction:column; gap:6px; margin-bottom:8px;}
.quiz-q .opt{
  font-family:'JetBrains Mono',monospace;
  font-size:13.5px;
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:4px;
  padding:7px 10px;
}
.quiz-q details{
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:4px;
  padding:8px 12px;
}
.quiz-q summary{cursor:pointer; font-family:'Press Start 2P',monospace; font-size:9px; color:var(--white);}
.quiz-q .ans{font-family:'JetBrains Mono',monospace; font-size:13.5px; margin-top:8px; color:var(--gray-1);}

/* calculator (new) */
.calc-screen{
  background:var(--black);
  border:1px solid var(--line);
  border-radius:4px;
  padding:16px;
  margin-bottom:12px;
  text-align:right;
}
.calc-screen .calc-hist{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  color:var(--gray-3);
  min-height:16px;
  overflow-x:auto;
  white-space:nowrap;
}
.calc-screen .calc-expr{
  font-family:'JetBrains Mono',monospace;
  font-size:28px;
  color:var(--white);
  overflow-x:auto;
  white-space:nowrap;
  margin-top:4px;
}
.calc-grid{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:8px;
}
.calc-btn{
  font-family:'JetBrains Mono',monospace;
  font-size:16px;
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:4px;
  color:var(--gray-1);
  padding:14px 0;
  cursor:pointer;
  transition:background .1s, color .1s, transform .05s;
}
.calc-btn:hover{background:var(--panel-3); color:var(--white);}
.calc-btn:active{transform:scale(.95);}
.calc-btn.op{color:var(--white); border-color:var(--gray-3);}
.calc-btn.eq{background:var(--gray-1); color:var(--black); font-weight:700; border-color:var(--gray-1);}
.calc-btn.eq:hover{background:var(--white);}
.calc-btn.wide{grid-column:span 2;}

.tool-tabs{display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 16px;}
.tool-tab{
  font-family:'Press Start 2P',monospace;
  font-size:8.5px;
  letter-spacing:.02em;
  background:var(--panel-2);
  border:1px solid var(--line);
  color:var(--gray-2);
  padding:9px 12px;
  border-radius:4px;
  cursor:pointer;
}
.tool-tab:hover{color:var(--white);}
.tool-tab.active{background:var(--gray-1); color:var(--black); border-color:var(--gray-1);}
.tool-body{display:none;}
.tool-body.active{display:block;}
.tool-fields{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;}
.tool-field label{
  display:block;
  font-family:'Press Start 2P',monospace;
  font-size:8.5px;
  color:var(--gray-3);
  margin-bottom:6px;
  letter-spacing:.02em;
}
.tool-field input{
  width:100%;
  font-family:'JetBrains Mono',monospace;
  font-size:15px;
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:4px;
  color:var(--white);
  padding:8px 10px;
}
.tool-field input:focus{outline:none; border-color:var(--gray-1);}
.tool-go{
  font-family:'Press Start 2P',monospace;
  font-size:9.5px;
  background:var(--gray-1);
  color:var(--black);
  border:none;
  border-radius:4px;
  padding:11px 18px;
  cursor:pointer;
  margin-bottom:14px;
}
.tool-go:hover{background:var(--white);}
.result-box{
  background:var(--panel-2);
  border:1px dashed var(--gray-3);
  border-radius:4px;
  padding:12px 14px;
  font-family:'JetBrains Mono',monospace;
  font-size:14.5px;
  color:var(--gray-1);
  min-height:20px;
  white-space:pre-line;
}
@media(max-width:600px){.tool-fields{grid-template-columns:1fr;}}

/* TI-84+ style calculator additions (new) */
.ti-tabs{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 20px;}
.ti-tab{
  font-family:'Press Start 2P',monospace;
  font-size:9px;
  letter-spacing:.02em;
  background:var(--panel-2);
  border:1px solid var(--line);
  color:var(--gray-2);
  padding:10px 14px;
  border-radius:4px;
  cursor:pointer;
}
.ti-tab:hover{color:var(--white);}
.ti-tab.active{background:var(--gray-1); color:var(--black); border-color:var(--gray-1);}
.ti-mode{display:none;}
.ti-mode.active{display:block;}
.calc-modebar{display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; align-items:center;}
.mode-pill{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  background:var(--panel-2);
  border:1px solid var(--line);
  color:var(--gray-2);
  padding:5px 10px;
  border-radius:3px;
  cursor:pointer;
}
.mode-pill.active{background:var(--gray-1); color:var(--black); border-color:var(--gray-1);}
.calc-grid-6{grid-template-columns:repeat(6, 1fr);}
.calc-btn.fn{font-size:12px; padding:10px 0; color:var(--gray-1); border-color:var(--line);}
.calc-btn.fn:hover{color:var(--white);}
@media(max-width:700px){.calc-grid-6{grid-template-columns:repeat(3, 1fr);}}
#graphCanvas, #regCanvas{width:100%; height:auto; display:block; background:var(--black); border-radius:4px;}

table.regtable{width:100%; border-collapse:collapse; margin:14px 0; font-size:16.5px;}
table.regtable th, table.regtable td{border:1px solid var(--line); padding:8px 10px; text-align:left;}
table.regtable th{background:var(--panel-3); color:var(--white); font-family:'Press Start 2P',monospace; font-size:9px; letter-spacing:.02em;}
table.regtable tr:nth-child(even) td{background:var(--panel-2);}

@media(max-width:860px){
  .shell{flex-direction:column;}
  .sidebar{width:100%; height:auto; position:relative;}
  .content{padding:24px 18px 80px;}
  .topbar{padding:12px 18px;}
}
</style>

<template id="tpl-orderops">
  <h2 class="title">Order of Operations</h2>
  <p class="sub">The agreed-upon sequence for evaluating any expression, so everyone gets the same answer from the same problem.</p>

  <div class="card">
    <h3><span class="pin">RULE</span> PEMDAS</h3>
    <span class="formula">Parentheses → Exponents → Multiplication/Division (left→right) → Addition/Subtraction (left→right)</span>
    <div class="row"><b>What it means</b> Work the innermost grouping symbols first, then powers and roots, then all multiplying and dividing in the order they appear, then all adding and subtracting in the order they appear.</div>
    <div class="row"><b>When to use it</b> Every time you simplify a numerical or algebraic expression with more than one operation.</div>
    <div class="remember"><b>Remember it:</b> "Please Excuse My Dear Aunt Sally" — but Multiplication/Division are a tied pair (do them left to right), and so are Addition/Subtraction.</div>
  </div>

  <div class="card">
    <h3>Vocabulary</h3>
    <ul class="vocab-list">
      <li><b>Expression</b> — a math phrase with numbers, variables, and operations but no equals sign.</li>
      <li><b>Grouping symbol</b> — parentheses ( ), brackets [ ], or a fraction bar; work inside these first.</li>
      <li><b>Exponent</b> — tells how many times a base multiplies itself.</li>
    </ul>
  </div>

  <div class="qcard"><div class="qhead"><span class="qnum">EASY</span> Evaluate: 3 + 4 × 2</div>
  <details><summary>Show Answer</summary><div class="ans">Multiply first: 4×2=8, then add: 3+8 = 11</div></details></div>

  <div class="qcard"><div class="qhead"><span class="qnum">MEDIUM</span> Evaluate: (5 + 3)² − 2 × 6</div>
  <details><summary>Show Answer</summary><div class="ans">Parentheses: 8² = 64, then 64 − 12 = 52</div></details></div>

  <div class="qcard"><div class="qhead"><span class="qnum">HARD</span> Evaluate: 4 + [2(9 − 5)]² ÷ 8</div>
  <details><summary>Show Answer</summary><div class="ans">Inner parens: 9−5=4 → 2(4)=8 → 8²=64 → 64÷8=8 → 4+8=12</div></details></div>

  <div class="callout"><b>What if we change something?</b> Move the exponent onto only part of the expression, add a negative sign out front, or nest a fraction bar as a grouping symbol — each one changes which piece gets evaluated first, but the P→E→MD→AS order itself never changes.</div>

  <div class="mistake"><div class="no">!</div><div><b>Most common mistake:</b> treating multiplication as always before division (or addition always before subtraction). They're tied ranks — work left to right.<br><span class="wrong">Wrong: 8 ÷ 4 × 2 = 8 ÷ 8 = 1</span><br><span class="right">Right: left to right → 8 ÷ 4 = 2, then 2 × 2 = 4</span></div></div>

  <div class="card"><h3>Real-World Application</h3><div class="row">A phone plan costs $20 plus $0.10 per text: total = 20 + 0.10 × (number of texts). PEMDAS is exactly why you multiply the per-text rate by the count before adding the base fee — reversing the order would badly overcharge or undercharge.</div></div>
</template>

<template id="tpl-integersabs">
  <h2 class="title">Integers &amp; Absolute Value</h2>
  <p class="sub">Rules for adding, subtracting, multiplying, and dividing positive and negative numbers, plus how far a number sits from zero.</p>

  <div class="card">
    <h3><span class="pin">RULE</span> Adding &amp; Subtracting Integers</h3>
    <div class="row"><b>Same signs</b> add the numbers, keep the sign. <b>Different signs</b> subtract the smaller absolute value from the larger, keep the sign of the bigger one.</div>
    <div class="remember"><b>Remember it:</b> Subtracting is "add the opposite" — a − b = a + (−b).</div>
    <div class="example">−7 + 3 = −4      5 − 9 = 5 + (−9) = −4</div>
  </div>

  <div class="card">
    <h3><span class="pin">RULE</span> Multiplying &amp; Dividing Integers</h3>
    <span class="formula">(same signs) → positive     (different signs) → negative</span>
    <div class="remember"><b>Remember it:</b> Count the negative signs — an even number of negatives gives a positive result, an odd number gives a negative result.</div>
    <div class="example">(−3)(−4) = 12      (−3)(4) = −12      −20 ÷ (−5) = 4</div>
  </div>

  <div class="card">
    <h3><span class="pin">DEFINITION</span> Absolute Value</h3>
    <span class="formula">|a| = distance from a to 0 on the number line (always ≥ 0)</span>
    <div class="remember"><b>Remember it:</b> Absolute value bars erase the sign — whatever is inside comes out non-negative.</div>
    <div class="example">|−8| = 8      |8| = 8      −|−5| = −5 (the outside negative still applies after the bars strip the inside)</div>
  </div>

  <div class="graph-wrap">
    <svg viewBox="0 0 320 90" xmlns="http://www.w3.org/2000/svg">
      <line x1="20" y1="45" x2="300" y2="45" stroke="#6a6a6c" stroke-width="1.5"/>
      <g stroke="#6a6a6c" stroke-width="1.5">
        <line x1="60" y1="40" x2="60" y2="50"/><line x1="100" y1="40" x2="100" y2="50"/>
        <line x1="140" y1="40" x2="140" y2="50"/><line x1="180" y1="40" x2="180" y2="50"/>
        <line x1="220" y1="40" x2="220" y2="50"/><line x1="260" y1="40" x2="260" y2="50"/>
      </g>
      <g font-family="JetBrains Mono, monospace" font-size="11" fill="#9a9a9c" text-anchor="middle">
        <text x="60" y="65">-4</text><text x="100" y="65">-2</text><text x="140" y="65">0</text>
        <text x="180" y="65">2</text><text x="220" y="65">4</text><text x="260" y="65">6</text>
      </g>
      <circle cx="60" cy="45" r="5" fill="#f0f0f0"/>
      <path d="M60,20 L140,20" stroke="#f0f0f0" stroke-width="2" stroke-dasharray="3,3"/>
      <text x="100" y="14" font-family="JetBrains Mono, monospace" font-size="11" fill="#f0f0f0" text-anchor="middle">distance = 4</text>
    </svg>
    <div class="graph-caption">|−4| measures the 4 units between −4 and 0 — the distance is always positive.</div>
  </div>

  <div class="qcard"><div class="qhead"><span class="qnum">EASY</span> Simplify: −6 + (−2)</div>
  <details><summary>Show Answer</summary><div class="ans">−8 (same signs, add and keep the sign)</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">MEDIUM</span> Simplify: |−9| − |4|</div>
  <details><summary>Show Answer</summary><div class="ans">9 − 4 = 5</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">HARD</span> Simplify: −3(−2) − |−10| ÷ 2</div>
  <details><summary>Show Answer</summary><div class="ans">6 − 5 = 1</div></details></div>

  <div class="mistake"><div class="no">!</div><div><b>Most common mistake:</b> assuming absolute value bars make everything inside AND outside positive.<br><span class="wrong">Wrong: −|3| = 3</span><br><span class="right">Right: −|3| = −(3) = −3 — only what's inside the bars gets flipped positive</span></div></div>
</template>

<template id="tpl-fracdec">
  <h2 class="title">Fractions &amp; Decimals</h2>
  <p class="sub">Converting between the two forms and operating on fractions cleanly.</p>

  <div class="card">
    <h3><span class="pin">RULE</span> Adding/Subtracting Fractions</h3>
    <span class="formula">a/b ± c/d = (ad ± bc) / bd  (using a common denominator)</span>
    <div class="remember"><b>Remember it:</b> Find a common denominator first — you can never add or subtract fraction "tops" until the "bottoms" match.</div>
    <div class="example">1/4 + 1/6 → common denominator 12 → 3/12 + 2/12 = 5/12</div>
  </div>

  <div class="card">
    <h3><span class="pin">RULE</span> Multiplying/Dividing Fractions</h3>
    <span class="formula">a/b · c/d = ac/bd       a/b ÷ c/d = a/b · d/c</span>
    <div class="remember"><b>Remember it:</b> "Keep, Change, Flip" for division — keep the first fraction, change ÷ to ×, flip the second fraction.</div>
    <div class="example">2/3 ÷ 4/5 = 2/3 · 5/4 = 10/12 = 5/6</div>
  </div>

  <div class="card">
    <h3><span class="pin">CONVERSION</span> Fraction ⇄ Decimal</h3>
    <div class="row">Fraction → decimal: divide the numerator by the denominator. Decimal → fraction: write the decimal over a power of 10 matching its place value, then simplify.</div>
    <div class="example">3/8 = 0.375      0.375 = 375/1000 = 3/8</div>
  </div>

  <div class="qcard"><div class="qhead"><span class="qnum">EASY</span> Add: 1/2 + 1/4</div>
  <details><summary>Show Answer</summary><div class="ans">2/4 + 1/4 = 3/4</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">MEDIUM</span> Multiply: 3/5 × 2/9</div>
  <details><summary>Show Answer</summary><div class="ans">6/45 = 2/15</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">HARD</span> Simplify: (2/3 + 1/6) ÷ 5/4</div>
  <details><summary>Show Answer</summary><div class="ans">4/6+1/6=5/6 → 5/6 ÷ 5/4 = 5/6 × 4/5 = 20/30 = 2/3</div></details></div>

  <div class="mistake"><div class="no">!</div><div><b>Most common mistake:</b> adding fractions by adding tops and bottoms straight across.<br><span class="wrong">Wrong: 1/2 + 1/3 = 2/5</span><br><span class="right">Right: common denominator 6 → 3/6 + 2/6 = 5/6</span></div></div>
</template>

<template id="tpl-scinotation">
  <h2 class="title">Scientific Notation</h2>
  <p class="sub">A compact way to write very large or very small numbers.</p>

  <div class="card">
    <h3><span class="pin">FORMULA</span> Scientific Notation Form</h3>
    <span class="formula">a × 10<sup>n</sup>,  where 1 ≤ a &lt; 10 and n is an integer</span>
    <div class="row"><b>What it means</b> A single-digit-times-a-power-of-ten way to write huge or tiny numbers without a long string of zeros.</div>
    <div class="remember"><b>Remember it:</b> Positive exponent → big number (move decimal right). Negative exponent → small number (move decimal left).</div>
    <div class="example">4,500,000 = 4.5 × 10⁶      0.00032 = 3.2 × 10⁻⁴</div>
  </div>

  <div class="card">
    <h3><span class="pin">RULE</span> Multiplying/Dividing in Scientific Notation</h3>
    <span class="formula">(a×10<sup>m</sup>)(b×10<sup>n</sup>) = (ab) × 10<sup>m+n</sup></span>
    <div class="row">Multiply (or divide) the front numbers, and add (or subtract) the exponents — then re-adjust if the front number isn't between 1 and 10 anymore.</div>
    <div class="example">(2×10³)(3×10⁴) = 6×10⁷</div>
  </div>

  <div class="qcard"><div class="qhead"><span class="qnum">EASY</span> Write 62,000 in scientific notation.</div>
  <details><summary>Show Answer</summary><div class="ans">6.2 × 10⁴</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">MEDIUM</span> Write 0.0007 in scientific notation.</div>
  <details><summary>Show Answer</summary><div class="ans">7 × 10⁻⁴</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">HARD</span> Simplify (5×10⁶)(4×10⁻²) and rewrite properly.</div>
  <details><summary>Show Answer</summary><div class="ans">20×10⁴ = 2×10⁵ (re-adjust since 20 isn't between 1 and 10)</div></details></div>

  <div class="card"><h3>Real-World Application</h3><div class="row">Scientists write the distance from Earth to the sun (about 93,000,000 miles) as 9.3 × 10⁷ miles, and the mass of a single atom (unimaginably small) with a negative exponent — scientific notation is what makes both numbers usable in a calculation.</div></div>
</template>

<template id="tpl-expressions">
  <h2 class="title">Expressions: Simplifying &amp; Combining</h2>
  <p class="sub">Cleaning up an expression before you ever try to solve anything.</p>

  <div class="card">
    <h3><span class="pin">RULE</span> Combining Like Terms</h3>
    <div class="row"><b>What it means</b> Terms with the exact same variable(s) raised to the exact same power(s) can be added or subtracted together.</div>
    <div class="remember"><b>Remember it:</b> Think of like terms as the same "type" of object — you can add 3 apples + 2 apples, but not 3 apples + 2 oranges.</div>
    <div class="example">3x + 5x − 2 = 8x − 2      4x² + 3x − x² = 3x² + 3x</div>
  </div>

  <div class="card">
    <h3><span class="pin">RULE</span> Distributive Property</h3>
    <span class="formula">a(b + c) = ab + ac</span>
    <div class="row">Multiply the outside term by every term inside the parentheses before combining anything.</div>
    <div class="remember"><b>Remember it:</b> A negative sign out front distributes into every term, flipping every sign inside.</div>
    <div class="example">3(2x − 5) = 6x − 15      −(x − 4) = −x + 4</div>
  </div>

  <div class="qcard"><div class="qhead"><span class="qnum">EASY</span> Simplify: 4x + 3 + 2x − 1</div>
  <details><summary>Show Answer</summary><div class="ans">6x + 2</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">MEDIUM</span> Simplify: 3(x + 4) − 2x</div>
  <details><summary>Show Answer</summary><div class="ans">3x + 12 − 2x = x + 12</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">HARD</span> Simplify: 2(3x − 1) − 4(x + 5)</div>
  <details><summary>Show Answer</summary><div class="ans">6x − 2 − 4x − 20 = 2x − 22</div></details></div>

  <div class="callout"><b>What if we change something?</b> Swap the sign out front (2(...) vs. −2(...)), swap a term from inside to outside the parentheses, or introduce a fraction as the multiplier — each changes what gets distributed, but "multiply everything inside, then combine like terms" always applies.</div>

  <div class="mistake"><div class="no">!</div><div><b>Most common mistake:</b> distributing to only the first term inside the parentheses.<br><span class="wrong">Wrong: 3(x + 4) = 3x + 4</span><br><span class="right">Right: 3(x + 4) = 3x + 12</span></div></div>
</template>

<template id="tpl-equations">
  <h2 class="title">Multi-Step Equations &amp; Literal Equations</h2>
  <p class="sub">Solving for a variable when it takes more than one move — including when the variable shows up on both sides, or you're solving for a letter instead of a number.</p>

  <div class="card">
    <h3><span class="pin">STEPS</span> Solving a Multi-Step Equation</h3>
    <ol class="steps-list">
      <li>Distribute to clear any parentheses.</li>
      <li>Combine like terms on each side separately.</li>
      <li>Move variable terms to one side (undo by adding/subtracting).</li>
      <li>Move constants to the other side.</li>
      <li>Divide both sides by the coefficient on the variable.</li>
    </ol>
    <div class="remember"><b>Remember it:</b> "Whatever you do to one side, do to the other" — every move must keep the equation balanced.</div>
  </div>

  <div class="card">
    <h3><span class="pin">RULE</span> Variables on Both Sides</h3>
    <div class="row">Move every variable term to one side first (usually the side that keeps the coefficient positive), then solve normally.</div>
    <div class="example">5x + 3 = 2x + 18 → 3x + 3 = 18 → 3x = 15 → x = 5</div>
  </div>

  <div class="card">
    <h3><span class="pin">RULE</span> Literal Equations</h3>
    <div class="row">A literal equation has more than one variable — solve for the one requested exactly like any other equation, treating the other letters as if they were numbers.</div>
    <div class="example">Solve for h: A = ½bh → 2A = bh → h = 2A/b</div>
  </div>

  <div class="qcard"><div class="qhead"><span class="qnum">EASY</span> Solve: 4x − 3 = 13</div>
  <details><summary>Show Answer</summary><div class="ans">4x = 16 → x = 4</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">MEDIUM</span> Solve: 3(x − 2) = 2x + 1</div>
  <details><summary>Show Answer</summary><div class="ans">3x − 6 = 2x + 1 → x = 7</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">HARD</span> Solve for r: C = 2πr</div>
  <details><summary>Show Answer</summary><div class="ans">r = C / (2π)</div></details></div>

  <div class="callout"><b>What if we change something?</b> 2x − 5 = 17 (subtraction), −2x + 5 = 17 (negative coefficient), 2(x+5)=17 (parentheses), (2/3)x + 5 = 17 (fraction), or 2x + 5 &lt; 17 (inequality) — each variation changes one move in the process, but never the balanced-both-sides logic.</div>

  <div class="mistake"><div class="no">!</div><div><b>Most common mistake:</b> forgetting a "no solution" or "infinite solutions" case.<br><span class="wrong">Wrong: assuming 2x + 3 = 2x + 7 must have some value of x</span><br><span class="right">Right: subtract 2x from both sides → 3 = 7, a false statement, so there is no solution</span></div></div>

  <div class="card"><h3>Real-World Application</h3><div class="row">Renting a car for a flat fee plus a per-mile rate ($40 + $0.25m = total cost) is a multi-step equation — solving for m tells you exactly how many miles you can drive within a budget.</div></div>
</template>

<template id="tpl-slope">
  <h2 class="title">Slope Formulas</h2>
  <p class="sub">Slope measures how steep a line is and which way it's tilted. Almost every linear topic on the Regents comes back to slope.</p>

  <div class="card">
    <h3><span class="pin">FORMULA</span> The Slope Formula</h3>
    <span class="formula">m = (y&#8322; − y&#8321;) / (x&#8322; − x&#8321;)</span>
    <div class="row"><b>What it means</b> Slope is "rise over run" — how much y changes for every one unit that x changes. A slope of 2 means y climbs 2 for every 1 step right.</div>
    <div class="row"><b>When to use it</b> You're given any two points on a line (or two data points in a table/graph) and need the steepness or rate of change between them.</div>
    <div class="remember"><b>Remember it:</b> "Rise over Run." Write the y's on top, the x's on bottom, and keep point 1 and point 2 in the same order top and bottom.</div>
    <div class="example">Example: (2,3) and (6,11) → m = (11−3)/(6−2) = 8/4 = 2</div>
  </div>

  <div class="card">
    <h3><span class="pin">FORMULA</span> Slope-Intercept Form</h3>
    <span class="formula">y = mx + b</span>
    <div class="row"><b>What it means</b> m is the slope; b is the y-intercept, the point where the line crosses the y-axis (where x = 0).</div>
    <div class="row"><b>When to use it</b> Graphing a line fast, or writing an equation when you already know the slope and where it starts on the y-axis.</div>
    <div class="remember"><b>Remember it:</b> "b is where you Begin" (on the y-axis); m is how much you Move each step right.</div>
    <div class="example">Example: slope 3, y-intercept −2 → y = 3x − 2</div>
  </div>

  <div class="card">
    <h3><span class="pin">FORMULA</span> Point-Slope Form</h3>
    <span class="formula">y − y&#8321; = m(x − x&#8321;)</span>
    <div class="row"><b>What it means</b> Builds a line's equation directly from one known point and the slope — no y-intercept needed.</div>
    <div class="row"><b>When to use it</b> You have a slope and a single point (not necessarily the y-intercept).</div>
    <div class="remember"><b>Remember it:</b> "Minus what you know." Whatever point you're given gets subtracted straight into the formula.</div>
    <div class="example">Example: slope 3 through (2,1) → y − 1 = 3(x − 2)</div>
  </div>

  <div class="card">
    <h3><span class="pin">FORMULA</span> Standard Form</h3>
    <span class="formula">Ax + By = C</span>
    <div class="row"><b>What it means</b> A general way to write a line, useful for solving systems by elimination and for reading intercepts quickly.</div>
    <div class="row"><b>When to use it</b> Solving systems of equations, or finding both intercepts fast (set x = 0 for the y-intercept, set y = 0 for the x-intercept).</div>
    <div class="remember"><b>Remember it:</b> A, B, C — alphabetical order — and A is usually kept positive with no fractions.</div>
  </div>

  <div class="card">
    <h3><span class="pin">RULE</span> Parallel &amp; Perpendicular Slopes</h3>
    <span class="formula">Parallel: m&#8321; = m&#8322;    Perpendicular: m&#8321; · m&#8322; = −1</span>
    <div class="row"><b>What it means</b> Parallel lines tilt exactly the same amount and never cross. Perpendicular lines meet at a right angle, and their slopes are negative reciprocals of each other.</div>
    <div class="row"><b>When to use it</b> Any question that describes two lines' relationship, or asks you to write an equation parallel/perpendicular to a given line.</div>
    <div class="remember"><b>Remember it:</b> "Parallel = pals, same slope forever." For perpendicular: flip the fraction, then flip the sign.</div>
    <div class="example">Example: a line has slope 2/3 → a perpendicular line has slope −3/2</div>
  </div>
</template>

<template id="tpl-distance">
  <h2 class="title">Distance Formula</h2>
  <p class="sub">Finds the straight-line length between any two points on the coordinate plane.</p>
  <div class="card">
    <h3><span class="pin">FORMULA</span> Distance Between Two Points</h3>
    <span class="formula">d = √[(x&#8322; − x&#8321;)&sup2; + (y&#8322; − y&#8321;)&sup2;]</span>
    <div class="row"><b>What it means</b> It's the Pythagorean theorem in disguise. The horizontal gap (x&#8322;−x&#8321;) and vertical gap (y&#8322;−y&#8321;) are the two legs of a right triangle, and the distance between the points is the hypotenuse.</div>
    <div class="row"><b>When to use it</b> Finding the length of a segment on a graph, the perimeter of a shape given its coordinates, or checking whether a figure has equal sides (e.g., proving a triangle is isosceles).</div>
    <div class="remember"><b>Remember it:</b> Picture a right triangle stretched between the two points — it's just a² + b² = c² with a and b as the coordinate differences.</div>
    <div class="example">Example: (1,2) and (4,6) → d = √[(4−1)² + (6−2)²] = √(9+16) = √25 = 5</div>
  </div>
  <div class="callout">On the Regents, distance-formula questions are often disguised as "find the perimeter" or "is this a right triangle" problems — the formula is the same either way.</div>
</template>

<template id="tpl-midpoint">
  <h2 class="title">Midpoint Formula</h2>
  <p class="sub">Finds the exact center point between two coordinates.</p>
  <div class="card">
    <h3><span class="pin">FORMULA</span> Midpoint of a Segment</h3>
    <span class="formula">M = ( (x&#8321;+x&#8322;)/2 , (y&#8321;+y&#8322;)/2 )</span>
    <div class="row"><b>What it means</b> The midpoint is just the average of the two x-coordinates and the average of the two y-coordinates.</div>
    <div class="row"><b>When to use it</b> Finding the center of a segment, or the center of a circle when you're given the endpoints of a diameter.</div>
    <div class="remember"><b>Remember it:</b> "Average the x's, average the y's." No subtraction anywhere — that's how you know it's not the distance formula.</div>
    <div class="example">Example: (2,3) and (8,7) → M = ((2+8)/2, (3+7)/2) = (5, 5)</div>
  </div>
</template>

<template id="tpl-inequalities">
  <h2 class="title">Inequalities</h2>
  <p class="sub">Like equations, but the solution is usually a whole range of values instead of one number.</p>

  <div class="card">
    <h3><span class="pin">RULE</span> Solving Inequalities</h3>
    <div class="row">Solve exactly like an equation — <b>except</b> multiplying or dividing both sides by a negative number flips the direction of the inequality sign.</div>
    <div class="remember"><b>Remember it:</b> "Negative flips it." Nothing else about the process changes.</div>
    <div class="example">−2x + 5 &lt; 11 → −2x &lt; 6 → x &gt; −3 (flipped because we divided by −2)</div>
  </div>

  <div class="card">
    <h3><span class="pin">RULE</span> Compound &amp; Absolute Value Inequalities</h3>
    <div class="row"><b>"And" compound:</b> both conditions must be true (an overlap). <b>"Or" compound:</b> at least one condition is true (two separate regions).</div>
    <div class="row"><b>Absolute value:</b> |x| &lt; a becomes −a &lt; x &lt; a (an "and"); |x| &gt; a becomes x &lt; −a or x &gt; a (an "or").</div>
    <div class="remember"><b>Remember it:</b> "Less than = between (and)." "Greater than = split apart (or)."</div>
    <div class="example">|x − 2| &lt; 5 → −5 &lt; x−2 &lt; 5 → −3 &lt; x &lt; 7</div>
  </div>

  <div class="graph-row">
    <div class="graph-wrap">
      <svg viewBox="0 0 200 90" xmlns="http://www.w3.org/2000/svg">
        <line x1="15" y1="45" x2="185" y2="45" stroke="#6a6a6c" stroke-width="1.5"/>
        <line x1="100" y1="35" x2="100" y2="55" stroke="#6a6a6c" stroke-width="1.5"/>
        <text x="100" y="70" font-family="JetBrains Mono, monospace" font-size="11" fill="#9a9a9c" text-anchor="middle">−3</text>
        <circle cx="100" cy="45" r="5" fill="none" stroke="#f0f0f0" stroke-width="2"/>
        <path d="M100,45 L175,45" stroke="#f0f0f0" stroke-width="3"/>
        <path d="M170,40 L178,45 L170,50" fill="none" stroke="#f0f0f0" stroke-width="2"/>
      </svg>
      <div class="graph-caption">x &gt; −3 : open circle (not included), arrow right</div>
    </div>
    <div class="graph-wrap">
      <svg viewBox="0 0 200 90" xmlns="http://www.w3.org/2000/svg">
        <line x1="15" y1="45" x2="185" y2="45" stroke="#6a6a6c" stroke-width="1.5"/>
        <line x1="100" y1="35" x2="100" y2="55" stroke="#6a6a6c" stroke-width="1.5"/>
        <text x="100" y="70" font-family="JetBrains Mono, monospace" font-size="11" fill="#9a9a9c" text-anchor="middle">2</text>
        <circle cx="100" cy="45" r="5" fill="#f0f0f0"/>
        <path d="M100,45 L25,45" stroke="#f0f0f0" stroke-width="3"/>
        <path d="M30,40 L22,45 L30,50" fill="none" stroke="#f0f0f0" stroke-width="2"/>
      </svg>
      <div class="graph-caption">x ≤ 2 : filled circle (included), arrow left</div>
    </div>
    <div class="graph-wrap">
      <svg viewBox="0 0 200 90" xmlns="http://www.w3.org/2000/svg">
        <line x1="15" y1="45" x2="185" y2="45" stroke="#6a6a6c" stroke-width="1.5"/>
        <line x1="70" y1="35" x2="70" y2="55" stroke="#6a6a6c" stroke-width="1.5"/>
        <line x1="130" y1="35" x2="130" y2="55" stroke="#6a6a6c" stroke-width="1.5"/>
        <text x="70" y="70" font-family="JetBrains Mono, monospace" font-size="11" fill="#9a9a9c" text-anchor="middle">−1</text>
        <text x="130" y="70" font-family="JetBrains Mono, monospace" font-size="11" fill="#9a9a9c" text-anchor="middle">4</text>
        <circle cx="70" cy="45" r="5" fill="#f0f0f0"/><circle cx="130" cy="45" r="5" fill="#f0f0f0"/>
        <path d="M70,45 L130,45" stroke="#f0f0f0" stroke-width="3"/>
      </svg>
      <div class="graph-caption">−1 ≤ x ≤ 4 : compound "and", segment between both points</div>
    </div>
  </div>

  <div class="qcard"><div class="qhead"><span class="qnum">EASY</span> Solve: x + 5 ≥ 9</div>
  <details><summary>Show Answer</summary><div class="ans">x ≥ 4</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">MEDIUM</span> Solve: 3x − 4 &lt; 11</div>
  <details><summary>Show Answer</summary><div class="ans">3x &lt; 15 → x &lt; 5</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">HARD</span> Solve: |2x + 1| ≥ 7</div>
  <details><summary>Show Answer</summary><div class="ans">2x+1 ≥ 7 or 2x+1 ≤ −7 → x ≥ 3 or x ≤ −4</div></details></div>

  <div class="mistake"><div class="no">!</div><div><b>Most common mistake:</b> forgetting to flip the sign when multiplying/dividing by a negative.<br><span class="wrong">Wrong: −3x &lt; 12 → x &lt; −4</span><br><span class="right">Right: −3x &lt; 12 → x &gt; −4 (sign flips)</span></div></div>

  <div class="card"><h3>Real-World Application</h3><div class="row">A ride only operates if a rider is at least 48 inches tall: h ≥ 48. A budget problem where you can spend at most $50 becomes c ≤ 50 — inequalities model limits and requirements, not just exact amounts.</div></div>
</template>

<template id="tpl-systems">
  <h2 class="title">Systems of Equations</h2>
  <p class="sub">Solving two (or more) equations at the same time, for the point where they agree.</p>

  <div class="card">
    <h3><span class="pin">METHOD</span> Graphing</h3>
    <div class="row">Graph both lines — the solution is the point where they cross. Best for visualizing, but not precise for messy coordinates.</div>
  </div>

  <div class="card">
    <h3><span class="pin">METHOD</span> Substitution</h3>
    <div class="row">Solve one equation for a variable, then substitute that expression into the other equation.</div>
    <div class="example">y = 2x + 1 and y = −x + 7 → 2x+1 = −x+7 → 3x = 6 → x = 2, y = 5 → (2, 5)</div>
    <div class="remember"><b>Remember it:</b> Best when a variable is already alone (or easy to isolate) in one equation.</div>
  </div>

  <div class="card">
    <h3><span class="pin">METHOD</span> Elimination</h3>
    <div class="row">Add or subtract the equations (after matching one variable's coefficients) so that variable cancels out.</div>
    <div class="example">3x + y = 10 and x − y = 2 → add straight down → 4x = 12 → x = 3 → y = 1 → (3, 1)</div>
    <div class="remember"><b>Remember it:</b> Best when the equations are already stacked in standard form Ax + By = C.</div>
  </div>

  <div class="graph-wrap">
    <svg viewBox="0 0 300 220" xmlns="http://www.w3.org/2000/svg">
      <line x1="20" y1="110" x2="280" y2="110" stroke="#6a6a6c" stroke-width="1.5"/>
      <line x1="150" y1="10" x2="150" y2="210" stroke="#6a6a6c" stroke-width="1.5"/>
      <line x1="30" y1="190" x2="270" y2="30" stroke="#f0f0f0" stroke-width="2.5"/>
      <line x1="30" y1="50" x2="270" y2="170" stroke="#9a9a9c" stroke-width="2.5"/>
      <circle cx="185" cy="75" r="5" fill="#f0f0f0"/>
      <text x="195" y="70" font-family="JetBrains Mono, monospace" font-size="12" fill="#f0f0f0">solution</text>
    </svg>
    <div class="graph-caption">Two lines meet at exactly one point — that point (x, y) is the system's solution.</div>
  </div>

  <div class="qcard"><div class="qhead"><span class="qnum">EASY</span> Solve by substitution: y = x + 2, y = 3x − 4</div>
  <details><summary>Show Answer</summary><div class="ans">x+2 = 3x−4 → 6 = 2x → x = 3, y = 5 → (3,5)</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">MEDIUM</span> Solve by elimination: 2x + y = 11, x − y = 1</div>
  <details><summary>Show Answer</summary><div class="ans">Add: 3x = 12 → x = 4 → y = 3 → (4,3)</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">HARD</span> Solve: 4x + 3y = 25, 3x − 2y = 6</div>
  <details><summary>Show Answer</summary><div class="ans">Multiply eq1 by 2 and eq2 by 3: 8x+6y=50 and 9x−6y=18 → add → 17x=68 → x=4 → 3(4)−2y=6 → y=3 → (4, 3)</div></details></div>

  <div class="mistake"><div class="no">!</div><div><b>Most common mistake:</b> forgetting to multiply <i>every</i> term (including the constant) when scaling an equation for elimination.<br><span class="wrong">Wrong: doubling 2x + y = 5 to get 4x + 2y = 5</span><br><span class="right">Right: 4x + 2y = 10 — the constant gets doubled too</span></div></div>

  <div class="card"><h3>Real-World Application</h3><div class="row">Two phone plans — one with a higher monthly fee but lower per-text cost — form a system; the solution tells you the break-even number of texts where both plans cost the same.</div></div>
</template>

<template id="tpl-polynomials">
  <h2 class="title">Polynomial Operations</h2>
  <p class="sub">Adding, subtracting, and multiplying expressions with more than one term.</p>

  <div class="card">
    <h3><span class="pin">RULE</span> Adding &amp; Subtracting Polynomials</h3>
    <div class="row">Combine like terms only — line up matching degrees and add or subtract their coefficients.</div>
    <div class="example">(3x² + 2x − 1) + (x² − 5x + 4) = 4x² − 3x + 3</div>
    <div class="remember"><b>Remember it:</b> Subtracting a polynomial means distributing a negative sign to every term in it first.</div>
    <div class="example">(3x² − 4) − (x² − 2x + 5) = 3x² − 4 − x² + 2x − 5 = 2x² + 2x − 9</div>
  </div>

  <div class="card">
    <h3><span class="pin">RULE</span> Multiplying Polynomials</h3>
    <div class="row">Distribute every term in the first polynomial by every term in the second, then combine like terms. FOIL is just this rule for two binomials.</div>
    <div class="example">(x + 2)(x² − 3x + 1) = x³ −3x² + x + 2x² − 6x + 2 = x³ − x² − 5x + 2</div>
  </div>

  <div class="card">
    <h3><span class="pin">PATTERN</span> Special Products</h3>
    <span class="formula">(a+b)² = a² + 2ab + b²      (a−b)² = a² − 2ab + b²      (a+b)(a−b) = a² − b²</span>
    <div class="remember"><b>Remember it:</b> These three patterns come up so often they're worth recognizing instantly instead of re-FOILing every time.</div>
  </div>

  <div class="qcard"><div class="qhead"><span class="qnum">EASY</span> Add: (2x + 3) + (5x − 1)</div>
  <details><summary>Show Answer</summary><div class="ans">7x + 2</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">MEDIUM</span> Multiply: (x − 4)(x + 6)</div>
  <details><summary>Show Answer</summary><div class="ans">x² + 6x − 4x − 24 = x² + 2x − 24</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">HARD</span> Expand: (2x − 3)²</div>
  <details><summary>Show Answer</summary><div class="ans">(2x)² − 2(2x)(3) + 3² = 4x² − 12x + 9</div></details></div>

  <div class="mistake"><div class="no">!</div><div><b>Most common mistake:</b> forgetting to distribute the negative when subtracting an entire polynomial.<br><span class="wrong">Wrong: (5x − 2) − (2x + 3) = 5x − 2 − 2x + 3 = 3x + 1</span><br><span class="right">Right: (5x − 2) − (2x + 3) = 5x − 2 − 2x − 3 = 3x − 5 (the negative flips <i>both</i> terms in the second polynomial)</span></div></div>
</template>

<template id="tpl-quadratic">
  <h2 class="title">Quadratic Formula</h2>
  <p class="sub">Solves any quadratic equation for x — even the ones that won't factor nicely.</p>
  <div class="card">
    <h3><span class="pin">FORMULA</span> For ax² + bx + c = 0</h3>
    <span class="formula">x = ( −b ± √(b&sup2; − 4ac) ) / (2a)</span>
    <div class="row"><b>What it means</b> It gives both solutions (roots) of a quadratic equation at once — the ± means "add for one answer, subtract for the other."</div>
    <div class="row"><b>When to use it</b> Whenever a quadratic won't factor easily, or a problem specifically asks for exact/irrational solutions.</div>
    <div class="remember"><b>Remember it:</b> Sing it to "Pop Goes the Weasel" — <i>"x equals negative b, plus or minus the square root, of b squared minus four-a-c, all over two-a."</i></div>
    <div class="example">Example: x² + 5x + 6 = 0 → x = (−5 ± √(25−24))/2 = (−5 ± 1)/2 → x = −2 or x = −3</div>
  </div>
  <div class="card">
    <h3><span class="pin">RULE</span> The Discriminant</h3>
    <span class="formula">b&sup2; − 4ac</span>
    <div class="row"><b>What it means</b> The part under the square root tells you what kind of solutions to expect, before you even finish solving.</div>
    <table class="regtable">
      <tr><th>Discriminant</th><th>What it tells you</th></tr>
      <tr><td>Positive</td><td>2 real solutions</td></tr>
      <tr><td>Zero</td><td>1 real solution (a double root — the vertex touches the x-axis)</td></tr>
      <tr><td>Negative</td><td>No real solutions (2 imaginary solutions)</td></tr>
    </table>
    <div class="remember"><b>Remember it:</b> Positive → parabola crosses the x-axis twice. Zero → it just touches. Negative → it never touches.</div>
  </div>
</template>

<template id="tpl-parabola">
  <h2 class="title">Graphing Parabolas</h2>
  <p class="sub">Every quadratic graphs as a symmetric U-shaped curve — reading off its key features first makes graphing fast.</p>

  <div class="card">
    <h3><span class="pin">FORMULA</span> Vertex Form</h3>
    <span class="formula">y = a(x − h)² + k    → vertex = (h, k)</span>
    <div class="row">The vertex is the parabola's highest or lowest point. a &gt; 0 opens upward (minimum); a &lt; 0 opens downward (maximum). Larger |a| makes the parabola narrower.</div>
    <div class="remember"><b>Remember it:</b> h is subtracted in the formula but shifts the graph in that same direction — h = 3 shifts right 3, even though it looks like "minus 3."</div>
  </div>

  <div class="card">
    <h3><span class="pin">FORMULA</span> Axis of Symmetry</h3>
    <span class="formula">x = −b / (2a)   (from standard form y = ax² + bx + c)</span>
    <div class="row">A vertical line through the vertex that splits the parabola into two mirror-image halves — plug this x back into the equation to find the vertex's y-coordinate.</div>
  </div>

  <div class="card">
    <h3><span class="pin">METHOD</span> Completing the Square</h3>
    <div class="row">Converts standard form into vertex form by turning x² + bx into a perfect square trinomial.</div>
    <div class="example">y = x² + 6x + 5 → y = (x² + 6x + 9) + 5 − 9 → y = (x + 3)² − 4 → vertex (−3, −4)</div>
  </div>

  <div class="graph-row">
    <div class="graph-wrap">
      <svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg">
        <line x1="10" y1="130" x2="190" y2="130" stroke="#6a6a6c" stroke-width="1.5"/>
        <line x1="100" y1="10" x2="100" y2="150" stroke="#6a6a6c" stroke-width="1.5"/>
        <path d="M20,140 Q100,10 180,140" fill="none" stroke="#f0f0f0" stroke-width="2.5"/>
        <circle cx="100" cy="20" r="4" fill="#f0f0f0"/>
      </svg>
      <div class="graph-caption">a &gt; 0 — opens up, vertex is a minimum</div>
    </div>
    <div class="graph-wrap">
      <svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg">
        <line x1="10" y1="30" x2="190" y2="30" stroke="#6a6a6c" stroke-width="1.5"/>
        <line x1="100" y1="10" x2="100" y2="150" stroke="#6a6a6c" stroke-width="1.5"/>
        <path d="M20,20 Q100,150 180,20" fill="none" stroke="#9a9a9c" stroke-width="2.5"/>
        <circle cx="100" cy="140" r="4" fill="#9a9a9c"/>
      </svg>
      <div class="graph-caption">a &lt; 0 — opens down, vertex is a maximum</div>
    </div>
    <div class="graph-wrap">
      <svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg">
        <line x1="10" y1="130" x2="190" y2="130" stroke="#6a6a6c" stroke-width="1.5"/>
        <line x1="100" y1="10" x2="100" y2="150" stroke="#6a6a6c" stroke-width="1.5"/>
        <path d="M35,140 Q100,10 165,140" fill="none" stroke="#f0f0f0" stroke-width="2.5"/>
        <path d="M15,145 Q100,-25 185,145" fill="none" stroke="#6a6a6c" stroke-width="2" stroke-dasharray="4,4"/>
        <circle cx="100" cy="20" r="4" fill="#f0f0f0"/>
      </svg>
      <div class="graph-caption">larger |a| (dashed) → narrower parabola</div>
    </div>
  </div>

  <div class="qcard"><div class="qhead"><span class="qnum">EASY</span> Find the vertex of y = (x − 2)² + 5</div>
  <details><summary>Show Answer</summary><div class="ans">(2, 5)</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">MEDIUM</span> Find the axis of symmetry of y = x² − 8x + 3</div>
  <details><summary>Show Answer</summary><div class="ans">x = −(−8)/(2·1) = 4</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">HARD</span> Write y = x² + 4x + 1 in vertex form.</div>
  <details><summary>Show Answer</summary><div class="ans">y = (x²+4x+4) + 1 − 4 = (x+2)² − 3 → vertex (−2, −3)</div></details></div>

  <div class="mistake"><div class="no">!</div><div><b>Most common mistake:</b> reading the vertex's x-coordinate with the wrong sign.<br><span class="wrong">Wrong: y = (x − 3)² + 2 → vertex (−3, 2)</span><br><span class="right">Right: vertex (3, 2) — the h-value flips sign from what's written in the parentheses</span></div></div>

  <div class="card"><h3>Real-World Application</h3><div class="row">A ball thrown in the air follows a parabolic path — the vertex represents the ball's maximum height, and the axis of symmetry marks the moment it's at that peak.</div></div>
</template>

<template id="tpl-exponents">
  <h2 class="title">Exponent Rules</h2>
  <p class="sub">Rules for combining powers — every one of these only works when the bases match (except the power rules).</p>

  <div class="card"><h3><span class="pin">RULE</span> Product Rule</h3><span class="formula">a<sup>m</sup> · a<sup>n</sup> = a<sup>m+n</sup></span>
  <div class="row"><b>What it means</b> Multiplying same-base powers keeps the base and adds the exponents.</div>
  <div class="row"><b>When to use it</b> Multiplying two terms that share a base, like variables in a monomial.</div>
  <div class="remember"><b>Remember it:</b> "Multiply → Add."</div>
  <div class="example">x³ · x⁴ = x⁷</div></div>

  <div class="card"><h3><span class="pin">RULE</span> Quotient Rule</h3><span class="formula">a<sup>m</sup> / a<sup>n</sup> = a<sup>m−n</sup></span>
  <div class="row"><b>What it means</b> Dividing same-base powers keeps the base and subtracts the exponents.</div>
  <div class="remember"><b>Remember it:</b> "Divide → Subtract."</div>
  <div class="example">x⁷ / x³ = x⁴</div></div>

  <div class="card"><h3><span class="pin">RULE</span> Power Rule</h3><span class="formula">(a<sup>m</sup>)<sup>n</sup> = a<sup>mn</sup></span>
  <div class="row"><b>What it means</b> Raising a power to another power multiplies the exponents.</div>
  <div class="remember"><b>Remember it:</b> "Power of a power → Multiply."</div>
  <div class="example">(x³)⁴ = x¹²</div></div>

  <div class="card"><h3><span class="pin">RULE</span> Zero &amp; Negative Exponents</h3><span class="formula">a&#8304; = 1     a<sup>−n</sup> = 1/a<sup>n</sup></span>
  <div class="row"><b>What it means</b> Anything (except 0) to the zero power is 1. A negative exponent means "flip me to the other side of the fraction" — it does not make the value negative.</div>
  <div class="remember"><b>Remember it:</b> "Negative exponents flip, they don't flip the sign."</div>
  <div class="example">2⁻³ = 1/2³ = 1/8</div></div>

  <div class="card"><h3><span class="pin">RULE</span> Power of a Product / Quotient</h3><span class="formula">(ab)<sup>n</sup> = a<sup>n</sup>b<sup>n</sup>     (a/b)<sup>n</sup> = a<sup>n</sup>/b<sup>n</sup></span>
  <div class="row"><b>What it means</b> The outside exponent distributes to every factor inside the parentheses.</div>
  <div class="example">(2x)³ = 8x³</div></div>

  <div class="card"><h3><span class="pin">RULE</span> Fractional Exponents</h3><span class="formula">a<sup>m/n</sup> = (ⁿ√a)<sup>m</sup></span>
  <div class="row"><b>What it means</b> The denominator of the exponent is the root, the numerator is the power.</div>
  <div class="remember"><b>Remember it:</b> "Bottom is the root (like a root cellar), top is the power."</div>
  <div class="example">8^(2/3) = (³√8)² = 2² = 4</div></div>
</template>

<template id="tpl-factoring">
  <h2 class="title">Factoring Patterns</h2>
  <p class="sub">Factoring reverses multiplication — every pattern below turns an expanded expression back into a product.</p>

  <div class="card"><h3><span class="pin">STEP 1</span> Greatest Common Factor (GCF)</h3>
  <span class="formula">ab + ac = a(b + c)</span>
  <div class="row"><b>What it means</b> Pull out the largest factor common to every term before trying anything else.</div>
  <div class="row"><b>When to use it</b> Always check first — every factoring problem starts here.</div>
  <div class="remember"><b>Remember it:</b> "GCF first, always."</div>
  <div class="example">6x² + 9x = 3x(2x + 3)</div></div>

  <div class="card"><h3><span class="pin">PATTERN</span> Difference of Squares</h3>
  <span class="formula">a&sup2; − b&sup2; = (a − b)(a + b)</span>
  <div class="row"><b>What it means</b> Two perfect squares being subtracted always split into a sum and a difference of their roots.</div>
  <div class="row"><b>When to use it</b> A binomial (2 terms) with a minus sign, both terms perfect squares.</div>
  <div class="remember"><b>Remember it:</b> "No middle term? Twins with opposite signs."</div>
  <div class="example">x² − 25 = (x − 5)(x + 5)</div></div>

  <div class="card"><h3><span class="pin">PATTERN</span> Perfect Square Trinomial</h3>
  <span class="formula">a&sup2; + 2ab + b&sup2; = (a + b)&sup2;      a&sup2; − 2ab + b&sup2; = (a − b)&sup2;</span>
  <div class="row"><b>What it means</b> Comes from squaring a binomial — the first and last terms are perfect squares, and the middle term is double their product.</div>
  <div class="example">x² + 6x + 9 = (x + 3)²</div></div>

  <div class="card"><h3><span class="pin">METHOD</span> Trinomial Factoring</h3>
  <span class="formula">x&sup2; + bx + c = (x + p)(x + q), where pq = c and p + q = b</span>
  <div class="row"><b>What it means</b> Find two numbers that multiply to the constant and add to the middle coefficient.</div>
  <div class="row"><b>When to use it</b> Any trinomial with a leading coefficient of 1.</div>
  <div class="remember"><b>Remember it:</b> "Multiply to the last, add to the middle."</div>
  <div class="example">x² + 7x + 12 → 3 & 4 multiply to 12, add to 7 → (x+3)(x+4)</div></div>

  <div class="card"><h3><span class="pin">METHOD</span> AC Method &amp; Grouping</h3>
  <span class="formula">ax&sup2; + bx + c → split bx using two numbers that multiply to ac and add to b, then group</span>
  <div class="row"><b>When to use it</b> Trinomials where the leading coefficient is not 1.</div>
  <div class="example">2x² + 7x + 3 → numbers 6 & 1 (multiply to 6, add to 7) → 2x²+6x+x+3 → 2x(x+3)+1(x+3) → (2x+1)(x+3)</div></div>
</template>

<template id="tpl-foil">
  <h2 class="title">FOIL</h2>
  <p class="sub">The order for multiplying two binomials together, term by term.</p>
  <div class="card">
    <h3><span class="pin">METHOD</span> First · Outer · Inner · Last</h3>
    <span class="formula">(a + b)(c + d) = ac + ad + bc + bd</span>
    <div class="row"><b>What it means</b> FOIL is just an order of operations for distributing twice — multiply the First terms, then the Outer terms, then the Inner terms, then the Last terms, and add everything together.</div>
    <div class="row"><b>When to use it</b> Multiplying any two binomials (two two-term expressions).</div>
    <div class="remember"><b>Remember it:</b> F-O-I-L — First, Outer, Inner, Last. Draw the "smile and eyebrows" arcs connecting the terms if it helps.</div>
    <div class="example">(x + 3)(x + 5) = x² + 5x + 3x + 15 = x² + 8x + 15</div>
  </div>
  <div class="callout warn"><b>Watch out:</b> FOIL only works for binomial × binomial. For anything bigger (like a trinomial times a binomial), distribute every term instead.</div>
</template>

<template id="tpl-radicals">
  <h2 class="title">Radical Rules</h2>
  <p class="sub">Rules for simplifying and combining square roots.</p>

  <div class="card"><h3><span class="pin">RULE</span> Product &amp; Quotient Rules</h3>
  <span class="formula">√(ab) = √a · √b       √(a/b) = √a / √b</span>
  <div class="row"><b>What it means</b> A root of a product (or quotient) can be split into the root of each piece — which is how you pull perfect squares out.</div>
  <div class="remember"><b>Remember it:</b> Look for the biggest perfect-square factor hiding inside the number.</div>
  <div class="example">√50 = √(25·2) = √25·√2 = 5√2</div></div>

  <div class="card"><h3><span class="pin">RULE</span> Adding &amp; Subtracting Radicals</h3>
  <span class="formula">a√n ± b√n = (a ± b)√n</span>
  <div class="row"><b>What it means</b> Only "like radicals" (the same number under the root) can combine — treat √n like a variable.</div>
  <div class="remember"><b>Remember it:</b> "Same root, same rules as like terms."</div>
  <div class="example">3√2 + 5√2 = 8√2, but 3√2 + 5√3 cannot combine</div></div>

  <div class="card"><h3><span class="pin">RULE</span> Rationalizing the Denominator</h3>
  <span class="formula">a/√b → (a·√b)/b</span>
  <div class="row"><b>What it means</b> A radical isn't allowed to stay in the denominator, so multiply the top and bottom by that radical to clear it out.</div>
  <div class="remember"><b>Remember it:</b> "No radicals allowed in the basement (denominator)."</div>
  <div class="example">5/√3 = (5√3)/3</div></div>
</template>

<template id="tpl-functions">
  <h2 class="title">Function Formulas</h2>
  <p class="sub">The core toolkit for reading, writing, and transforming functions.</p>

  <div class="card"><h3><span class="pin">NOTATION</span> Function Notation</h3>
  <span class="formula">f(x) = "the output of function f when the input is x"</span>
  <div class="row"><b>When to use it</b> Anytime you need to evaluate a function at a specific input — just substitute that value in for x.</div>
  <div class="remember"><b>Remember it:</b> f(3) does NOT mean f times 3 — it means "plug 3 in."</div>
  <div class="example">f(x) = 2x² − x + 1 → f(3) = 2(9) − 3 + 1 = 16</div></div>

  <div class="card"><h3><span class="pin">RULE</span> Vertical Line Test</h3>
  <div class="row"><b>What it means</b> If any vertical line crosses a graph more than once, the graph is not a function — one input can't have two outputs.</div>
  <div class="remember"><b>Remember it:</b> "One x, one y — or it's not a function."</div></div>

  <div class="card"><h3><span class="pin">FORMULA</span> Average Rate of Change</h3>
  <span class="formula">( f(b) − f(a) ) / (b − a)</span>
  <div class="row"><b>What it means</b> The slope between two points on any curve — how fast the function's output is changing on average over that interval.</div>
  <div class="row"><b>When to use it</b> Comparing how quickly two functions grow, or finding "average speed" style word problems.</div>
  <div class="example">f(x)=x², from x=1 to x=4 → (16−1)/(4−1) = 5</div></div>

  <div class="card"><h3><span class="pin">RULE</span> Transformations</h3>
  <table class="regtable">
    <tr><th>Change</th><th>Effect</th></tr>
    <tr><td>f(x) + k</td><td>shifts graph up (k&gt;0) or down (k&lt;0)</td></tr>
    <tr><td>f(x + k)</td><td>shifts graph left (k&gt;0) or right (k&lt;0) — opposite of what it looks like</td></tr>
    <tr><td>a·f(x)</td><td>stretches (|a|&gt;1) or compresses (|a|&lt;1) vertically</td></tr>
    <tr><td>−f(x)</td><td>reflects over the x-axis</td></tr>
  </table>
  <div class="remember"><b>Remember it:</b> "Outside the parentheses acts normal; inside the parentheses acts backwards."</div></div>

  <div class="card"><h3><span class="pin">FORMULA</span> Sequences</h3>
  <span class="formula">Arithmetic: a<sub>n</sub> = a&#8321; + (n−1)d      Geometric: a<sub>n</sub> = a&#8321; · r<sup>(n−1)</sup></span>
  <div class="row"><b>What it means</b> Arithmetic sequences add the same amount (d) each step; geometric sequences multiply by the same ratio (r) each step.</div>
  <div class="remember"><b>Remember it:</b> "Linear ADDS, exponential MULTIPLIES" — arithmetic behaves like a line, geometric behaves like exponential growth.</div></div>
</template>

<template id="tpl-domainrange">
  <h2 class="title">Domain &amp; Range</h2>
  <p class="sub">Domain is every valid input; range is every output that comes back out.</p>

  <div class="card">
    <h3><span class="pin">DEFINITION</span> Domain &amp; Range</h3>
    <div class="row"><b>Domain</b> = the complete set of x-values a function is allowed to use. <b>Range</b> = the complete set of resulting y-values.</div>
    <div class="remember"><b>Remember it:</b> "Domain = Down the x-axis, left to right." Range is what's left, the y's.</div>
  </div>

  <div class="card">
    <h3><span class="pin">RULE</span> Common Domain Restrictions</h3>
    <ul class="vocab-list">
      <li><b>Fractions</b> — the denominator can never equal 0.</li>
      <li><b>Square roots</b> — the expression under the root can't be negative.</li>
      <li><b>Real-world models</b> — negative time, negative people, or negative distance usually aren't allowed.</li>
    </ul>
  </div>

  <div class="graph-wrap">
    <svg viewBox="0 0 260 160" xmlns="http://www.w3.org/2000/svg">
      <line x1="15" y1="130" x2="245" y2="130" stroke="#6a6a6c" stroke-width="1.5"/>
      <line x1="130" y1="10" x2="130" y2="150" stroke="#6a6a6c" stroke-width="1.5"/>
      <path d="M20,20 L100,130" fill="none" stroke="#f0f0f0" stroke-width="2.5"/>
      <path d="M160,130 L240,20" fill="none" stroke="#f0f0f0" stroke-width="2.5"/>
      <circle cx="130" cy="130" r="4" fill="#0a0a0a" stroke="#f0f0f0" stroke-width="2"/>
      <text x="130" y="148" font-family="JetBrains Mono, monospace" font-size="11" fill="#9a9a9c" text-anchor="middle">x = 3 (undefined)</text>
    </svg>
    <div class="graph-caption">f(x) = 1/(x−3): the open point at x = 3 shows the value excluded from the domain.</div>
  </div>

  <div class="card">
    <h3><span class="pin">DEFINITION</span> Piecewise Functions</h3>
    <div class="row">A piecewise function applies a different rule over different intervals of the domain — check which interval x falls into before choosing the rule to use.</div>
    <div class="example">f(x) = x+1 if x&lt;0; f(x) = x² if x≥0 → f(−2)=−1, f(3)=9</div>
  </div>

  <div class="qcard"><div class="qhead"><span class="qnum">EASY</span> Find the domain of f(x) = 2x + 5.</div>
  <details><summary>Show Answer</summary><div class="ans">All real numbers (no restrictions on a linear function)</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">MEDIUM</span> Find the domain of f(x) = √(x − 4).</div>
  <details><summary>Show Answer</summary><div class="ans">x − 4 ≥ 0 → x ≥ 4</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">HARD</span> Find the domain of f(x) = 1/(x² − 9).</div>
  <details><summary>Show Answer</summary><div class="ans">x² − 9 ≠ 0 → x ≠ 3 and x ≠ −3</div></details></div>

  <div class="mistake"><div class="no">!</div><div><b>Most common mistake:</b> swapping domain and range.<br><span class="wrong">Wrong: calling the y-values the domain</span><br><span class="right">Right: domain = x-values (inputs), range = y-values (outputs)</span></div></div>
</template>

<template id="tpl-stats">
  <h2 class="title">Statistics Basics</h2>
  <p class="sub">Describing a data set with a single representative number, and visualizing its spread.</p>

  <div class="card">
    <h3><span class="pin">DEFINITION</span> Mean, Median, Mode, Range</h3>
    <ul class="vocab-list">
      <li><b>Mean</b> — the average: sum of all values ÷ number of values.</li>
      <li><b>Median</b> — the middle value when the data is ordered (average the two middle values if there's an even count).</li>
      <li><b>Mode</b> — the value that appears most often (a data set can have none, one, or several modes).</li>
      <li><b>Range</b> — the largest value minus the smallest value.</li>
    </ul>
    <div class="example">Data: 4, 7, 7, 9, 13 → mean = 8, median = 7, mode = 7, range = 9</div>
  </div>

  <div class="card">
    <h3><span class="pin">VISUAL</span> Box Plots</h3>
    <div class="row">A box plot displays the minimum, first quartile (Q1), median, third quartile (Q3), and maximum of a data set — the box spans the "middle 50%" of the data (the interquartile range).</div>
  </div>

  <div class="graph-wrap">
    <svg viewBox="0 0 280 90" xmlns="http://www.w3.org/2000/svg">
      <line x1="20" y1="45" x2="260" y2="45" stroke="#6a6a6c" stroke-width="1.5"/>
      <line x1="40" y1="30" x2="40" y2="60" stroke="#f0f0f0" stroke-width="2"/>
      <line x1="220" y1="30" x2="220" y2="60" stroke="#f0f0f0" stroke-width="2"/>
      <rect x="90" y="25" width="80" height="40" fill="none" stroke="#f0f0f0" stroke-width="2"/>
      <line x1="130" y1="25" x2="130" y2="65" stroke="#f0f0f0" stroke-width="2"/>
      <line x1="40" y1="45" x2="90" y2="45" stroke="#f0f0f0" stroke-width="2"/>
      <line x1="170" y1="45" x2="220" y2="45" stroke="#f0f0f0" stroke-width="2"/>
      <g font-family="JetBrains Mono, monospace" font-size="10" fill="#9a9a9c" text-anchor="middle">
        <text x="40" y="80">min</text><text x="90" y="80">Q1</text><text x="130" y="80">median</text>
        <text x="170" y="80">Q3</text><text x="220" y="80">max</text>
      </g>
    </svg>
    <div class="graph-caption">The box covers the middle 50% of the data; the whiskers reach to the min and max.</div>
  </div>

  <div class="qcard"><div class="qhead"><span class="qnum">EASY</span> Find the mean of 2, 4, 6, 8.</div>
  <details><summary>Show Answer</summary><div class="ans">(2+4+6+8)/4 = 5</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">MEDIUM</span> Find the median of 12, 5, 9, 20, 7.</div>
  <details><summary>Show Answer</summary><div class="ans">Ordered: 5,7,9,12,20 → median = 9</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">HARD</span> A data set of 6 test scores has a mean of 85. Five of the scores are 90, 82, 88, 78, 84. Find the sixth.</div>
  <details><summary>Show Answer</summary><div class="ans">Total needed = 85×6 = 510; sum of 5 known = 422; sixth = 510−422 = 88</div></details></div>

  <div class="mistake"><div class="no">!</div><div><b>Most common mistake:</b> forgetting to reorder the data before finding the median.<br><span class="wrong">Wrong: median of 8, 2, 5 → picking the middle position (2) without sorting</span><br><span class="right">Right: sort first → 2, 5, 8 → median = 5</span></div></div>
</template>

<template id="tpl-scatter">
  <h2 class="title">Scatter Plots &amp; Correlation</h2>
  <p class="sub">Visualizing the relationship between two numeric variables, and estimating it with a line.</p>

  <div class="graph-row">
    <div class="graph-wrap">
      <svg viewBox="0 0 180 140" xmlns="http://www.w3.org/2000/svg">

        <line x1="15" y1="10" x2="15" y2="120" stroke="#6a6a6c" stroke-width="1.5"/>
        <g fill="#f0f0f0">
          <circle cx="30" cy="105" r="3.5"/><circle cx="55" cy="90" r="3.5"/><circle cx="75" cy="80" r="3.5"/>

        </g>
        <line x1="25" y1="20" x2="150" y2="115" stroke="#9a9a9c" stroke-width="1.5" stroke-dasharray="4,3"/>
