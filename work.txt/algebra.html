  <div class="row"><b>What if d or r is negative?</b> Arithmetic sequences with negative d count down instead of up; geometric sequences with 0&lt;r&lt;1 shrink toward zero instead of growing.</div>
  <div class="row"><b>What if you're only given two non-consecutive terms?</b> Set up the explicit formula for both terms as a system, then solve for a₁ and d (or r) together.</div>
  <div class="row"><b>What if the sequence doesn't have a constant difference OR ratio?</b> It's neither arithmetic nor geometric — look for a different pattern (like each term related to n², for instance).</div>
  </div>

  <div class="mistake"><div class="no">01</div><div><b>Using n instead of (n−1)</b> in the explicit formula — the exponent/multiplier is always one less than the term number.</div></div>
  <div class="mistake"><div class="no">02</div><div><b>Mixing up d and r</b> — subtracting when you should be dividing (geometric) or vice versa.</div></div>
  <div class="mistake"><div class="no">03</div><div><b>Assuming a sequence is arithmetic</b> just because the first two differences happen to look similar, without checking a third pair.</div></div>

  <div class="callout tip"><b>Test tip:</b> Check consecutive differences AND consecutive ratios early — whichever one stays exactly constant tells you which formula to use.</div>
  <div class="callout"><b>Real-world use:</b> A savings account that adds the same fixed amount every month is arithmetic; one that compounds by a percentage is geometric.</div>

  <h3 class="section-label">Practice Problems</h3>
  <div class="qcard"><div class="qhead"><span class="qnum">P1</span> 2, 7, 12, 17… find a₁₂</div><details><summary>Show Answer</summary><div class="ans">d=5 → a₁₂=2+11(5)=57</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P2</span> 4, 8, 16, 32… find a₆</div><details><summary>Show Answer</summary><div class="ans">r=2 → a₆=4·2⁵=128</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P3</span> 100, 90, 80, 70… find a₉</div><details><summary>Show Answer</summary><div class="ans">d=−10 → a₉=100+8(−10)=20</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P4</span> Write the explicit rule for 6, 3, 1.5, 0.75…</div><details><summary>Show Answer</summary><div class="ans">geometric, r=0.5 → aₙ=6(0.5)⁽ⁿ⁻¹⁾</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">CHALLENGE</span> a₃=14 and a₆=26 in an arithmetic sequence. Find a₁ and d.</div><details><summary>Show Answer</summary><div class="ans">3d apart: 26−14=12=3d → d=4 → a₁=14−2(4)=6</div></details></div>

  <h3 class="section-label">Things to Remember</h3>
  <ul class="steps-list"><li>Arithmetic adds a common difference; geometric multiplies by a common ratio.</li><li>The exponent/multiplier in the explicit formula is always (n−1), not n.</li><li>Check at least three consecutive terms before deciding which type a sequence is.</li></ul>

  <h3 class="section-label">Mini Quiz</h3>
  <div class="quiz-block"><span class="qn">Q1</span> Is 1, 4, 9, 16 arithmetic, geometric, or neither? <details><summary>Answer</summary><div class="ans">neither (differences aren't constant, ratios aren't either — it's square numbers)</div></details></div>
  <div class="quiz-block"><span class="qn">Q2</span> Find a₅ of 10, 15, 20, 25… <details><summary>Answer</summary><div class="ans">30</div></details></div>
  <div class="quiz-block"><span class="qn">Q3</span> Find a₅ of 2, 6, 18, 54… <details><summary>Answer</summary><div class="ans">162</div></details></div>
  <div class="quiz-block"><span class="qn">Q4</span> What does "explicit rule" mean? <details><summary>Answer</summary><div class="ans">finds any term directly from its position n, without needing the previous term</div></details></div>

  <div class="qcard"><div class="qhead"><span class="qnum">EXAM</span> A geometric sequence has a₁ = 5 and a₄ = 135. Find r and write the explicit rule.</div>
  <details><summary>Show Answer</summary><div class="ans">135=5r³ → r³=27 → r=3 → aₙ=5·3⁽ⁿ⁻¹⁾</div></details></div>
</template>

<template id="tpl-functions-deep">
  <h2 class="title">Domain, Range &amp; Piecewise Functions</h2>
  <p class="sub">Reading what goes in, what comes out, and functions that follow different rules in different zones.</p>

  <div class="card"><h3>Definition</h3>
  <div class="row">The <b>domain</b> is every valid input (x-value) a function can accept. The <b>range</b> is every possible output (y-value) it produces. A <b>piecewise function</b> uses a different rule for different parts of the domain.</div>
  <div class="vocab-grid">
    <div class="vocab-item"><b>Input / Output</b> what goes into f(x), and what comes out.</div>
    <div class="vocab-item"><b>Restricted domain</b> values that must be excluded (like dividing by zero, or a negative under a square root).</div>
  </div></div>

  <div class="card"><h3>Key Rules</h3>
  <span class="formula">Exclude from the domain: denominators = 0, and negative values under an even root</span>
  <div class="remember"><b>Remember it:</b> "Domain is what you're allowed to plug IN; Range is what comes OUT." A vertical line test checks if a graph is even a function in the first place.</div></div>

  <div class="card"><h3>Step-by-Step: Finding Domain</h3>
  <ol class="steps-list"><li>Look for any denominators — set them ≠ 0 and solve for the excluded value(s).</li><li>Look for any square roots (or other even roots) — set the inside ≥ 0 and solve.</li><li>If neither applies, the domain is usually all real numbers.</li><li>Write the domain using inequality or interval notation.</li></ol></div>

  <div class="card"><h3>Worked Examples</h3>
  <div class="row"><span class="diff-tag diff-easy">EASY</span> Find the domain of f(x) = 2x + 5</div><div class="example">no restrictions → <b>all real numbers</b></div>
  <div class="row"><span class="diff-tag diff-med">MEDIUM</span> Find the domain of f(x) = 1/(x − 4)</div><div class="example">x−4≠0 → <b>all reals except x = 4</b></div>
  <div class="row"><span class="diff-tag diff-hard">HARD</span> Evaluate the piecewise function at x=−2 and x=3: f(x) = x+5 if x&lt;0, f(x)=x² if x≥0</div><div class="example">x=−2 uses first rule: f(−2)=3. x=3 uses second rule: f(3)=9</div>
  </div>

  <div class="card"><h3>What If We Change Something?</h3>
  <div class="row"><b>What if the function has a square root instead of a fraction?</b> Set the expression under the root ≥ 0 and solve — that inequality gives the domain instead of an excluded point.</div>
  <div class="row"><b>What if a piecewise boundary value could belong to two rules?</b> Look carefully at the inequality symbols (&lt; vs ≤) to see which rule owns that exact boundary point.</div>
  <div class="row"><b>What if you're asked for the range instead of the domain?</b> Think about the actual outputs the function can produce — sometimes easiest by graphing or testing several inputs.</div>
  </div>

  <div class="mistake"><div class="no">01</div><div><b>Forgetting to exclude a value that makes a denominator zero.</b></div></div>
  <div class="mistake"><div class="no">02</div><div><b>Using the wrong piece of a piecewise function</b> because the boundary inequality wasn't checked carefully.</div></div>
  <div class="mistake"><div class="no">03</div><div><b>Mixing up domain and range</b> — domain is inputs (x), range is outputs (y).</div></div>

  <div class="callout tip"><b>Test tip:</b> For domain questions, always hunt for two red flags first: a variable in a denominator, and a variable under an even root.</div>
  <div class="callout"><b>Real-world use:</b> A shipping cost function often changes rules by weight tier ($5 flat under 1 lb, then $2/lb after) — that's a real piecewise function.</div>

  <h3 class="section-label">Practice Problems</h3>
  <div class="qcard"><div class="qhead"><span class="qnum">P1</span> Domain of f(x) = 3/(x + 7)</div><details><summary>Show Answer</summary><div class="ans">all reals except x=−7</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P2</span> Domain of f(x) = √(x − 5)</div><details><summary>Show Answer</summary><div class="ans">x≥5</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P3</span> Domain of f(x) = x² + 3x − 1</div><details><summary>Show Answer</summary><div class="ans">all real numbers</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P4</span> For f(x)=2x if x≤1, f(x)=x+4 if x&gt;1 — find f(1) and f(5)</div><details><summary>Show Answer</summary><div class="ans">f(1)=2(1)=2 (uses first rule); f(5)=5+4=9</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">CHALLENGE</span> Domain of f(x) = 1/√(x − 3)</div><details><summary>Show Answer</summary><div class="ans">inside must be strictly &gt; 0 (can't be 0, denominator) → x &gt; 3</div></details></div>

  <h3 class="section-label">Things to Remember</h3>
  <ul class="steps-list"><li>Domain = valid inputs; range = resulting outputs.</li><li>Watch for zero denominators and negative values under even roots.</li><li>In a piecewise function, check the inequality symbol carefully at each boundary.</li></ul>

  <h3 class="section-label">Mini Quiz</h3>
  <div class="quiz-block"><span class="qn">Q1</span> Domain of f(x)=5/(x−1) <details><summary>Answer</summary><div class="ans">all reals except x=1</div></details></div>
  <div class="quiz-block"><span class="qn">Q2</span> Domain of f(x)=√(x+2) <details><summary>Answer</summary><div class="ans">x≥−2</div></details></div>
  <div class="quiz-block"><span class="qn">Q3</span> What test checks if a graph is a function? <details><summary>Answer</summary><div class="ans">vertical line test</div></details></div>
  <div class="quiz-block"><span class="qn">Q4</span> Domain vs. range — which is inputs? <details><summary>Answer</summary><div class="ans">domain</div></details></div>

  <div class="qcard"><div class="qhead"><span class="qnum">EXAM</span> Find the domain of f(x) = (x+2)/(x² − 9)</div>
  <details><summary>Show Answer</summary><div class="ans">x²−9≠0 → x≠3 and x≠−3 → all reals except x=±3</div></details></div>
</template>
<template id="tpl-trick-questions">
  <h2 class="title">Teacher Trick Questions</h2>
  <p class="sub">The classic patterns teachers use to test whether you really understand a rule, or just memorized the easy version.</p>

  <div class="trick-card"><div class="t-title">The "distribute the negative" trap</div>
  <div class="row">7 − (2x − 5) — students often write 7 − 2x − 5 instead of 7 − 2x + 5. The negative sign belongs to BOTH terms inside the parentheses.</div></div>

  <div class="trick-card"><div class="t-title">The "no solution / infinite solutions" trap</div>
  <div class="row">An equation designed to simplify to something like 4 = 4 (infinite solutions) or 3 = 9 (no solution) instead of a normal x = number — students panic when the variable disappears completely instead of recognizing what it means.</div></div>

  <div class="trick-card"><div class="t-title">The "flip the inequality" trap</div>
  <div class="row">−3x &gt; 12 is written so that dividing by −3 is required — testing whether you remember to flip the sign to x &lt; −4.</div></div>

  <div class="trick-card"><div class="t-title">The "square root loses a solution" trap</div>
  <div class="row">x² = 49 is written to test whether you remember BOTH x = 7 and x = −7, not just the positive root.</div></div>

  <div class="trick-card"><div class="t-title">The "extraneous solution" trap</div>
  <div class="row">A radical or rational equation is set up so one of the two algebra-correct answers doesn't actually work when substituted back into the ORIGINAL equation — always check both.</div></div>

  <div class="trick-card"><div class="t-title">The "implied 1 exponent/coefficient" trap</div>
  <div class="row">x by itself is secretly x¹ (or 1x) — a term with no visible number is easy to treat incorrectly during combining or exponent rules.</div></div>

  <div class="trick-card"><div class="t-title">The "order of operations inside a fraction" trap</div>
  <div class="row">(3+5)/(2²) looks like it might invite solving top and bottom out of order — but the fraction bar acts as a grouping symbol: fully simplify numerator and denominator separately before dividing.</div></div>

  <div class="trick-card"><div class="t-title">The "solve for the wrong variable" trap</div>
  <div class="row">A literal equation like 2x + 3y = 12 asks you to "solve for y," but it's easy to isolate x out of habit — always double check which letter the question actually wants.</div></div>

  <div class="trick-card"><div class="t-title">The "function notation isn't multiplication" trap</div>
  <div class="row">f(x) looks like it could be "f times x," but it means "the output of function f when the input is x" — f(3) means substitute 3 in, it does NOT mean f times 3.</div></div>

  <div class="trick-card"><div class="t-title">The "extra irrelevant info" trap</div>
  <div class="row">Word problems sometimes include a number that isn't needed at all, just to test if you can identify which numbers actually belong in the equation.</div></div>

  <div class="trick-card"><div class="t-title">The "correlation isn't causation" trap</div>
  <div class="row">A scatter plot question sets up a strong correlation and asks if one variable "causes" the other — the honest answer is usually "correlation alone doesn't prove that."</div></div>

  <div class="trick-card"><div class="t-title">The "leading coefficient isn't 1" trap</div>
  <div class="row">A quadratic like 2x² + 7x + 3 is set up so students try to factor it the same way as x²+bx+c (looking for numbers that just add/multiply to b and c) — you need the AC method here instead.</div></div>

  <div class="callout tip"><b>Test tip:</b> Whenever a problem "feels too easy" or the variable disappears entirely, slow down — that's usually the exact moment a trick question is testing you.</div>
</template>

<template id="tpl-quick-solve">
  <h2 class="title">Solve Fast &amp; Check Your Answers</h2>
  <p class="sub">Strategies for working efficiently under time pressure, and for catching mistakes before you turn in the test.</p>

  <h3 class="section-label">How To Solve Quickly</h3>
  <div class="card"><h3>Multiple Choice: Work Backwards</h3>
  <div class="row">Instead of solving from scratch, plug each answer choice into the original equation/expression and see which one makes it true. This is often faster than full algebra, especially for equations with messy numbers.</div></div>

  <div class="card"><h3>Estimate First</h3>
  <div class="row">Before solving in detail, round the numbers and estimate roughly what the answer should be. This lets you immediately eliminate answer choices that are wildly off, and flags your own arithmetic errors later.</div></div>

  <div class="card"><h3>Recognize the Pattern Instantly</h3>
  <div class="row">Learn to recognize special products (difference of squares, perfect square trinomials), common Pythagorean triples (3-4-5, 5-12-13), and standard slope/intercept setups on sight — it skips several algebra steps entirely.</div></div>

  <div class="card"><h3>Skip and Return</h3>
  <div class="row">If a question is taking too long, mark it and move on. Easier questions later might jog your memory, and you guarantee time for every question you CAN answer quickly.</div></div>

  <h3 class="section-label">How To Check Your Answer</h3>
  <div class="card"><h3>Substitute Back In</h3>
  <div class="row">For any equation, plug your solution back into the ORIGINAL (not simplified) equation. If both sides match, you're correct.</div></div>

  <div class="card"><h3>Check Units and Reasonableness</h3>
  <div class="row">For word problems, ask "does this answer make sense?" A negative number of people, or an age of 300 years, signals an error even if the algebra "worked."</div></div>

  <div class="card"><h3>Verify With a Different Method</h3>
  <div class="row">If you solved a quadratic by factoring, double check with the quadratic formula (or vice versa) if you have extra time — two different paths landing on the same answer is strong confirmation.</div></div>

  <div class="card"><h3>Re-Read the Question</h3>
  <div class="row">Confirm you answered exactly what was asked — many "wrong" answers are actually correct algebra applied to the wrong final question (e.g., finding x when y was requested).</div></div>

  <div class="callout tip"><b>Test tip:</b> Reserve the last 5–10 minutes of any test purely for double-checking your most difficult or highest-point-value answers — not for reviewing questions you're already confident about.</div>

  <h3 class="section-label">Mini Quiz — Apply the Strategy</h3>
  <div class="quiz-block"><span class="qn">Q1</span> An equation gives x = 45 years as someone's age in a "how old is Sam's little brother" problem. What should you do? <details><summary>Answer</summary><div class="ans">flag it as unreasonable and re-check your equation setup</div></details></div>
  <div class="quiz-block"><span class="qn">Q2</span> You're stuck on question 12 of 30 with limited time. Best move? <details><summary>Answer</summary><div class="ans">mark it, move on, come back later if time allows</div></details></div>
  <div class="quiz-block"><span class="qn">Q3</span> Multiple choice gives 4 possible x-values for a messy equation. Fastest method? <details><summary>Answer</summary><div class="ans">plug each choice back into the original equation</div></details></div>
  <div class="quiz-block"><span class="qn">Q4</span> You solved for x, but the question asked for the value of y. What's the fix? <details><summary>Answer</summary><div class="ans">substitute x back in to find y — re-read and answer what was actually asked</div></details></div>
</template>

<script>
const pages = ["overview","slope","distance","midpoint","quadratic","exponents","factoring","foil","radicals","functions","regents","mistakes","top100","cram","nightbefore","practice1","practice2","pemdas","numbers","absvalue","scinotation","expressions","multistep-eq","literal-eq","inequalities-basic","inequalities-adv","systems","systems-apps","polynomials","parabolas","solving-quadratics","stats-center","scatterplots","probability","sequences","functions-deep","trick-questions","quick-solve","mixed50"];
const labels = {
  overview:"Overview", slope:"Slope Formulas", distance:"Distance Formula", midpoint:"Midpoint Formula",
  quadratic:"Quadratic Formula", exponents:"Exponent Rules", factoring:"Factoring Patterns", foil:"FOIL",
  radicals:"Radical Rules", functions:"Function Formulas", regents:"Regents Review", mistakes:"Common Mistakes",
  top100:"Top 100 Facts", cram:"Final Cram Sheet", nightbefore:"Night Before Guide",
  practice1:"Mixed Practice — Set 1", practice2:"Mixed Practice — Set 2",
  pemdas:"Order of Operations", numbers:"Integers, Fractions & Decimals", absvalue:"Absolute Value",
  scinotation:"Scientific Notation", expressions:"Simplifying Expressions", "multistep-eq":"Multi-Step Equations",
  "literal-eq":"Literal Equations & Formulas", "inequalities-basic":"One & Multi-Step Inequalities",
  "inequalities-adv":"Compound & Abs. Value Inequalities", systems:"Solving Systems", "systems-apps":"Systems Word Problems",
  polynomials:"Add, Subtract & Multiply", parabolas:"Graphing Parabolas", "solving-quadratics":"Solving Quadratics (4 Ways)",
  "stats-center":"Mean, Median, Mode & Range", scatterplots:"Scatter Plots & Correlation", probability:"Probability Basics",
  sequences:"Arithmetic & Geometric Sequences", "functions-deep":"Domain, Range & Piecewise",
  "trick-questions":"Teacher Trick Questions", "quick-solve":"Solve Fast & Check Answers", mixed50:"50 Mixed Practice Problems"
};

const content = document.getElementById('content');
const crumbs = document.getElementById('crumbs');
const pageBadge = document.getElementById('pageBadge');
const buttons = document.querySelectorAll('.nav-btn');

function renderPage(id){
  const tpl = document.getElementById('tpl-' + id);
  content.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'page active';
  div.appendChild(tpl.content.cloneNode(true));
  content.appendChild(div);
  crumbs.textContent = 'Study Terminal / ' + labels[id];
  const idx = pages.indexOf(id);
  pageBadge.textContent = String(idx).padStart(2,'0') + ' / ' + (pages.length - 1);
  buttons.forEach(b => b.classList.toggle('active', b.dataset.page === id));
  window.scrollTo(0,0);
}

buttons.forEach(btn => {
  btn.addEventListener('click', () => renderPage(btn.dataset.page));
});

renderPage('overview');

/* ---------- collapsible sidebar ---------- */
const sidebar = document.getElementById('sidebar');
const collapseBtn = document.getElementById('collapseBtn');
collapseBtn.addEventListener('click', () => {
  sidebar.classList.toggle('collapsed');
});

/* ---------- "made by sskies" decode animation in sidebar footer ---------- */
const target = "MADE BY SSKIES";
const scrambleChars = "!<>-_\\/[]{}=+*^?#";
const decodeEl = document.getElementById('sidebarDecode');
let frame = 0;
const revealSpeed = 3;

function renderDecodeFrame(){
  let out = "";
  const lockedCount = Math.floor(frame / revealSpeed);
  for(let i=0;i<target.length;i++){
    if(target[i] === " "){ out += " "; continue; }
    out += (i < lockedCount) ? target[i] : scrambleChars[Math.floor(Math.random()*scrambleChars.length)];
  }
  decodeEl.innerHTML = out + '<span class="cursor"></span>';
  frame++;
  if(lockedCount <= target.length){
    setTimeout(renderDecodeFrame, 30);
  } else {
    decodeEl.innerHTML = target + '<span class="cursor"></span>';
  }
}
renderDecodeFrame();

/* ---------- ASCII starfield background ---------- */
const canvas = document.getElementById('ascii-bg');
const ctx = canvas.getContext('2d');
let W, H, cells = [];
const CHARSET = ['.', ':', '+', '*', 'x', '\u00b7', '\u00b0'];

function resize(){
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  const cell = 26;
  const cols = Math.ceil(W / cell);
  const rows = Math.ceil(H / cell);
  cells = [];
  for(let i=0;i<cols*rows;i++){
    if(Math.random() < 0.05){
      cells.push({
        x: (i % cols) * cell + cell/2,
        y: Math.floor(i / cols) * cell + cell/2,
        ch: CHARSET[Math.floor(Math.random()*CHARSET.length)],
        base: Math.random()*0.4 + 0.06,
        speed: Math.random()*0.6 + 0.15,
        phase: Math.random()*Math.PI*2,
        size: Math.random()*6 + 8
      });
    }
  }
}
window.addEventListener('resize', resize);
resize();

function draw(t){
  ctx.clearRect(0,0,W,H);
  ctx.textAlign = 'center';
  for(const c of cells){
    const tw = c.base + Math.sin(t*0.001*c.speed + c.phase) * 0.3;
    const alpha = Math.max(0, Math.min(1, tw));
    ctx.font = c.size + 'px "JetBrains Mono", monospace';
    ctx.fillStyle = 'rgba(200,200,200,' + alpha.toFixed(2) + ')';
    ctx.fillText(c.ch, c.x, c.y);
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
