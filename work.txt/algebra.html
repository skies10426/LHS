  <h3 class="section-label">Things to Remember</h3>
  <ul class="steps-list"><li>Distribute before combining.</li><li>Only combine terms with matching variables and exponents.</li><li>A negative sign in front of parentheses distributes to every term inside.</li></ul>

  <h3 class="section-label">Mini Quiz</h3>
  <div class="quiz-block"><span class="qn">Q1</span> 3x + 9x <details><summary>Answer</summary><div class="ans">12x</div></details></div>
  <div class="quiz-block"><span class="qn">Q2</span> −(2x − 5) <details><summary>Answer</summary><div class="ans">−2x+5</div></details></div>
  <div class="quiz-block"><span class="qn">Q3</span> 4(x+3) − 2x <details><summary>Answer</summary><div class="ans">4x+12−2x = 2x+12</div></details></div>
  <div class="quiz-block"><span class="qn">Q4</span> 7a − 3b + 2a − b <details><summary>Answer</summary><div class="ans">9a − 4b</div></details></div>

  <div class="qcard"><div class="qhead"><span class="qnum">EXAM</span> Simplify: 5(2x − 3) − 2(3x − 1) + 4</div>
  <details><summary>Show Answer</summary><div class="ans">10x−15−6x+2+4 = 4x − 9</div></details></div>
</template>

<template id="tpl-multistep-eq">
  <h2 class="title">Multi-Step Equations &amp; Variables on Both Sides</h2>
  <p class="sub">Solving for x when it takes more than one move — including when x shows up on both sides.</p>

  <div class="card"><h3>Definition</h3>
  <div class="row">A <b>multi-step equation</b> requires more than one operation to isolate the variable. When variables appear on both sides, you first gather them onto one side before solving normally.</div>
  <div class="vocab-grid">
    <div class="vocab-item"><b>Isolate</b> to get the variable completely alone on one side.</div>
    <div class="vocab-item"><b>Inverse operation</b> the operation that undoes another (addition undoes subtraction, etc.).</div>
  </div></div>

  <div class="card"><h3>Key Rule</h3>
  <span class="formula">Whatever you do to one side of the equation, you must do to the other side too.</span>
  <div class="remember"><b>Remember it:</b> Undo operations in reverse PEMDAS order — addition/subtraction first, then multiplication/division, then deal with parentheses.</div></div>

  <div class="card"><h3>Step-by-Step Method</h3>
  <ol class="steps-list"><li>Distribute to clear any parentheses.</li><li>Combine like terms on each side separately.</li><li>Move all variable terms to one side (add/subtract).</li><li>Move all constants to the other side.</li><li>Divide both sides by the coefficient of the variable.</li><li>Check your answer in the original equation.</li></ol></div>

  <div class="card"><h3>Worked Examples</h3>
  <div class="row"><span class="diff-tag diff-easy">EASY</span> 3x + 5 = 20</div><div class="example">3x=15 → <b>x=5</b></div>
  <div class="row"><span class="diff-tag diff-med">MEDIUM</span> 4(x − 2) = 2x + 6</div><div class="example">4x−8=2x+6 → 2x=14 → <b>x=7</b></div>
  <div class="row"><span class="diff-tag diff-hard">HARD</span> 2(3x + 1) − 4 = 3(x − 2) + 5x</div><div class="example">6x+2−4=3x−6+5x → 6x−2=8x−6 → −2x=−4 → <b>x=2</b></div>
  </div>

  <div class="card"><h3>What If We Change Something?</h3>
  <div class="row"><b>What if the variables cancel out completely?</b> Like 2x+3=2x+3 → true statement (0=0) → infinite solutions. If it simplifies to something false like 5=8 → no solution.</div>
  <div class="row"><b>What if there's a fraction as a coefficient?</b> Multiply both sides by the denominator first to clear it, then solve normally.</div>
  <div class="row"><b>What if the equation becomes an inequality instead?</b> Solve exactly the same way, but flip the sign if you multiply/divide by a negative.</div>
  </div>

  <div class="mistake"><div class="no">01</div><div><b>Only moving the variable term from one side</b> and forgetting to combine it with the variable term already on the other side.</div></div>
  <div class="mistake"><div class="no">02</div><div><b>Distributing incorrectly</b> before combining like terms, especially with a negative out front.</div></div>
  <div class="mistake"><div class="no">03</div><div><b>Dividing only part of one side</b> by the coefficient instead of the entire side.</div></div>

  <div class="callout tip"><b>Test tip:</b> Always plug your final answer back into the ORIGINAL equation (before you simplified) to catch arithmetic slips.</div>
  <div class="callout"><b>Real-world use:</b> Figuring out when two phone plans cost the same amount (a flat fee plus a per-minute rate) is a variables-on-both-sides equation.</div>

  <h3 class="section-label">Practice Problems</h3>
  <div class="qcard"><div class="qhead"><span class="qnum">P1</span> 2x − 7 = 15</div><details><summary>Show Answer</summary><div class="ans">x = 11</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P2</span> 5x + 3 = 3x + 11</div><details><summary>Show Answer</summary><div class="ans">2x=8 → x=4</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P3</span> 3(x + 1) = 2x + 9</div><details><summary>Show Answer</summary><div class="ans">3x+3=2x+9 → x=6</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P4</span> 7 − 2x = 3x − 8</div><details><summary>Show Answer</summary><div class="ans">15=5x → x=3</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">CHALLENGE</span> 4(2x − 3) = 2(3x + 2) − 2</div><details><summary>Show Answer</summary><div class="ans">8x−12=6x+4−2 → 8x−12=6x+2 → 2x=14 → x=7</div></details></div>

  <h3 class="section-label">Things to Remember</h3>
  <ul class="steps-list"><li>Clear parentheses and combine like terms first.</li><li>Gather variables on one side, constants on the other.</li><li>An equation that simplifies to a true statement has infinite solutions; a false one has none.</li></ul>

  <h3 class="section-label">Mini Quiz</h3>
  <div class="quiz-block"><span class="qn">Q1</span> 4x + 1 = 21 <details><summary>Answer</summary><div class="ans">x=5</div></details></div>
  <div class="quiz-block"><span class="qn">Q2</span> 6x − 2 = 4x + 10 <details><summary>Answer</summary><div class="ans">x=6</div></details></div>
  <div class="quiz-block"><span class="qn">Q3</span> 2(x − 3) = 2x − 6 <details><summary>Answer</summary><div class="ans">true for all x → infinite solutions</div></details></div>
  <div class="quiz-block"><span class="qn">Q4</span> 3x + 4 = 3x − 1 <details><summary>Answer</summary><div class="ans">4=−1, false → no solution</div></details></div>

  <div class="qcard"><div class="qhead"><span class="qnum">EXAM</span> Solve: 5(x − 2) + 3 = 2(2x + 1) − x</div>
  <details><summary>Show Answer</summary><div class="ans">5x−10+3=4x+2−x → 5x−7=3x+2 → 2x=9 → x=4.5</div></details></div>
</template>

<template id="tpl-literal-eq">
  <h2 class="title">Literal Equations &amp; Formulas</h2>
  <p class="sub">Solving an equation for one specific variable, even when it's surrounded by other letters.</p>

  <div class="card"><h3>Definition</h3>
  <div class="row">A <b>literal equation</b> is an equation with two or more variables (often a real formula, like d = rt). "Solving" it means isolating one requested variable in terms of the others.</div>
  <div class="vocab-grid">
    <div class="vocab-item"><b>Formula</b> an equation that relates real-world quantities (area, distance, interest, etc.).</div>
    <div class="vocab-item"><b>Solve for a variable</b> isolate that one letter completely on one side.</div>
  </div></div>

  <div class="card"><h3>Key Rule</h3>
  <span class="formula">Treat every other letter exactly like a number — use the same inverse operations you'd use to solve for x.</span>
  <div class="remember"><b>Remember it:</b> Cover up every letter except the one you're solving for, and pretend the rest are just "some number."</div></div>

  <div class="card"><h3>Step-by-Step Method</h3>
  <ol class="steps-list"><li>Identify which variable you're solving for.</li><li>Use inverse operations to move every other term/letter away from it.</li><li>If the target variable appears more than once, factor it out.</li><li>Divide by whatever is left multiplying it.</li></ol></div>

  <div class="card"><h3>Worked Examples</h3>
  <div class="row"><span class="diff-tag diff-easy">EASY</span> Solve d = rt for t</div><div class="example">divide both sides by r: <b>t = d/r</b></div>
  <div class="row"><span class="diff-tag diff-med">MEDIUM</span> Solve P = 2l + 2w for w</div><div class="example">P−2l=2w → <b>w = (P−2l)/2</b></div>
  <div class="row"><span class="diff-tag diff-hard">HARD</span> Solve A = ½h(b₁+b₂) for b₁</div><div class="example">2A=h(b₁+b₂) → 2A/h=b₁+b₂ → <b>b₁ = 2A/h − b₂</b></div>
  </div>

  <div class="card"><h3>What If We Change Something?</h3>
  <div class="row"><b>What if the variable you want appears twice?</b> Like ax + bx = c, solve for x → factor: x(a+b)=c → x = c/(a+b).</div>
  <div class="row"><b>What if you're solving for a variable that's squared?</b> Isolate the squared term, then apply a square root to both sides (remembering ±, unless the context rules one out).</div>
  <div class="row"><b>What if the formula has a fraction?</b> Multiply every term by the denominator first to clear it before isolating your variable.</div>
  </div>

  <div class="mistake"><div class="no">01</div><div><b>Dividing only one term by the leftover letter</b> instead of the entire side of the equation.</div></div>
  <div class="mistake"><div class="no">02</div><div><b>Forgetting to factor out the target variable</b> when it appears in more than one term.</div></div>
  <div class="mistake"><div class="no">03</div><div><b>Treating other variables as if they combine like numbers</b> (a + b ≠ ab, and they can't simplify further).</div></div>

  <div class="callout tip"><b>Test tip:</b> Box in the variable you're solving for at the very start so you don't accidentally isolate the wrong letter.</div>
  <div class="callout"><b>Real-world use:</b> Rearranging the simple interest formula I = Prt to solve for the rate r is exactly what a bank calculator does behind the scenes.</div>

  <h3 class="section-label">Practice Problems</h3>
  <div class="qcard"><div class="qhead"><span class="qnum">P1</span> Solve I = Prt for P</div><details><summary>Show Answer</summary><div class="ans">P = I/(rt)</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P2</span> Solve y = mx + b for x</div><details><summary>Show Answer</summary><div class="ans">x = (y−b)/m</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P3</span> Solve 2x + 3y = 12 for y</div><details><summary>Show Answer</summary><div class="ans">y = (12−2x)/3</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P4</span> Solve V = lwh for h</div><details><summary>Show Answer</summary><div class="ans">h = V/(lw)</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">CHALLENGE</span> Solve ax + bx = c for x</div><details><summary>Show Answer</summary><div class="ans">x(a+b)=c → x = c/(a+b)</div></details></div>

  <h3 class="section-label">Things to Remember</h3>
  <ul class="steps-list"><li>Treat other letters as if they were numbers.</li><li>Factor out the target variable if it appears more than once.</li><li>Always divide by whatever is left multiplying your variable, not just part of it.</li></ul>

  <h3 class="section-label">Mini Quiz</h3>
  <div class="quiz-block"><span class="qn">Q1</span> Solve F = ma for a <details><summary>Answer</summary><div class="ans">a = F/m</div></details></div>
  <div class="quiz-block"><span class="qn">Q2</span> Solve y − y₁ = m(x − x₁) for m <details><summary>Answer</summary><div class="ans">m = (y−y₁)/(x−x₁)</div></details></div>
  <div class="quiz-block"><span class="qn">Q3</span> Solve C = 2πr for r <details><summary>Answer</summary><div class="ans">r = C/(2π)</div></details></div>
  <div class="quiz-block"><span class="qn">Q4</span> Solve 5x − y = 10 for y <details><summary>Answer</summary><div class="ans">y = 5x − 10</div></details></div>

  <div class="qcard"><div class="qhead"><span class="qnum">EXAM</span> Solve for r: A = P(1 + rt)</div>
  <details><summary>Show Answer</summary><div class="ans">A/P = 1+rt → A/P − 1 = rt → r = (A/P − 1)/t = (A−P)/(Pt)</div></details></div>
</template>

<template id="tpl-inequalities-basic">
  <h2 class="title">One &amp; Multi-Step Inequalities</h2>
  <p class="sub">Just like equations — except the answer is a whole range of values, not just one number.</p>

  <div class="card"><h3>Definition</h3>
  <div class="row">An <b>inequality</b> compares two expressions using &lt;, &gt;, ≤, or ≥ instead of an equals sign, and its solution is a range of values, usually shown on a number line.</div>
  <div class="vocab-grid">
    <div class="vocab-item"><b>Open circle</b> used for &lt; or &gt; — that endpoint is NOT included.</div>
    <div class="vocab-item"><b>Closed circle</b> used for ≤ or ≥ — that endpoint IS included.</div>
  </div></div>

  <div class="card"><h3>Key Rule</h3>
  <span class="formula">Solve exactly like an equation — EXCEPT flip the inequality sign when multiplying or dividing by a negative number.</span>
  <div class="remember"><b>Remember it:</b> "Negative flips it." No other operation flips the sign — only multiplying or dividing by a negative.</div></div>

  <div class="card"><h3>Step-by-Step Method</h3>
  <ol class="steps-list"><li>Distribute and combine like terms on each side.</li><li>Move variable terms to one side, constants to the other.</li><li>Divide by the coefficient — flip the sign if that number is negative.</li><li>Graph the solution: open/closed circle, shade the correct direction.</li></ol></div>

  <div class="card"><h3>Worked Examples</h3>
  <div class="row"><span class="diff-tag diff-easy">EASY</span> x + 4 &gt; 9</div><div class="example"><b>x &gt; 5</b></div>
  <div class="row"><span class="diff-tag diff-med">MEDIUM</span> 3x − 2 ≤ 10</div><div class="example">3x≤12 → <b>x ≤ 4</b></div>
  <div class="row"><span class="diff-tag diff-hard">HARD</span> −2(x + 3) &gt; 4x − 6</div><div class="example">−2x−6&gt;4x−6 → −6x&gt;0 → divide by −6, flip: <b>x &lt; 0</b></div>
  </div>

  <div class="graph-card">
    <svg viewBox="0 0 400 90" xmlns="http://www.w3.org/2000/svg">
      <line x1="20" y1="45" x2="380" y2="45" stroke="var(--gray-2)" stroke-width="2"/>
      <line x1="60" y1="38" x2="60" y2="52" stroke="var(--gray-2)" stroke-width="2"/>
      <text x="60" y="72" fill="var(--gray-2)" font-size="13" text-anchor="middle" font-family="JetBrains Mono, monospace">0</text>
      <circle cx="200" cy="45" r="7" fill="var(--black)" stroke="var(--white)" stroke-width="2.5"/>
      <text x="200" y="72" fill="var(--white)" font-size="13" text-anchor="middle" font-family="JetBrains Mono, monospace">5</text>
      <line x1="200" y1="45" x2="370" y2="45" stroke="var(--white)" stroke-width="4"/>
      <polygon points="370,38 385,45 370,52" fill="var(--white)"/>
    </svg>
    <div class="graph-caption">x &gt; 5 — open circle at 5, shaded to the right (arrow shows the solution keeps going forever)</div>
  </div>

  <div class="card"><h3>What If We Change Something?</h3>
  <div class="row"><b>What if the sign is ≥ or ≤ instead of &gt; or &lt;?</b> Use a closed (filled-in) circle at that endpoint instead of an open one — the boundary value is included.</div>
  <div class="row"><b>What if you multiply both sides by a negative?</b> The inequality sign flips direction: &lt; becomes &gt;, ≤ becomes ≥, and vice versa.</div>
  <div class="row"><b>What if x ends up on the right side?</b> Rewrite it with x first by flipping the whole inequality around (5 &lt; x becomes x &gt; 5) — the arrow direction relative to x stays the same.</div>
  </div>

  <div class="mistake"><div class="no">01</div><div><b>Forgetting to flip the sign</b> when dividing by a negative coefficient.</div></div>
  <div class="mistake"><div class="no">02</div><div><b>Using an open circle for ≤/≥</b> or a closed circle for &lt;/&gt; — the circle type must match the symbol.</div></div>
  <div class="mistake"><div class="no">03</div><div><b>Shading the wrong direction</b> on the number line — plug in a test point if unsure which way to shade.</div></div>

  <div class="callout tip"><b>Test tip:</b> After solving, plug a value from your shaded region back into the ORIGINAL inequality to confirm the direction is correct.</div>
  <div class="callout"><b>Real-world use:</b> A budget constraint ("you can spend at most $50") or a speed limit ("must drive under 65 mph") are both real inequalities.</div>

  <h3 class="section-label">Practice Problems</h3>
  <div class="qcard"><div class="qhead"><span class="qnum">P1</span> x − 3 &lt; 7</div><details><summary>Show Answer</summary><div class="ans">x &lt; 10</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P2</span> −4x ≥ 20</div><details><summary>Show Answer</summary><div class="ans">divide by −4, flip: x ≤ −5</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P3</span> 2x + 5 &gt; 3x − 1</div><details><summary>Show Answer</summary><div class="ans">6 &gt; x → x &lt; 6</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P4</span> 5 − 2x ≤ 15</div><details><summary>Show Answer</summary><div class="ans">−2x≤10 → x≥−5</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">CHALLENGE</span> −3(2x − 1) &lt; 5x + 10</div><details><summary>Show Answer</summary><div class="ans">−6x+3&lt;5x+10 → −11x&lt;7 → x&gt;−7/11</div></details></div>

  <h3 class="section-label">Things to Remember</h3>
  <ul class="steps-list"><li>Solve like an equation — but flip the sign for negative × or ÷.</li><li>Open circle for &lt;/&gt;, closed circle for ≤/≥.</li><li>Test a point from your answer region to double-check the shading direction.</li></ul>

  <h3 class="section-label">Mini Quiz</h3>
  <div class="quiz-block"><span class="qn">Q1</span> x + 6 ≥ 2 <details><summary>Answer</summary><div class="ans">x ≥ −4</div></details></div>
  <div class="quiz-block"><span class="qn">Q2</span> −x &gt; 3 <details><summary>Answer</summary><div class="ans">x &lt; −3</div></details></div>
  <div class="quiz-block"><span class="qn">Q3</span> 2x − 5 ≤ 9 <details><summary>Answer</summary><div class="ans">x ≤ 7</div></details></div>
  <div class="quiz-block"><span class="qn">Q4</span> 4 &lt; x − 1 <details><summary>Answer</summary><div class="ans">x &gt; 5</div></details></div>

  <div class="qcard"><div class="qhead"><span class="qnum">EXAM</span> Solve: 3(x − 2) ≥ 5x + 4</div>
  <details><summary>Show Answer</summary><div class="ans">3x−6≥5x+4 → −2x≥10 → divide by −2, flip: x≤−5</div></details></div>
</template>

<template id="tpl-inequalities-adv">
  <h2 class="title">Compound &amp; Absolute Value Inequalities</h2>
  <p class="sub">Two inequalities working together, or an absolute value wrapping the whole thing.</p>

  <div class="card"><h3>Definition</h3>
  <div class="row">A <b>compound inequality</b> joins two inequalities with "and" (both must be true — an overlap) or "or" (at least one must be true — two separate regions).</div>
  <div class="vocab-grid">
    <div class="vocab-item"><b>"And" compound</b> the solution is where both conditions overlap.</div>
    <div class="vocab-item"><b>"Or" compound</b> the solution is everything satisfying either condition.</div>
  </div></div>

  <div class="card"><h3>Key Rules</h3>
  <span class="formula">|x| &lt; a  →  −a &lt; x &lt; a       |x| &gt; a  →  x &lt; −a  OR  x &gt; a</span>
  <div class="remember"><b>Remember it:</b> "Less than" absolute value = a sandwich (between two values). "Greater than" absolute value = a split (two separate arrows).</div></div>

  <div class="card"><h3>Step-by-Step Method</h3>
  <ol class="steps-list"><li>For a three-part compound inequality (a &lt; x + b &lt; c), do the same operation to all three parts at once.</li><li>For an absolute value inequality, isolate the bars first, then rewrite as "and" (for &lt;) or "or" (for &gt;).</li><li>Solve each resulting inequality.</li><li>Graph: overlap for "and," two rays for "or."</li></ol></div>

  <div class="card"><h3>Worked Examples</h3>
  <div class="row"><span class="diff-tag diff-easy">EASY</span> −3 &lt; x + 1 &lt; 5</div><div class="example">subtract 1 from all three parts: <b>−4 &lt; x &lt; 4</b></div>
  <div class="row"><span class="diff-tag diff-med">MEDIUM</span> |x − 2| ≤ 6</div><div class="example">−6≤x−2≤6 → <b>−4 ≤ x ≤ 8</b></div>
  <div class="row"><span class="diff-tag diff-hard">HARD</span> |2x + 1| &gt; 7</div><div class="example">2x+1&gt;7 → x&gt;3   OR   2x+1&lt;−7 → x&lt;−4</div>
  </div>

  <div class="card"><h3>What If We Change Something?</h3>
  <div class="row"><b>What if the inequality symbol were "and" (∩) written as two separate inequalities?</b> Solve each separately and take the OVERLAP of the two number lines as your answer.</div>
  <div class="row"><b>What if the absolute value inequality uses ≥ or ≤ instead of &gt; or &lt;?</b> Same split (and/or), but the boundary points become closed circles instead of open ones.</div>
  <div class="row"><b>What if |expression| &lt; a negative number?</b> No solution — an absolute value can never be less than a negative number.</div>
  </div>

  <div class="mistake"><div class="no">01</div><div><b>Mixing up "and" vs. "or"</b> — less-than absolute values are "and" (between), greater-than are "or" (split).</div></div>
  <div class="mistake"><div class="no">02</div><div><b>Forgetting to flip BOTH inequality signs</b> when negating an absolute value's "or" case.</div></div>
  <div class="mistake"><div class="no">03</div><div><b>Not applying an operation to all three parts</b> of a three-part compound inequality equally.</div></div>

  <div class="callout tip"><b>Test tip:</b> Sketch a quick number line for every compound inequality — "and" answers look like one solid segment, "or" answers look like two separate rays.</div>
  <div class="callout"><b>Real-world use:</b> A healthy resting heart rate range ("between 60 and 100 bpm") is a compound "and" inequality in everyday use.</div>

  <h3 class="section-label">Practice Problems</h3>
  <div class="qcard"><div class="qhead"><span class="qnum">P1</span> −5 ≤ 2x − 1 ≤ 9</div><details><summary>Show Answer</summary><div class="ans">−4≤2x≤10 → −2≤x≤5</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P2</span> |x + 4| &lt; 3</div><details><summary>Show Answer</summary><div class="ans">−7&lt;x&lt;−1</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P3</span> |x| ≥ 5</div><details><summary>Show Answer</summary><div class="ans">x≤−5 or x≥5</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P4</span> x &lt; −2 or x &gt; 6 — describe in words</div><details><summary>Show Answer</summary><div class="ans">all numbers less than −2, or greater than 6 (two separate rays)</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">CHALLENGE</span> |3x − 2| ≥ 10</div><details><summary>Show Answer</summary><div class="ans">3x−2≥10→x≥4  or  3x−2≤−10→x≤−8/3</div></details></div>

  <h3 class="section-label">Things to Remember</h3>
  <ul class="steps-list"><li>|x| &lt; a is "and" (a sandwich); |x| &gt; a is "or" (a split).</li><li>Three-part inequalities need the same operation on all three sections.</li><li>An absolute value can't be less than a negative — that case has no solution.</li></ul>

  <h3 class="section-label">Mini Quiz</h3>
  <div class="quiz-block"><span class="qn">Q1</span> −2 &lt; x + 3 &lt; 6 <details><summary>Answer</summary><div class="ans">−5&lt;x&lt;3</div></details></div>
  <div class="quiz-block"><span class="qn">Q2</span> |x − 1| &lt; 4 <details><summary>Answer</summary><div class="ans">−3&lt;x&lt;5</div></details></div>
  <div class="quiz-block"><span class="qn">Q3</span> |x + 2| &gt; 6 <details><summary>Answer</summary><div class="ans">x&gt;4 or x&lt;−8</div></details></div>
  <div class="quiz-block"><span class="qn">Q4</span> Is |x|&lt;−3 solvable? <details><summary>Answer</summary><div class="ans">No solution</div></details></div>

  <div class="qcard"><div class="qhead"><span class="qnum">EXAM</span> Solve: 2 ≤ |x − 4| and describe the graph</div>
  <details><summary>Show Answer</summary><div class="ans">x−4≥2→x≥6  or  x−4≤−2→x≤2 → two rays, closed circles at 2 and 6</div></details></div>
</template>
<template id="tpl-systems">
  <h2 class="title">Solving Systems of Equations</h2>
  <p class="sub">Three methods for finding where two lines meet: graphing, substitution, and elimination.</p>

  <div class="card"><h3>Definition</h3>
  <div class="row">A <b>system of equations</b> is a set of two (or more) equations solved together. The solution is the point (or points) that makes every equation in the system true at the same time.</div>
  <div class="vocab-grid">
    <div class="vocab-item"><b>Solution</b> the point where the lines intersect — an (x, y) pair.</div>
    <div class="vocab-item"><b>No solution</b> the lines are parallel — they never meet.</div>
    <div class="vocab-item"><b>Infinite solutions</b> the two equations describe the same line.</div>
  </div></div>

  <div class="card"><h3>The Three Methods</h3>
  <span class="formula">Graphing: plot both lines, read the intersection</span>
  <span class="formula">Substitution: solve one equation for a variable, plug into the other</span>
  <span class="formula">Elimination: add or subtract the equations to cancel a variable</span>
  <div class="remember"><b>Remember it:</b> Substitution shines when a variable is already isolated; elimination shines when the coefficients line up (or can easily be made to).</div></div>

  <div class="graph-card">
    <svg viewBox="0 0 340 240" xmlns="http://www.w3.org/2000/svg">
      <line x1="20" y1="120" x2="320" y2="120" stroke="var(--line)" stroke-width="1"/>
      <line x1="170" y1="10" x2="170" y2="230" stroke="var(--line)" stroke-width="1"/>
      <line x1="30" y1="220" x2="310" y2="20" stroke="var(--gray-1)" stroke-width="2.5"/>
      <line x1="30" y1="30" x2="310" y2="210" stroke="var(--white)" stroke-width="2.5"/>
      <circle cx="170" cy="115" r="6" fill="var(--white)"/>
      <text x="182" y="108" fill="var(--white)" font-size="13" font-family="JetBrains Mono, monospace">solution (x,y)</text>
    </svg>
    <div class="graph-caption">Graphing method — the intersection point of the two lines IS the system's solution</div>
  </div>

  <div class="card"><h3>Step-by-Step: Substitution</h3>
  <ol class="steps-list"><li>Solve one equation for one variable (pick the easiest one to isolate).</li><li>Substitute that expression into the OTHER equation.</li><li>Solve the resulting one-variable equation.</li><li>Plug that value back in to find the second variable.</li></ol></div>
  <div class="card"><h3>Step-by-Step: Elimination</h3>
  <ol class="steps-list"><li>Line up both equations with x-terms, y-terms, and constants matching columns.</li><li>Multiply one or both equations so a variable's coefficients are opposites.</li><li>Add the equations to cancel that variable.</li><li>Solve for the remaining variable, then substitute back to find the other.</li></ol></div>

  <div class="card"><h3>Worked Examples</h3>
  <div class="row"><span class="diff-tag diff-easy">EASY</span> y = 2x + 1  and  y = −x + 7  (substitution)</div><div class="example">2x+1=−x+7 → 3x=6 → x=2, y=5 → <b>(2, 5)</b></div>
  <div class="row"><span class="diff-tag diff-med">MEDIUM</span> x + y = 10  and  x − y = 2  (elimination)</div><div class="example">add straight down: 2x=12 → x=6, then y=4 → <b>(6, 4)</b></div>
  <div class="row"><span class="diff-tag diff-hard">HARD</span> 2x + 3y = 12  and  3x − y = 7  (elimination)</div><div class="example">multiply 2nd eq by 3: 9x−3y=21 → add to 1st: 11x=33 → x=3 → y=2 → <b>(3, 2)</b></div>
  </div>

  <div class="card"><h3>What If We Change Something?</h3>
  <div class="row"><b>What if both equations simplify to the same line?</b> Infinite solutions — every point on that line works.</div>
  <div class="row"><b>What if the variables cancel and leave a false statement (like 0 = 5)?</b> No solution — the lines are parallel and never intersect.</div>
  <div class="row"><b>What if neither coefficient matches for elimination?</b> Multiply one or both equations by a constant until one variable's coefficients become opposites.</div>
  </div>

  <div class="mistake"><div class="no">01</div><div><b>Forgetting to distribute a negative</b> when subtracting one whole equation from another instead of adding.</div></div>
  <div class="mistake"><div class="no">02</div><div><b>Solving for only one variable</b> and forgetting to substitute back in to find the second one.</div></div>
  <div class="mistake"><div class="no">03</div><div><b>Multiplying only one term of an equation</b> instead of every term, when scaling for elimination.</div></div>

  <div class="callout tip"><b>Test tip:</b> Check your final answer by plugging the (x, y) pair into BOTH original equations — it must satisfy both to be correct.</div>
  <div class="callout"><b>Real-world use:</b> Finding the "break-even point" where a company's cost and revenue are equal is a classic system-of-equations problem.</div>

  <h3 class="section-label">Practice Problems</h3>
  <div class="qcard"><div class="qhead"><span class="qnum">P1</span> y = x + 3, y = 2x + 1</div><details><summary>Show Answer</summary><div class="ans">x+3=2x+1 → x=2, y=5 → (2,5)</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P2</span> x + y = 8, x − y = 2</div><details><summary>Show Answer</summary><div class="ans">2x=10→x=5, y=3 → (5,3)</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P3</span> 2x + y = 7, x − y = 2</div><details><summary>Show Answer</summary><div class="ans">add: 3x=9→x=3, y=1 → (3,1)</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P4</span> 3x + 2y = 16, x = y + 2</div><details><summary>Show Answer</summary><div class="ans">3(y+2)+2y=16 → 5y+6=16 → y=2, x=4 → (4,2)</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">CHALLENGE</span> 4x − 3y = 1, 2x + y = 7</div><details><summary>Show Answer</summary><div class="ans">multiply 2nd by 3: 6x+3y=21 → add: 10x=22 → x=2.2, y=2.6</div></details></div>

  <h3 class="section-label">Things to Remember</h3>
  <ul class="steps-list"><li>The solution to a system is where every equation is true at once.</li><li>Substitution is fastest when a variable is already alone; elimination is fastest when coefficients line up.</li><li>Always check your (x, y) answer in BOTH original equations.</li></ul>

  <h3 class="section-label">Mini Quiz</h3>
  <div class="quiz-block"><span class="qn">Q1</span> y=3x, y=x+4 <details><summary>Answer</summary><div class="ans">3x=x+4→x=2, y=6 → (2,6)</div></details></div>
  <div class="quiz-block"><span class="qn">Q2</span> x+y=5, x−y=1 <details><summary>Answer</summary><div class="ans">2x=6→x=3, y=2 → (3,2)</div></details></div>
  <div class="quiz-block"><span class="qn">Q3</span> What does "no solution" mean graphically? <details><summary>Answer</summary><div class="ans">the lines are parallel</div></details></div>
  <div class="quiz-block"><span class="qn">Q4</span> What does "infinite solutions" mean graphically? <details><summary>Answer</summary><div class="ans">the two equations are the same line</div></details></div>

  <div class="qcard"><div class="qhead"><span class="qnum">EXAM</span> Solve: 5x + 2y = 11, 3x − 2y = 5</div>
  <details><summary>Show Answer</summary><div class="ans">add: 8x=16 → x=2 → 10+2y=11 → y=0.5 → (2, 0.5)</div></details></div>
</template>

<template id="tpl-systems-apps">
  <h2 class="title">Systems Word Problems</h2>
  <p class="sub">Turning a real-world situation with two unknowns into a system you can solve.</p>

  <div class="card"><h3>Definition</h3>
  <div class="row">A <b>systems application</b> problem describes two related quantities in words; you define two variables, write two equations from the story, and solve the resulting system.</div>
  <div class="vocab-grid">
    <div class="vocab-item"><b>Let statement</b> defining what each variable represents in words before writing equations.</div>
    <div class="vocab-item"><b>Constraint</b> a condition from the story that becomes one of your equations.</div>
  </div></div>

  <div class="card"><h3>Step-by-Step Method</h3>
  <ol class="steps-list"><li>Read the problem and identify the two unknown quantities.</li><li>Write a "let" statement defining each variable clearly.</li><li>Translate each sentence of the problem into an equation.</li><li>Solve the system using substitution or elimination.</li><li>Answer the actual question asked, with correct units.</li></ol></div>

  <div class="card"><h3>Worked Examples</h3>
  <div class="row"><span class="diff-tag diff-easy">EASY</span> Two numbers add to 20; one is 4 more than the other. Find them.</div><div class="example">x+y=20, x=y+4 → (y+4)+y=20 → y=8, x=12 → <b>8 and 12</b></div>
  <div class="row"><span class="diff-tag diff-med">MEDIUM</span> Tickets: adult $8, child $5. 200 tickets sold for $1,300 total. How many of each?</div><div class="example">a+c=200, 8a+5c=1300 → a=200−c → 8(200−c)+5c=1300 → 1600−3c=1300 → c=100, a=100</div>
  <div class="row"><span class="diff-tag diff-hard">HARD</span> A boat goes 30 mi downstream in 2 hr, and 30 mi upstream (same current) in 3 hr. Find the boat's speed and the current's speed.</div><div class="example">let b=boat, c=current: b+c=15, b−c=10 → add: 2b=25 → b=12.5 mph, c=2.5 mph</div>
  </div>

  <div class="card"><h3>What If We Change Something?</h3>
  <div class="row"><b>What if the problem gives a ratio instead of a difference?</b> ("one is twice the other") — write it directly as x = 2y and substitute the same way.</div>
  <div class="row"><b>What if there are three unknowns instead of two?</b> You'll need a third equation from the story — the method (substitution/elimination) still works, just with one more step.</div>
  <div class="row"><b>What if the units don't match?</b> Convert everything to the same unit (all minutes, all dollars, etc.) before writing your equations.</div>
  </div>

  <div class="mistake"><div class="no">01</div><div><b>Skipping the "let" statement</b> and losing track of which variable represents which quantity.</div></div>
  <div class="mistake"><div class="no">02</div><div><b>Solving the system correctly but answering the wrong question</b> — e.g., finding x when the problem actually asked for y.</div></div>
  <div class="mistake"><div class="no">03</div><div><b>Mixing up which number is the coefficient vs. the total</b> when translating a sentence into an equation.</div></div>

  <div class="callout tip"><b>Test tip:</b> Underline the two unknowns and the two given totals/relationships in the word problem before writing any equations.</div>
  <div class="callout"><b>Real-world use:</b> Mixing two types of coffee beans at different prices to hit a target blend price and total weight is a textbook systems application.</div>

  <h3 class="section-label">Practice Problems</h3>
  <div class="qcard"><div class="qhead"><span class="qnum">P1</span> Two numbers add to 15; their difference is 3. Find them.</div><details><summary>Show Answer</summary><div class="ans">x+y=15, x−y=3 → x=9, y=6</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P2</span> 3 apples + 2 oranges cost $3.50. 1 apple + 4 oranges cost $4.00. Find each price.</div><details><summary>Show Answer</summary><div class="ans">3a+2r=3.5, a+4r=4 → a=0.60, r=0.85</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P3</span> A jar has 30 coins, all dimes and quarters, worth $5.55. How many of each?</div><details><summary>Show Answer</summary><div class="ans">d+q=30, 0.10d+0.25q=5.55 → q=17, d=13</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P4</span> The sum of two numbers is 40; one is 3 times the other. Find them.</div><details><summary>Show Answer</summary><div class="ans">x+3x=40 → x=10, other=30</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">CHALLENGE</span> A gym charges a signup fee plus a monthly rate. 3 months costs $110; 7 months costs $190. Find the fee and monthly rate.</div><details><summary>Show Answer</summary><div class="ans">f+3m=110, f+7m=190 → 4m=80 → m=20, f=50</div></details></div>

  <h3 class="section-label">Things to Remember</h3>
  <ul class="steps-list"><li>Always start with a clear "let" statement for both variables.</li><li>Translate each sentence into its own equation before solving anything.</li><li>Re-read the question at the end — answer exactly what was asked.</li></ul>

  <h3 class="section-label">Mini Quiz</h3>
  <div class="quiz-block"><span class="qn">Q1</span> Two numbers add to 12, and one is double the other. Find them. <details><summary>Answer</summary><div class="ans">x+2x=12→x=4, other=8</div></details></div>
  <div class="quiz-block"><span class="qn">Q2</span> What's the first step in any systems word problem? <details><summary>Answer</summary><div class="ans">write a "let" statement for each unknown</div></details></div>
  <div class="quiz-block"><span class="qn">Q3</span> 40 tickets sold, adult ($6) + child ($4), total $196 — set up (don't solve) the system. <details><summary>Answer</summary><div class="ans">a+c=40, 6a+4c=196</div></details></div>
  <div class="quiz-block"><span class="qn">Q4</span> Why check units before writing equations? <details><summary>Answer</summary><div class="ans">mismatched units give a wrong equation even with correct algebra</div></details></div>

  <div class="qcard"><div class="qhead"><span class="qnum">EXAM</span> A theater sells 320 tickets for $2,540. Adult tickets are $10, student tickets are $6. How many of each were sold?</div>
  <details><summary>Show Answer</summary><div class="ans">a+s=320, 10a+6s=2540 → a=320−s → 10(320−s)+6s=2540 → 3200−4s=2540 → s=165, a=155</div></details></div>
</template>

<template id="tpl-polynomials">
  <h2 class="title">Adding, Subtracting &amp; Multiplying Polynomials</h2>
  <p class="sub">Combining and expanding expressions with more than one term.</p>

  <div class="card"><h3>Definition</h3>
  <div class="row">A <b>polynomial</b> is a sum of terms with non-negative whole-number exponents. Adding/subtracting combines like terms; multiplying distributes every term in one polynomial by every term in the other.</div>
  <div class="vocab-grid">
    <div class="vocab-item"><b>Monomial / Binomial / Trinomial</b> a polynomial with 1, 2, or 3 terms.</div>
    <div class="vocab-item"><b>Degree</b> the highest exponent in the polynomial.</div>
    <div class="vocab-item"><b>Special products</b> shortcut patterns for squaring or multiplying certain binomials.</div>
  </div></div>

  <div class="card"><h3>Key Rules</h3>
  <span class="formula">(a+b)² = a² + 2ab + b²      (a−b)² = a² − 2ab + b²      (a+b)(a−b) = a² − b²</span>
  <div class="remember"><b>Remember it:</b> Adding/subtracting = combine like terms only. Multiplying = distribute (FOIL for two binomials, term-by-term for anything bigger).</div></div>

  <div class="card"><h3>Step-by-Step: Multiplying Polynomials</h3>
  <ol class="steps-list"><li>Multiply every term in the first polynomial by every term in the second.</li><li>Keep track of exponent rules (aᵐ·aⁿ=aᵐ⁺ⁿ) as you go.</li><li>Combine any resulting like terms.</li><li>Write the answer from highest degree to lowest.</li></ol></div>

  <div class="card"><h3>Worked Examples</h3>
  <div class="row"><span class="diff-tag diff-easy">EASY</span> (3x² + 2x) + (x² − 5x)</div><div class="example">combine like terms: <b>4x² − 3x</b></div>
  <div class="row"><span class="diff-tag diff-med">MEDIUM</span> (2x − 3)(x + 4)</div><div class="example">FOIL: 2x²+8x−3x−12 = <b>2x² + 5x − 12</b></div>
  <div class="row"><span class="diff-tag diff-hard">HARD</span> (x + 3)(2x² − x + 5)</div><div class="example">distribute fully: 2x³−x²+5x + 6x²−3x+15 = <b>2x³ + 5x² + 2x + 15</b></div>
  </div>

  <div class="card"><h3>What If We Change Something?</h3>
  <div class="row"><b>What if you're subtracting a whole polynomial in parentheses?</b> Distribute the negative to every term of the second polynomial first, then combine like terms.</div>
  <div class="row"><b>What if it's a binomial squared, like (x+5)²?</b> Use the special product a²+2ab+b² instead of FOIL-ing it out longhand — same answer, faster.</div>
  <div class="row"><b>What if the polynomials have two variables, like (x+y)(x−y)?</b> The same rules apply — this one is the difference of squares pattern: x² − y².</div>
  </div>

  <div class="mistake"><div class="no">01</div><div><b>Forgetting to distribute the negative</b> when subtracting an entire polynomial.</div></div>
  <div class="mistake"><div class="no">02</div><div><b>The "freshman's dream" error:</b> (a+b)² = a² + b² — this skips the middle term; it must be a²+2ab+b².</div></div>
  <div class="mistake"><div class="no">03</div><div><b>Adding exponents incorrectly during multiplication</b>, like turning x²·x³ into x⁶ instead of x⁵.</div></div>

  <div class="callout tip"><b>Test tip:</b> Recognize the special-product patterns instantly — they save huge time versus FOIL-ing every squared binomial by hand.</div>
  <div class="callout"><b>Real-world use:</b> Multiplying a length polynomial by a width polynomial to get a total area expression (for a garden, room, or box) uses this exact skill.</div>

  <h3 class="section-label">Practice Problems</h3>
  <div class="qcard"><div class="qhead"><span class="qnum">P1</span> (5x² − 3x + 1) − (2x² + 4x − 6)</div><details><summary>Show Answer</summary><div class="ans">3x² − 7x + 7</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P2</span> (x + 6)(x − 2)</div><details><summary>Show Answer</summary><div class="ans">x²+4x−12</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P3</span> (x − 5)²</div><details><summary>Show Answer</summary><div class="ans">x²−10x+25</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P4</span> (2x + 1)(2x − 1)</div><details><summary>Show Answer</summary><div class="ans">4x² − 1</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">CHALLENGE</span> (x − 2)(x² + 3x − 4)</div><details><summary>Show Answer</summary><div class="ans">x³+3x²−4x −2x²−6x+8 = x³+x²−10x+8</div></details></div>

  <h3 class="section-label">Things to Remember</h3>
  <ul class="steps-list"><li>Add/subtract by combining like terms only.</li><li>Multiply by distributing every term to every term.</li><li>Memorize the three special products — they show up constantly.</li></ul>

  <h3 class="section-label">Mini Quiz</h3>
  <div class="quiz-block"><span class="qn">Q1</span> (4x+3)+(2x−7) <details><summary>Answer</summary><div class="ans">6x−4</div></details></div>
  <div class="quiz-block"><span class="qn">Q2</span> (x+7)(x+2) <details><summary>Answer</summary><div class="ans">x²+9x+14</div></details></div>
  <div class="quiz-block"><span class="qn">Q3</span> (x+4)² <details><summary>Answer</summary><div class="ans">x²+8x+16</div></details></div>
  <div class="quiz-block"><span class="qn">Q4</span> (3x−2)(3x+2) <details><summary>Answer</summary><div class="ans">9x²−4</div></details></div>

  <div class="qcard"><div class="qhead"><span class="qnum">EXAM</span> Simplify: (2x − 1)(x + 3) − (x − 4)²</div>
  <details><summary>Show Answer</summary><div class="ans">(2x²+5x−3) − (x²−8x+16) = x²+13x−19</div></details></div>
</template>

<template id="tpl-parabolas">
  <h2 class="title">Graphing Parabolas</h2>
  <p class="sub">Every quadratic function graphs into the same U-shaped curve — here's how to read and sketch it.</p>

  <div class="card"><h3>Definition</h3>
  <div class="row">A <b>parabola</b> is the U-shaped graph of any quadratic function y = ax² + bx + c. It's symmetric — fold it in half at the vertex and both sides match.</div>
  <div class="vocab-grid">
    <div class="vocab-item"><b>Vertex</b> the highest or lowest point on the parabola.</div>
    <div class="vocab-item"><b>Axis of symmetry</b> the vertical line through the vertex that splits the parabola into mirror halves.</div>
    <div class="vocab-item"><b>Roots / zeros</b> the x-intercepts, where the parabola crosses the x-axis.</div>
  </div></div>

  <div class="card"><h3>Key Formulas</h3>
  <span class="formula">Axis of symmetry: x = −b/(2a)      Vertex y-value: plug that x back into the equation</span>
  <div class="remember"><b>Remember it:</b> If a &gt; 0, the parabola smiles (opens up, has a minimum). If a &lt; 0, it frowns (opens down, has a maximum).</div></div>

  <div class="graph-card">
    <svg viewBox="0 0 340 240" xmlns="http://www.w3.org/2000/svg">
      <line x1="20" y1="200" x2="320" y2="200" stroke="var(--line)" stroke-width="1"/>
      <line x1="170" y1="10" x2="170" y2="230" stroke="var(--line)" stroke-width="1"/>
      <path d="M 60 200 Q 170 20 280 200" stroke="var(--white)" stroke-width="2.5" fill="none"/>
      <circle cx="170" cy="34" r="5" fill="var(--white)"/>
      <text x="182" y="30" fill="var(--white)" font-size="12" font-family="JetBrains Mono, monospace">vertex</text>
      <circle cx="60" cy="200" r="4" fill="var(--gray-1)"/>
      <circle cx="280" cy="200" r="4" fill="var(--gray-1)"/>
      <text x="60" y="218" fill="var(--gray-2)" font-size="11" text-anchor="middle" font-family="JetBrains Mono, monospace">root</text>
      <text x="280" y="218" fill="var(--gray-2)" font-size="11" text-anchor="middle" font-family="JetBrains Mono, monospace">root</text>
      <line x1="170" y1="20" x2="170" y2="200" stroke="var(--gray-3)" stroke-width="1" stroke-dasharray="4 3"/>
    </svg>
    <div class="graph-caption">a &gt; 0 → opens upward, vertex is a MINIMUM (dashed line = axis of symmetry)</div>
  </div>

  <div class="card"><h3>Step-by-Step Method</h3>
  <ol class="steps-list"><li>Find the axis of symmetry: x = −b/(2a).</li><li>Substitute that x back in to find the vertex's y-coordinate.</li><li>Find the y-intercept by plugging in x = 0 (it's just c).</li><li>Find x-intercepts (roots) by factoring or the quadratic formula, if needed.</li><li>Plot the vertex and a few symmetric points, then sketch the U-shape.</li></ol></div>

  <div class="card"><h3>Worked Examples</h3>
  <div class="row"><span class="diff-tag diff-easy">EASY</span> y = x² − 4 — find the vertex</div><div class="example">a=1,b=0 → axis: x=0 → y=0−4=−4 → vertex <b>(0, −4)</b></div>
  <div class="row"><span class="diff-tag diff-med">MEDIUM</span> y = x² − 6x + 5 — find the vertex &amp; axis of symmetry</div><div class="example">x=−(−6)/2(1)=3 → y=9−18+5=−4 → vertex <b>(3, −4)</b>, axis: <b>x = 3</b></div>
  <div class="row"><span class="diff-tag diff-hard">HARD</span> y = −2x² + 8x − 3 — find the vertex and state max or min</div><div class="example">x=−8/(2·−2)=2 → y=−2(4)+16−3=5 → vertex <b>(2, 5)</b>, a&lt;0 so it's a <b>maximum</b></div>
  </div>

  <div class="card"><h3>What If We Change Something?</h3>
  <div class="row"><b>What if a becomes negative?</b> The parabola flips upside down — same vertex x-location shape, but now it opens downward and the vertex becomes a maximum.</div>
  <div class="row"><b>What if |a| gets larger (like a=1 → a=4)?</b> The parabola gets narrower — it stretches vertically and grows faster away from the vertex.</div>
  <div class="row"><b>What if c changes?</b> The whole parabola shifts straight up or down — c is the y-intercept, and changing it doesn't affect the shape or the axis of symmetry.</div>
  </div>

  <div class="mistake"><div class="no">01</div><div><b>Forgetting the negative sign</b> in x = −b/(2a), especially when b is already negative.</div></div>
  <div class="mistake"><div class="no">02</div><div><b>Mixing up minimum and maximum</b> — always check the sign of a first.</div></div>
  <div class="mistake"><div class="no">03</div><div><b>Plugging the axis of symmetry x-value into the wrong equation</b> instead of back into the original quadratic to find the vertex's y-value.</div></div>

  <div class="callout tip"><b>Test tip:</b> Find the axis of symmetry first — it instantly tells you the x-coordinate of the vertex and gives you a mirror line for plotting extra points fast.</div>
  <div class="callout"><b>Real-world use:</b> The path of a thrown ball or a fired projectile is a parabola — the vertex represents the maximum height reached.</div>

  <h3 class="section-label">Practice Problems</h3>
  <div class="qcard"><div class="qhead"><span class="qnum">P1</span> Find the vertex of y = x² + 2x − 3</div><details><summary>Show Answer</summary><div class="ans">x=−1, y=1−2−3=−4 → (−1,−4)</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P2</span> Find the axis of symmetry of y = 2x² − 8x + 1</div><details><summary>Show Answer</summary><div class="ans">x = 8/4 = 2</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P3</span> Does y = −3x² + 5 have a max or min? What is it?</div><details><summary>Show Answer</summary><div class="ans">a&lt;0 → max at (0,5)</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P4</span> Find the y-intercept of y = 4x² − 7x + 9</div><details><summary>Show Answer</summary><div class="ans">y-intercept = c = 9</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">CHALLENGE</span> Find the vertex of y = 3x² − 12x + 7 and state whether it's wider or narrower than y = x²</div><details><summary>Show Answer</summary><div class="ans">x=2, y=12−24+7=−5 → (2,−5); |a|=3&gt;1 so it's narrower than y=x²</div></details></div>

  <h3 class="section-label">Things to Remember</h3>
  <ul class="steps-list"><li>x = −b/(2a) gives the axis of symmetry and the vertex's x-coordinate.</li><li>a &gt; 0 → opens up, minimum. a &lt; 0 → opens down, maximum.</li><li>c is always the y-intercept.</li></ul>

  <h3 class="section-label">Mini Quiz</h3>
  <div class="quiz-block"><span class="qn">Q1</span> Vertex of y=x²−8x+12 <details><summary>Answer</summary><div class="ans">x=4, y=16−32+12=−4 → (4,−4)</div></details></div>
  <div class="quiz-block"><span class="qn">Q2</span> Does y=5x²+1 open up or down? <details><summary>Answer</summary><div class="ans">up (a&gt;0)</div></details></div>
  <div class="quiz-block"><span class="qn">Q3</span> Axis of symmetry of y=−x²+6x <details><summary>Answer</summary><div class="ans">x=3</div></details></div>
  <div class="quiz-block"><span class="qn">Q4</span> y-intercept of y=2x²−5x−1 <details><summary>Answer</summary><div class="ans">−1</div></details></div>

  <div class="qcard"><div class="qhead"><span class="qnum">EXAM</span> A ball's height is modeled by h = −16t² + 64t. Find the maximum height and when it occurs.</div>
  <details><summary>Show Answer</summary><div class="ans">t=−64/(2·−16)=2 sec → h=−16(4)+128=64 ft → max height 64 ft at t=2 sec</div></details></div>
</template>

<template id="tpl-solving-quadratics">
  <h2 class="title">Solving Quadratics — 4 Ways</h2>
  <p class="sub">Square roots, factoring, completing the square, and the quadratic formula — when to reach for each.</p>

  <div class="card"><h3>Definition</h3>
  <div class="row"><b>Solving a quadratic</b> means finding the x-values (roots) that make ax² + bx + c = 0 true — where the parabola crosses the x-axis.</div>
  <div class="vocab-grid">
    <div class="vocab-item"><b>Completing the square</b> rewriting a quadratic as a perfect square plus a constant.</div>
    <div class="vocab-item"><b>Zero product property</b> if two factors multiply to 0, at least one of them must be 0.</div>
  </div></div>

  <div class="card"><h3>Which Method to Use</h3>
  <table class="regtable">
    <tr><th>Situation</th><th>Best Method</th></tr>
    <tr><td>x² = a number, no bx term</td><td>Square root both sides</td></tr>
    <tr><td>Trinomial factors nicely</td><td>Factoring + zero product property</td></tr>
    <tr><td>Leading coefficient is 1, doesn't factor easily</td><td>Completing the square</td></tr>
    <tr><td>Anything, especially if it doesn't factor</td><td>Quadratic Formula (always works)</td></tr>
  </table></div>

  <div class="card"><h3>Worked Examples</h3>
  <div class="row"><span class="diff-tag diff-easy">EASY</span> Solve x² − 16 = 0 (square roots)</div><div class="example">x²=16 → x=±4</div>
  <div class="row"><span class="diff-tag diff-med">MEDIUM</span> Solve x² − 3x − 10 = 0 (factoring)</div><div class="example">(x−5)(x+2)=0 → x=5 or x=−2</div>
  <div class="row"><span class="diff-tag diff-hard">HARD</span> Solve x² + 6x + 4 = 0 (completing the square)</div><div class="example">x²+6x=−4 → x²+6x+9=−4+9 → (x+3)²=5 → x+3=±√5 → x=−3±√5</div>
  </div>

  <div class="card"><h3>Step-by-Step: Completing the Square</h3>
  <ol class="steps-list"><li>Move the constant to the other side.</li><li>Take half of b, square it, and add that to both sides.</li><li>Rewrite the left side as a perfect square binomial.</li><li>Square-root both sides (remember ±) and solve for x.</li></ol></div>

  <div class="card"><h3>What If We Change Something?</h3>
  <div class="row"><b>What if the leading coefficient isn't 1?</b> Divide the entire equation by a first, before completing the square or before reading off b and c for the quadratic formula.</div>
  <div class="row"><b>What if the discriminant is negative?</b> There are no real solutions — the parabola never touches the x-axis (two imaginary roots instead).</div>
  <div class="row"><b>What if it's already factorable but you use the quadratic formula anyway?</b> You'll get the same answers — the quadratic formula always works, factoring is just often faster when it applies.</div>
  </div>

  <div class="mistake"><div class="no">01</div><div><b>Forgetting the ± when square-rooting both sides</b>, losing one of the two solutions.</div></div>
  <div class="mistake"><div class="no">02</div><div><b>Trying to use the zero product property on a sum</b>, like (x−3)+(x+2)=0, instead of a product — it only works on factors multiplied together.</div></div>
  <div class="mistake"><div class="no">03</div><div><b>Adding "half of b, squared" to only one side</b> instead of both sides while completing the square.</div></div>

  <div class="callout tip"><b>Test tip:</b> Try factoring first (it's usually fastest) — if it doesn't factor in a few seconds, jump straight to the quadratic formula rather than wasting time guessing.</div>
  <div class="callout"><b>Real-world use:</b> Finding when a launched object hits the ground (height = 0) requires solving a quadratic equation.</div>

  <h3 class="section-label">Practice Problems</h3>
  <div class="qcard"><div class="qhead"><span class="qnum">P1</span> x² − 49 = 0</div><details><summary>Show Answer</summary><div class="ans">x=±7</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P2</span> x² + 2x − 15 = 0</div><details><summary>Show Answer</summary><div class="ans">(x+5)(x−3)=0 → x=−5 or x=3</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P3</span> 2x² − 8 = 0</div><details><summary>Show Answer</summary><div class="ans">x²=4 → x=±2</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P4</span> x² − 4x − 1 = 0 (quadratic formula)</div><details><summary>Show Answer</summary><div class="ans">x=(4±√(16+4))/2=(4±√20)/2=2±√5</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">CHALLENGE</span> x² + 8x + 3 = 0 (completing the square)</div><details><summary>Show Answer</summary><div class="ans">x²+8x=−3 → +16 both sides → (x+4)²=13 → x=−4±√13</div></details></div>

  <h3 class="section-label">Things to Remember</h3>
  <ul class="steps-list"><li>Always check for a GCF or easy factoring first.</li><li>Square-rooting both sides always needs a ± symbol.</li><li>The quadratic formula works on every quadratic, even ones that don't factor.</li></ul>

  <h3 class="section-label">Mini Quiz</h3>
  <div class="quiz-block"><span class="qn">Q1</span> x² − 9 = 0 <details><summary>Answer</summary><div class="ans">x=±3</div></details></div>
  <div class="quiz-block"><span class="qn">Q2</span> x² − x − 6 = 0 <details><summary>Answer</summary><div class="ans">(x−3)(x+2)=0 → x=3 or x=−2</div></details></div>
  <div class="quiz-block"><span class="qn">Q3</span> When should you use the quadratic formula? <details><summary>Answer</summary><div class="ans">when factoring doesn't work easily, or it's guaranteed to work for anything</div></details></div>
  <div class="quiz-block"><span class="qn">Q4</span> x² + 4x + 4 = 0 <details><summary>Answer</summary><div class="ans">(x+2)²=0 → x=−2 (double root)</div></details></div>

  <div class="qcard"><div class="qhead"><span class="qnum">EXAM</span> Solve using any method: 2x² − 5x − 3 = 0</div>
  <details><summary>Show Answer</summary><div class="ans">factor: (2x+1)(x−3)=0 → x=−1/2 or x=3</div></details></div>
</template>
<template id="tpl-stats-center">
  <h2 class="title">Mean, Median, Mode &amp; Range</h2>
  <p class="sub">The core measures for describing a data set with a single number.</p>

  <div class="card"><h3>Definition</h3>
  <div class="row">These four values summarize a data set: where its "center" is (mean, median, mode) and how spread out it is (range).</div>
  <div class="vocab-grid">
    <div class="vocab-item"><b>Mean</b> the average — sum of values divided by how many there are.</div>
    <div class="vocab-item"><b>Median</b> the middle value when data is ordered.</div>
    <div class="vocab-item"><b>Mode</b> the most frequently occurring value.</div>
    <div class="vocab-item"><b>Range</b> the largest value minus the smallest value.</div>
  </div></div>

  <div class="card"><h3>Key Rules</h3>
  <span class="formula">Mean = (sum of all values) / (number of values)</span>
  <span class="formula">Median: order the data — middle value, or average of the two middle values if even count</span>
  <span class="formula">Range = max − min</span>
  <div class="remember"><b>Remember it:</b> "Mean is the average, Median is the middle, Mode is the Most common, Range is the Reach (spread)."</div></div>

  <div class="card"><h3>Step-by-Step Method</h3>
  <ol class="steps-list"><li>Order the data from smallest to largest (needed for median and range).</li><li>Add every value, divide by the count, to get the mean.</li><li>Find the middle value (or average the two middle values) for the median.</li><li>Find the most repeated value for the mode (there can be none, one, or several).</li><li>Subtract min from max for the range.</li></ol></div>

  <div class="card"><h3>Worked Examples</h3>
  <div class="row"><span class="diff-tag diff-easy">EASY</span> Data: 4, 8, 6, 8, 10 — find the mean</div><div class="example">(4+8+6+8+10)/5 = 36/5 = <b>7.2</b></div>
  <div class="row"><span class="diff-tag diff-med">MEDIUM</span> Data: 3, 7, 9, 12, 15, 20 — find the median</div><div class="example">already ordered, 6 values → average the middle two: (9+12)/2 = <b>10.5</b></div>
  <div class="row"><span class="diff-tag diff-hard">HARD</span> Data: 2, 5, 5, 8, 9, 9, 9, 14 — find mean, median, mode, and range</div><div class="example">mean=(2+5+5+8+9+9+9+14)/8=61/8=7.625; median=(8+9)/2=8.5; mode=9; range=14−2=12</div>
  </div>

  <div class="card"><h3>What If We Change Something?</h3>
  <div class="row"><b>What if you add an extreme outlier to the data set?</b> The mean shifts a lot toward the outlier, but the median barely moves — that's why median is often preferred for skewed data.</div>
  <div class="row"><b>What if there are two values tied for most frequent?</b> The data set is "bimodal" — it has two modes, list both.</div>
  <div class="row"><b>What if the data set has an odd number of values instead of even?</b> The median is just the single middle value — no averaging needed.</div>
  </div>

  <div class="mistake"><div class="no">01</div><div><b>Forgetting to order the data</b> before finding the median — an unordered "middle" value is meaningless.</div></div>
  <div class="mistake"><div class="no">02</div><div><b>Dividing by the wrong count</b> when computing the mean (miscounting how many data points there are).</div></div>
  <div class="mistake"><div class="no">03</div><div><b>Confusing range (max−min) with the count of values</b> in the data set.</div></div>

  <div class="callout tip"><b>Test tip:</b> A quick way to spot which measure a question wants: "average" = mean, "typical/middle" = median, "most common" = mode, "spread" = range.</div>
  <div class="callout"><b>Real-world use:</b> A teacher reporting the "average" test score is using the mean; reporting the "typical" score when a few students scored very low is often better done with the median.</div>

  <h3 class="section-label">Practice Problems</h3>
  <div class="qcard"><div class="qhead"><span class="qnum">P1</span> Find the mean: 10, 15, 20, 25</div><details><summary>Show Answer</summary><div class="ans">70/4=17.5</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P2</span> Find the median: 3, 9, 1, 7, 5</div><details><summary>Show Answer</summary><div class="ans">ordered:1,3,5,7,9 → median=5</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P3</span> Find the mode: 4, 4, 6, 8, 8, 8, 9</div><details><summary>Show Answer</summary><div class="ans">8</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P4</span> Find the range: 12, 45, 3, 27, 19</div><details><summary>Show Answer</summary><div class="ans">45−3=42</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">CHALLENGE</span> A 6th test score is added to five scores averaging 80 (sum 400); the new mean is 82. Find the 6th score.</div><details><summary>Show Answer</summary><div class="ans">new sum=82×6=492 → 492−400=92</div></details></div>

  <h3 class="section-label">Things to Remember</h3>
  <ul class="steps-list"><li>Order the data before finding median or range.</li><li>Outliers pull the mean but barely affect the median.</li><li>A data set can have zero, one, or multiple modes.</li></ul>

  <h3 class="section-label">Mini Quiz</h3>
  <div class="quiz-block"><span class="qn">Q1</span> Mean of 2, 4, 6, 8 <details><summary>Answer</summary><div class="ans">5</div></details></div>
  <div class="quiz-block"><span class="qn">Q2</span> Median of 1, 2, 2, 9, 100 <details><summary>Answer</summary><div class="ans">2</div></details></div>
  <div class="quiz-block"><span class="qn">Q3</span> Mode of 5, 6, 6, 7, 7, 8 <details><summary>Answer</summary><div class="ans">bimodal: 6 and 7</div></details></div>
  <div class="quiz-block"><span class="qn">Q4</span> Range of 100, 20, 60, 80 <details><summary>Answer</summary><div class="ans">100−20=80</div></details></div>

  <div class="qcard"><div class="qhead"><span class="qnum">EXAM</span> A data set has mean 20 with 5 values. A 6th value of 38 is added. Find the new mean.</div>
  <details><summary>Show Answer</summary><div class="ans">old sum=100 → new sum=138 → 138/6=23</div></details></div>
</template>

<template id="tpl-scatterplots">
  <h2 class="title">Scatter Plots &amp; Correlation</h2>
  <p class="sub">Visualizing the relationship between two numeric variables — and drawing a line through the trend.</p>

  <div class="card"><h3>Definition</h3>
  <div class="row">A <b>scatter plot</b> graphs paired data as points to reveal a possible relationship. A <b>line of best fit</b> is a single line that approximates the overall trend of those points.</div>
  <div class="vocab-grid">
    <div class="vocab-item"><b>Positive correlation</b> as one variable increases, so does the other.</div>
    <div class="vocab-item"><b>Negative correlation</b> as one variable increases, the other decreases.</div>
    <div class="vocab-item"><b>Outlier</b> a point far removed from the overall pattern.</div>
  </div></div>

  <div class="graph-card">
    <svg viewBox="0 0 340 220" xmlns="http://www.w3.org/2000/svg">
      <line x1="30" y1="190" x2="320" y2="190" stroke="var(--gray-3)" stroke-width="1"/>
      <line x1="30" y1="20" x2="30" y2="190" stroke="var(--gray-3)" stroke-width="1"/>
      <circle cx="60" cy="160" r="4" fill="var(--gray-1)"/>
      <circle cx="90" cy="150" r="4" fill="var(--gray-1)"/>
      <circle cx="120" cy="130" r="4" fill="var(--gray-1)"/>
      <circle cx="150" cy="120" r="4" fill="var(--gray-1)"/>
      <circle cx="180" cy="100" r="4" fill="var(--gray-1)"/>
      <circle cx="210" cy="90" r="4" fill="var(--gray-1)"/>
      <circle cx="240" cy="70" r="4" fill="var(--gray-1)"/>
      <circle cx="270" cy="55" r="4" fill="var(--gray-1)"/>
      <line x1="50" y1="170" x2="290" y2="45" stroke="var(--white)" stroke-width="2"/>
    </svg>
    <div class="graph-caption">Positive correlation — as x increases, y increases; the line of best fit trends upward</div>
  </div>

  <div class="card"><h3>Key Ideas</h3>
  <span class="formula">Strong correlation: points hug the line tightly    Weak correlation: points are scattered loosely around it</span>
  <div class="remember"><b>Remember it:</b> Correlation does NOT prove causation — two things can move together without one causing the other.</div></div>

  <div class="card"><h3>Step-by-Step: Reading a Scatter Plot</h3>
  <ol class="steps-list"><li>Look at the overall direction the points trend — up (positive), down (negative), or no clear pattern.</li><li>Judge how tightly the points cluster around an imaginary line — that's the correlation strength.</li><li>Identify any outliers that don't fit the pattern.</li><li>Use the line of best fit to make predictions (interpolation within the data, extrapolation beyond it).</li></ol></div>

  <div class="card"><h3>Worked Examples</h3>
  <div class="row"><span class="diff-tag diff-easy">EASY</span> As study hours increase, test scores increase. What kind of correlation?</div><div class="example"><b>positive correlation</b></div>
  <div class="row"><span class="diff-tag diff-med">MEDIUM</span> As a car's age increases, its resale value decreases. What kind of correlation?</div><div class="example"><b>negative correlation</b></div>
  <div class="row"><span class="diff-tag diff-hard">HARD</span> A line of best fit is y = 2x + 5. Predict y when x = 10, and state whether that's interpolation or extrapolation if the data only goes up to x = 8.</div><div class="example">y=2(10)+5=25; since x=10 is beyond the data range, this is <b>extrapolation</b> (less reliable)</div>
  </div>

  <div class="card"><h3>What If We Change Something?</h3>
  <div class="row"><b>What if the points show no clear upward or downward trend?</b> That's little to no correlation — knowing one variable doesn't help predict the other.</div>
  <div class="row"><b>What if one point sits far from all the others?</b> That's an outlier — it can pull a calculated line of best fit away from the true trend of the rest of the data.</div>
  <div class="row"><b>What if you're predicting far outside the given data range?</b> That's extrapolation, which is riskier than interpolation (predicting within the range) since the trend might not continue.</div>
  </div>

  <div class="mistake"><div class="no">01</div><div><b>Assuming correlation means causation</b> — a relationship between two variables doesn't prove one causes the other.</div></div>
  <div class="mistake"><div class="no">02</div><div><b>Trusting extrapolated predictions too far outside the data</b> as if they were guaranteed accurate.</div></div>
  <div class="mistake"><div class="no">03</div><div><b>Letting an obvious outlier skew your judgment</b> of the overall correlation strength.</div></div>

  <div class="callout tip"><b>Test tip:</b> If asked to describe correlation, always give both the direction (positive/negative/none) AND the strength (strong/weak).</div>
  <div class="callout"><b>Real-world use:</b> Businesses use scatter plots to see whether advertising spend correlates with sales — before assuming the ad campaign is the actual cause.</div>

  <h3 class="section-label">Practice Problems</h3>
  <div class="qcard"><div class="qhead"><span class="qnum">P1</span> As temperature drops, hot cocoa sales rise. Type of correlation?</div><details><summary>Show Answer</summary><div class="ans">negative</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P2</span> As a runner practices more, their race time drops. Type of correlation?</div><details><summary>Show Answer</summary><div class="ans">negative</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P3</span> Line of best fit: y = −3x + 40. Predict y at x = 5.</div><details><summary>Show Answer</summary><div class="ans">y=−15+40=25</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P4</span> Does correlation prove one variable causes the other?</div><details><summary>Show Answer</summary><div class="ans">No</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">CHALLENGE</span> A line of best fit is y = 1.5x + 2, fit to data from x=0 to x=20. Is predicting y at x=50 interpolation or extrapolation, and why is it riskier?</div><details><summary>Show Answer</summary><div class="ans">extrapolation — outside the observed data range, so the trend might not continue to hold</div></details></div>

  <h3 class="section-label">Things to Remember</h3>
  <ul class="steps-list"><li>Positive correlation trends up; negative trends down.</li><li>Correlation strength = how tightly points cluster around the trend line.</li><li>Correlation is never proof of causation.</li></ul>

  <h3 class="section-label">Mini Quiz</h3>
  <div class="quiz-block"><span class="qn">Q1</span> Height and shoe size — likely correlation? <details><summary>Answer</summary><div class="ans">positive</div></details></div>
  <div class="quiz-block"><span class="qn">Q2</span> What's an outlier? <details><summary>Answer</summary><div class="ans">a point far from the overall pattern</div></details></div>
  <div class="quiz-block"><span class="qn">Q3</span> Predicting within the observed data range is called? <details><summary>Answer</summary><div class="ans">interpolation</div></details></div>
  <div class="quiz-block"><span class="qn">Q4</span> Predicting beyond the observed data range is called? <details><summary>Answer</summary><div class="ans">extrapolation</div></details></div>

  <div class="qcard"><div class="qhead"><span class="qnum">EXAM</span> A scatter plot of ice cream sales vs. temperature shows a strong positive correlation. Does hot weather CAUSE higher sales? Explain.</div>
  <details><summary>Show Answer</summary><div class="ans">Not necessarily provable from correlation alone — though plausible here, correlation only shows a relationship, not proof of cause</div></details></div>
</template>

<template id="tpl-probability">
  <h2 class="title">Probability Basics</h2>
  <p class="sub">The math of how likely something is to happen.</p>

  <div class="card"><h3>Definition</h3>
  <div class="row"><b>Probability</b> measures how likely an event is, as a number between 0 (impossible) and 1 (certain), often written as a fraction or percent.</div>
  <div class="vocab-grid">
    <div class="vocab-item"><b>Outcome</b> one possible result of an experiment.</div>
    <div class="vocab-item"><b>Event</b> one or more outcomes you're interested in.</div>
    <div class="vocab-item"><b>Sample space</b> the set of all possible outcomes.</div>
    <div class="vocab-item"><b>Independent events</b> the outcome of one doesn't affect the other.</div>
  </div></div>

  <div class="card"><h3>Key Formulas</h3>
  <span class="formula">P(event) = (favorable outcomes) / (total possible outcomes)</span>
  <span class="formula">P(A and B, independent) = P(A) × P(B)</span>
  <div class="remember"><b>Remember it:</b> Probability is always a fraction of "what you want" over "everything that could happen."</div></div>

  <div class="card"><h3>Step-by-Step Method</h3>
  <ol class="steps-list"><li>Identify the total number of possible outcomes (the sample space).</li><li>Identify how many of those outcomes count as "favorable" for the event.</li><li>Divide favorable by total.</li><li>For two independent events together, multiply their individual probabilities.</li></ol></div>

  <div class="card"><h3>Worked Examples</h3>
  <div class="row"><span class="diff-tag diff-easy">EASY</span> Rolling a standard die, find P(rolling a 4)</div><div class="example">1 favorable / 6 total = <b>1/6</b></div>
  <div class="row"><span class="diff-tag diff-med">MEDIUM</span> A bag has 5 red and 3 blue marbles. Find P(blue)</div><div class="example">3 blue / 8 total = <b>3/8</b></div>
  <div class="row"><span class="diff-tag diff-hard">HARD</span> Flip a coin and roll a die. Find P(heads AND a 6)</div><div class="example">independent events: P(heads)=1/2, P(6)=1/6 → 1/2×1/6 = <b>1/12</b></div>
  </div>

  <div class="card"><h3>What If We Change Something?</h3>
  <div class="row"><b>What if the events are NOT independent (like drawing cards without replacement)?</b> The second probability changes because the sample space shrinks after the first draw — recalculate the total for the second event.</div>
  <div class="row"><b>What if you want "A or B" instead of "A and B"?</b> Add the individual probabilities, then subtract any overlap so you don't double-count: P(A or B) = P(A) + P(B) − P(A and B).</div>
  <div class="row"><b>What if the question asks for the probability something does NOT happen?</b> Use the complement: P(not A) = 1 − P(A).</div>
  </div>

  <div class="mistake"><div class="no">01</div><div><b>Forgetting to shrink the sample space</b> for a second draw when items aren't replaced.</div></div>
  <div class="mistake"><div class="no">02</div><div><b>Adding probabilities for "and" instead of multiplying</b> (or vice-versa for "or") — know which operation each keyword needs.</div></div>
  <div class="mistake"><div class="no">03</div><div><b>Leaving probability as a number greater than 1</b> — a valid probability must be between 0 and 1.</div></div>

  <div class="callout tip"><b>Test tip:</b> "And" with independent events → multiply. "Or" → add, then subtract any double-counted overlap.</div>
  <div class="callout"><b>Real-world use:</b> Weather forecasts ("70% chance of rain") and game odds both rely directly on probability calculations.</div>

  <h3 class="section-label">Practice Problems</h3>
  <div class="qcard"><div class="qhead"><span class="qnum">P1</span> P(drawing a king from a standard 52-card deck)</div><details><summary>Show Answer</summary><div class="ans">4/52 = 1/13</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P2</span> A spinner has 4 equal sections: red, blue, green, yellow. P(not red)?</div><details><summary>Show Answer</summary><div class="ans">1 − 1/4 = 3/4</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P3</span> P(rolling an even number on a die)</div><details><summary>Show Answer</summary><div class="ans">3/6 = 1/2</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P4</span> Two coin flips: P(both heads)</div><details><summary>Show Answer</summary><div class="ans">1/2×1/2=1/4</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">CHALLENGE</span> A bag has 4 red and 6 blue marbles. Draw 2 without replacement. Find P(both red).</div><details><summary>Show Answer</summary><div class="ans">4/10 × 3/9 = 12/90 = 2/15</div></details></div>

  <h3 class="section-label">Things to Remember</h3>
  <ul class="steps-list"><li>Probability = favorable outcomes ÷ total outcomes.</li><li>Independent "and" events multiply; "or" events add (minus overlap).</li><li>Without replacement, the sample space shrinks for later events.</li></ul>

  <h3 class="section-label">Mini Quiz</h3>
  <div class="quiz-block"><span class="qn">Q1</span> P(rolling a 1 or a 2) on a die <details><summary>Answer</summary><div class="ans">2/6=1/3</div></details></div>
  <div class="quiz-block"><span class="qn">Q2</span> P(not rolling a 6) <details><summary>Answer</summary><div class="ans">5/6</div></details></div>
  <div class="quiz-block"><span class="qn">Q3</span> What does "independent events" mean? <details><summary>Answer</summary><div class="ans">one outcome doesn't affect the other's probability</div></details></div>
  <div class="quiz-block"><span class="qn">Q4</span> Can a probability be 1.5? <details><summary>Answer</summary><div class="ans">No — must be between 0 and 1</div></details></div>

  <div class="qcard"><div class="qhead"><span class="qnum">EXAM</span> A jar has 3 red, 4 blue, 5 green marbles. Find P(red or blue) on one draw.</div>
  <details><summary>Show Answer</summary><div class="ans">(3+4)/12 = 7/12</div></details></div>
</template>

<template id="tpl-sequences">
  <h2 class="title">Arithmetic &amp; Geometric Sequences</h2>
  <p class="sub">Number patterns that add the same amount, or multiply by the same amount, every step.</p>

  <div class="card"><h3>Definition</h3>
  <div class="row">A <b>sequence</b> is an ordered list of numbers following a rule. <b>Arithmetic</b> sequences add a constant amount each step; <b>geometric</b> sequences multiply by a constant ratio each step.</div>
  <div class="vocab-grid">
    <div class="vocab-item"><b>Common difference (d)</b> the constant amount added each step in an arithmetic sequence.</div>
    <div class="vocab-item"><b>Common ratio (r)</b> the constant factor multiplied each step in a geometric sequence.</div>
    <div class="vocab-item"><b>Recursive rule</b> defines a term using the previous term.</div>
    <div class="vocab-item"><b>Explicit rule</b> defines a term directly from its position number n.</div>
  </div></div>

  <div class="card"><h3>Key Formulas</h3>
  <span class="formula">Arithmetic explicit: aₙ = a₁ + (n−1)d      Arithmetic recursive: aₙ = aₙ₋₁ + d</span>
  <span class="formula">Geometric explicit: aₙ = a₁ · r⁽ⁿ⁻¹⁾      Geometric recursive: aₙ = aₙ₋₁ · r</span>
  <div class="remember"><b>Remember it:</b> "Arithmetic ADDS, Geometric MULTIPLIES." Arithmetic behaves like a line (linear); geometric behaves like exponential growth.</div></div>

  <div class="card"><h3>Step-by-Step Method</h3>
  <ol class="steps-list"><li>Look at consecutive terms: is the same NUMBER being added (arithmetic) or the same FACTOR being multiplied (geometric)?</li><li>Find d (subtract consecutive terms) or r (divide consecutive terms).</li><li>Plug a₁, d or r, and n into the explicit formula to find any term directly.</li><li>Use the recursive rule when you only need the very next term.</li></ol></div>

  <div class="card"><h3>Worked Examples</h3>
  <div class="row"><span class="diff-tag diff-easy">EASY</span> 5, 9, 13, 17… find the 10th term</div><div class="example">arithmetic, d=4 → a₁₀=5+(9)(4)=5+36=<b>41</b></div>
  <div class="row"><span class="diff-tag diff-med">MEDIUM</span> 3, 6, 12, 24… find the 8th term</div><div class="example">geometric, r=2 → a₈=3·2⁷=3·128=<b>384</b></div>
  <div class="row"><span class="diff-tag diff-hard">HARD</span> A sequence has a₁=7 and recursive rule aₙ=aₙ₋₁−3. Write the explicit rule and find a₂₀.</div><div class="example">arithmetic, d=−3 → explicit: aₙ=7+(n−1)(−3) → a₂₀=7+(19)(−3)=7−57=<b>−50</b></div>
  </div>

  <div class="card"><h3>What If We Change Something?</h3>
