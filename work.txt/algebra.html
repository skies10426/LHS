  <div class="card">
    <h3><span class="pin">CONCEPT</span> Line of Best Fit &amp; Residuals</h3>
    <div class="row">A line of best fit is the single line that most closely approximates the trend in scattered data, usually written in y = mx + b form so it can predict new values.</div>
    <div class="row"><b>Residual</b> = actual y − predicted y. A good fit has small residuals scattered evenly above and below the line.</div>
    <div class="remember"><b>Remember it:</b> Correlation ≠ causation — a strong trend doesn't prove one variable causes the other.</div>
  </div>

  <div class="card">
    <h3><span class="pin">BASICS</span> Probability</h3>
    <span class="formula">P(event) = favorable outcomes / total possible outcomes</span>
    <div class="row">Probability is always between 0 (impossible) and 1 (certain). Independent events: multiply their probabilities together.</div>
    <div class="example">Rolling a die and getting an even number: P = 3/6 = 1/2</div>
  </div>

  <div class="qcard"><div class="qhead"><span class="qnum">EASY</span> Describe the correlation: hours studied vs. test score, both increasing together.</div>
  <details><summary>Show Answer</summary><div class="ans">Positive correlation</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">MEDIUM</span> A best-fit line is y = 2x + 10. Predict y when x = 5.</div>
  <details><summary>Show Answer</summary><div class="ans">y = 2(5)+10 = 20</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">HARD</span> A spinner has 4 equal sections: red, blue, green, yellow. Find P(not red) on two spins (independent).</div>
  <details><summary>Show Answer</summary><div class="ans">P(not red) = 3/4 each spin → (3/4)(3/4) = 9/16</div></details></div>

  <div class="mistake"><div class="no">!</div><div><b>Most common mistake:</b> assuming correlation proves causation.<br><span class="wrong">Wrong: "Ice cream sales and drowning rates rise together, so ice cream causes drownings."</span><br><span class="right">Right: both rise because of a hidden third factor — summer heat</span></div></div>
</template>

<template id="tpl-regents">
  <h2 class="title">Algebra I Regents — Exam Review</h2>
  <p class="sub">What to expect on test day, based on the official NYSED exam structure.</p>

  <div class="card">
    <h3>Exam Format</h3>
    <table class="regtable">
      <tr><th>Part</th><th>Question Type</th><th>Count</th><th>Points Each</th><th>Total</th></tr>
      <tr><td>I</td><td>Multiple choice</td><td>24</td><td>2</td><td>48</td></tr>
      <tr><td>II</td><td>Short constructed response</td><td>8</td><td>2</td><td>16</td></tr>
      <tr><td>III</td><td>Constructed response</td><td>4</td><td>4</td><td>16</td></tr>
      <tr><td>IV</td><td>Extended constructed response</td><td>1</td><td>6</td><td>6</td></tr>
    </table>
    <div class="row"><b>Time</b> 3 hours. <b>Calculator</b> A graphing calculator is required for the entire exam (no CAS models like the TI-89 or TI-Nspire CAS). <b>Reference sheet</b> A formula reference sheet — including the quadratic formula, sequence formulas, and exponential growth/decay — is printed in the exam booklet, so you don't need to memorize those from scratch, just know when to use them.</div>
  </div>

  <div class="card">
    <h3>What's Tested</h3>
    <div class="row">The exam blueprint weights topics roughly as: <b>Algebra</b> (equations, inequalities, factoring, systems) is the largest share, <b>Functions</b> (notation, graphs, transformations, sequences) is the second largest, and <b>Number &amp; Quantity</b> plus <b>Statistics &amp; Probability</b> make up smaller remaining portions.</div>
  </div>

  <div class="callout warn"><b>Scoring changes each administration.</b> Your raw score (out of the total points above) converts to a 0–100 scaled score using a conversion chart that NYSED releases separately for every exam date — it is not the same chart from year to year. Passing (Level 3) generally falls in the mid-60s and up, but check the official conversion chart for your specific test date rather than relying on a past one.</div>

  <div class="card">
    <h3>Test-Day Strategy</h3>
    <div class="row"><b>Part I (multiple choice):</b> No penalty for guessing and no partial credit — answer every question, even a guess. Eliminate obviously wrong choices first.</div>
    <div class="row"><b>Parts II–IV (constructed response):</b> Partial credit is real — show every step, label your final answer, and never leave a box blank. A wrong final answer with correct method still earns points.</div>
    <div class="row"><b>Pacing:</b> With 3 hours for 37 questions, that's roughly 4–5 minutes per question on average — but Part I questions usually go faster, leaving extra time for the longer constructed-response problems.</div>
  </div>
</template>

<template id="tpl-mistakes">
  <h2 class="title">Common Mistakes</h2>
  <p class="sub">The errors that cost the most points, semester after semester — with the fix right next to each one.</p>

  <div class="mistake"><div class="no">01</div><div><b>Forgetting to flip the inequality sign.</b><br><span class="wrong">Wrong: −2x &lt; 6 → x &lt; −3</span><br><span class="right">Right: −2x &lt; 6 → x &gt; −3 (flip when multiplying/dividing by a negative)</span></div></div>

  <div class="mistake"><div class="no">02</div><div><b>Distributing a negative sign incorrectly.</b><br><span class="wrong">Wrong: −(x − 3) = −x − 3</span><br><span class="right">Right: −(x − 3) = −x + 3 (the negative flips every term inside)</span></div></div>

  <div class="mistake"><div class="no">03</div><div><b>Square-rooting both sides and losing a solution.</b><br><span class="wrong">Wrong: x² = 16 → x = 4</span><br><span class="right">Right: x² = 16 → x = ±4</span></div></div>

  <div class="mistake"><div class="no">04</div><div><b>Mixing up slope and y-intercept.</b><br><span class="wrong">Wrong: reading y = 3x − 2 as slope −2, intercept 3</span><br><span class="right">Right: in y = mx + b, m (3) is slope, b (−2) is the y-intercept</span></div></div>

  <div class="mistake"><div class="no">05</div><div><b>Skipping a FOIL term.</b><br><span class="wrong">Wrong: (x+3)(x+5) = x² + 15</span><br><span class="right">Right: (x+3)(x+5) = x² + 5x + 3x + 15 = x² + 8x + 15</span></div></div>

  <div class="mistake"><div class="no">06</div><div><b>Factoring without checking for a GCF first.</b><br><span class="wrong">Wrong: 4x² + 8x → jumping straight to trinomial rules</span><br><span class="right">Right: pull out the GCF first → 4x(x + 2)</span></div></div>

  <div class="mistake"><div class="no">07</div><div><b>Adding exponents with different bases.</b><br><span class="wrong">Wrong: x³ · y² = (xy)⁵</span><br><span class="right">Right: exponent rules only combine when the base is the same — x³·y² stays as is</span></div></div>

  <div class="mistake"><div class="no">08</div><div><b>The "freshman's dream" error — squaring a binomial as two separate squares.</b><br><span class="wrong">Wrong: (x + y)² = x² + y²</span><br><span class="right">Right: (x + y)² = x² + 2xy + y² (don't forget the middle term)</span></div></div>

  <div class="mistake"><div class="no">09</div><div><b>Sign errors in the quadratic formula.</b><br><span class="wrong">Wrong: forgetting −b becomes positive when b is negative</span><br><span class="right">Right: carefully substitute the sign of b before simplifying, and always apply ± to the whole square root</span></div></div>

  <div class="mistake"><div class="no">10</div><div><b>Answering a different question than what was asked.</b><br><span class="wrong">Wrong: solving for x when the question asks for f(x), or leaving units off a word problem</span><br><span class="right">Right: re-read the question after solving and confirm you answered exactly what it asked</span></div></div>

  <div class="mistake"><div class="no">11</div><div><b>Rounding too early.</b><br><span class="wrong">Wrong: rounding a decimal mid-problem, then carrying the rounded value through several more steps</span><br><span class="right">Right: keep exact values (or full decimals) until the final answer, then round once</span></div></div>

  <div class="mistake"><div class="no">12</div><div><b>Confusing domain and range.</b><br><span class="wrong">Wrong: calling the set of y-values the domain</span><br><span class="right">Right: domain = all possible x-values (inputs); range = all possible y-values (outputs)</span></div></div>

  <div class="mistake"><div class="no">13</div><div><b>Not checking for extraneous solutions.</b><br><span class="wrong">Wrong: accepting every solution that comes out of a radical or rational equation</span><br><span class="right">Right: plug every solution back into the original equation — some make the equation false or undefined and must be thrown out</span></div></div>

  <div class="mistake"><div class="no">14</div><div><b>Leaving a constructed-response question blank.</b><br><span class="wrong">Wrong: skipping a problem because the final answer isn't obvious</span><br><span class="right">Right: show whatever steps you're sure of — Parts II–IV award partial credit for correct method, even with the wrong final answer</span></div></div>

  <div class="mistake"><div class="no">15</div><div><b>Combining unlike terms or unlike radicals.</b><br><span class="wrong">Wrong: 3x + 2x² = 5x³, or 2√3 + 5√2 = 7√5</span><br><span class="right">Right: only combine matching variable/exponent terms or matching radicals — 3x and 2x² stay separate; 2√3 and 5√2 stay separate</span></div></div>

  <hr class="tear">
  <h3 style="color:var(--white); font-family:'Press Start 2P',monospace; font-size:13px;">Teacher Trick Questions</h3>
  <p class="sub" style="margin-bottom:16px;">Patterns that show up again and again when a question is designed to catch a rushed answer.</p>
  <div class="card">
    <ul class="vocab-list">
      <li><b>Hidden GCF</b> — a factoring problem where every term shares a common factor before any "nicer" pattern applies. Always check for one first.</li>
      <li><b>Extra negative sign</b> — a problem written as −x² + 5x + 6 instead of x² − 5x − 6, testing whether you distribute the leading negative correctly.</li>
      <li><b>Answer choices that match a partial step</b> — on multiple choice, one wrong choice is often what you'd get by stopping halfway through (e.g., forgetting the ± in a square root). Finish the full process before picking an answer.</li>
      <li><b>Units or "in terms of"</b> — a word problem that asks for the answer in specific units, or asks you to express one variable "in terms of" another rather than solve for a number.</li>
      <li><b>A graph with a deceptive scale</b> — axes that don't start at 0 or use uneven intervals, designed to make slope or growth look different than it is.</li>
    </ul>
  </div>

  <div class="callout tip"><b>How to check your answer fast:</b> Substitute your solution back into the original equation (not a simplified version) and confirm both sides match. For factoring, re-multiply your factors with FOIL — if you don't land back on the original expression, re-factor.</div>

  <div class="callout"><b>Things you must memorize:</b> the quadratic formula, exponent rules (product/quotient/power), the slope formula, y = mx + b, the difference-of-squares pattern, and PEMDAS. Everything else on the Regents reference sheet doesn't need to be memorized — just recognized.</div>
</template>

<template id="tpl-top100">
  <h2 class="title">Top 100 Algebra Facts</h2>
  <p class="sub">A rapid-fire reference covering the whole course — ten groups of ten, organized by topic.</p>

  <div class="fact-group"><h3>Numbers &amp; Expressions</h3><ol class="fact-list">
  <li>A variable is a letter that represents an unknown or changing number.</li>
  <li>A coefficient is the number multiplied in front of a variable.</li>
  <li>A term is a single number, variable, or product/quotient of numbers and variables.</li>
  <li>Like terms have the exact same variable(s) raised to the exact same power(s).</li>
  <li>Order of operations: Parentheses, Exponents, Multiplication/Division, Addition/Subtraction (PEMDAS), left to right within each level.</li>
  <li>The distributive property: a(b + c) = ab + ac.</li>
  <li>The additive identity is 0 (adding it changes nothing); the multiplicative identity is 1.</li>
  <li>Opposites (additive inverses) sum to 0; reciprocals (multiplicative inverses) multiply to 1.</li>
  <li>Absolute value measures distance from zero and is always non-negative.</li>
  <li>A constant is a term with no variable — it never changes.</li>
  </ol></div>

  <div class="fact-group"><h3>Solving Equations</h3><ol class="fact-list">
  <li>Whatever you do to one side of an equation, you must do to the other.</li>
  <li>To isolate a variable, undo operations in reverse order of PEMDAS.</li>
  <li>An equation with no solution simplifies to a false statement (like 3 = 5).</li>
  <li>An equation with infinite solutions simplifies to a true statement (like 4 = 4).</li>
  <li>To solve a literal equation, isolate the requested variable just like any other equation.</li>
  <li>Multiplying or dividing an inequality by a negative flips the inequality sign.</li>
  <li>Compound inequalities ("and") describe an overlap; ("or") describe two separate regions.</li>
  <li>Absolute value equations |x| = a split into two cases: x = a and x = −a.</li>
  <li>Always check your solution by substituting it back into the original equation.</li>
  <li>A proportion is two equal ratios; solve by cross-multiplying.</li>
  </ol></div>

  <div class="fact-group"><h3>Linear Relationships</h3><ol class="fact-list">
  <li>A linear equation graphs as a straight line and has a constant rate of change.</li>
  <li>Slope tells direction: positive slopes rise left to right, negative slopes fall.</li>
  <li>A horizontal line has a slope of 0; a vertical line has an undefined slope.</li>
  <li>The x-intercept is where a line crosses the x-axis (y = 0).</li>
  <li>The y-intercept is where a line crosses the y-axis (x = 0).</li>
  <li>Two points always determine exactly one line.</li>
  <li>A system of equations is a set of equations solved together, at the same time.</li>
  <li>Systems can be solved by graphing, substitution, or elimination.</li>
  <li>A system's solution is the point (or points) where all the equations are true together.</li>
  <li>Parallel lines that never intersect form a system with no solution.</li>
  </ol></div>

  <div class="fact-group"><h3>Polynomials &amp; Factoring</h3><ol class="fact-list">
  <li>A polynomial is a sum of terms with non-negative whole-number exponents.</li>
  <li>Monomial = 1 term, binomial = 2 terms, trinomial = 3 terms.</li>
  <li>The degree of a polynomial is its highest exponent.</li>
  <li>Add/subtract polynomials by combining like terms only.</li>
  <li>Multiply polynomials by distributing every term in one by every term in the other.</li>
  <li>Factoring is the reverse process of multiplying polynomials out.</li>
  <li>A fully factored expression can't be broken down any further.</li>
  <li>The zero product property: if ab = 0, then a = 0 or b = 0.</li>
  <li>The zero product property is exactly how factoring solves quadratic equations.</li>
  <li>Not every trinomial factors nicely — that's when the quadratic formula steps in.</li>
  </ol></div>

  <div class="fact-group"><h3>Quadratics &amp; Parabolas</h3><ol class="fact-list">
  <li>A quadratic function has the form y = ax² + bx + c, with a ≠ 0.</li>
  <li>Every quadratic graphs as a parabola, a symmetric U-shaped curve.</li>
  <li>If a &gt; 0, the parabola opens upward (has a minimum); if a &lt; 0, it opens downward (has a maximum).</li>
  <li>The vertex is the highest or lowest point on a parabola.</li>
  <li>The axis of symmetry is the vertical line x = −b/(2a) that splits the parabola in half.</li>
  <li>The roots (zeros/solutions) of a quadratic are where the parabola crosses the x-axis.</li>
  <li>A quadratic can have 0, 1, or 2 real roots.</li>
  <li>Vertex form, y = a(x − h)² + k, shows the vertex directly as (h, k).</li>
  <li>Completing the square converts standard form into vertex form.</li>
  <li>Quadratics model motion under gravity, area problems, and projectile paths.</li>
  </ol></div>

  <div class="fact-group"><h3>Exponents &amp; Radicals</h3><ol class="fact-list">
  <li>An exponent tells you how many times to multiply the base by itself.</li>
  <li>Exponent rules only combine terms that share the same base.</li>
  <li>A negative exponent means "reciprocal," not "negative value."</li>
  <li>A square root asks "what number times itself gives this?"</li>
  <li>Every positive number has two square roots, one positive and one negative.</li>
  <li>A perfect square is the square of a whole number (1, 4, 9, 16, 25...).</li>
  <li>Radicals simplify by factoring out the largest perfect square.</li>
  <li>You cannot combine radicals unless the number underneath matches.</li>
  <li>Rational exponents connect roots and powers: a^(1/n) = ⁿ√a.</li>
  <li>Scientific notation writes very large or small numbers as a × 10ⁿ, with 1 ≤ a &lt; 10.</li>
  </ol></div>

  <div class="fact-group"><h3>Functions</h3><ol class="fact-list">
  <li>A function assigns exactly one output to every input.</li>
  <li>Domain = all valid inputs; range = all resulting outputs.</li>
  <li>f(x) is read "f of x," and represents the output for input x.</li>
  <li>The vertical line test checks whether a graph represents a function.</li>
  <li>A function is increasing where its graph rises left to right, decreasing where it falls.</li>
  <li>Rate of change describes how quickly a function's output changes relative to its input.</li>
  <li>Linear functions have a constant rate of change; quadratics and exponentials don't.</li>
  <li>A piecewise function uses different rules over different intervals of the domain.</li>
  <li>Even functions are symmetric about the y-axis; odd functions are symmetric about the origin.</li>
  <li>Composition of functions, f(g(x)), plugs one whole function in as another's input.</li>
  </ol></div>

  <div class="fact-group"><h3>Exponential Functions &amp; Sequences</h3><ol class="fact-list">
  <li>Exponential functions have the form y = a·bˣ, where b is the growth/decay factor.</li>
  <li>If b &gt; 1, the function grows; if 0 &lt; b &lt; 1, it decays.</li>
  <li>Growth formula: A = a(1 + r)ᵗ; decay formula: A = a(1 − r)ᵗ, where r is the rate as a decimal.</li>
  <li>Exponential functions change by a constant percent, not a constant amount.</li>
  <li>A sequence is an ordered list of numbers following a pattern.</li>
  <li>An arithmetic sequence has a constant common difference between terms.</li>
  <li>A geometric sequence has a constant common ratio between terms.</li>
  <li>Arithmetic sequences correspond to linear growth; geometric sequences correspond to exponential growth.</li>
  <li>The recursive formula for arithmetic sequences: aₙ = aₙ₋₁ + d.</li>
  <li>The recursive formula for geometric sequences: aₙ = aₙ₋₁ · r.</li>
  </ol></div>

  <div class="fact-group"><h3>Statistics &amp; Data</h3><ol class="fact-list">
  <li>Mean is the average; median is the middle value; mode is the most frequent value.</li>
  <li>A scatter plot displays the relationship between two numeric variables.</li>
  <li>Positive correlation: as one variable increases, so does the other.</li>
  <li>Negative correlation: as one variable increases, the other decreases.</li>
  <li>A line of best fit approximates the trend in scattered data with a single line.</li>
  <li>Correlation does not prove causation — a relationship doesn't mean one causes the other.</li>
  <li>An outlier is a data point far removed from the overall pattern.</li>
  <li>Residuals measure the vertical distance between a data point and the line of best fit.</li>
  <li>Two-way frequency tables organize categorical data by two variables at once.</li>
  <li>Interpolation predicts within the data range; extrapolation predicts beyond it (and is riskier).</li>
  </ol></div>

  <div class="fact-group"><h3>Word Problems &amp; Modeling</h3><ol class="fact-list">
  <li>Translate "is" as equals, "of" as multiply, and "more/less than" carefully — order matters.</li>
  <li>Define your variable in words before writing any equation.</li>
  <li>Consecutive integers are n, n+1, n+2...; consecutive even/odd integers skip by 2.</li>
  <li>"At least" means ≥; "at most" means ≤; "more than" means &gt;; "fewer than" means &lt;.</li>
  <li>Rate problems often use distance = rate × time.</li>
  <li>Mixture problems combine two amounts with different values into one total.</li>
  <li>Break-even problems occur where cost and revenue functions intersect.</li>
  <li>Choose linear, quadratic, or exponential models based on how the situation actually changes (steady, curved, or by percent).</li>
  <li>Always define a reasonable domain for a real-world function (e.g., time or quantity can't be negative).</li>
  <li>Re-read the question after solving to make sure your final answer matches what was actually asked, in the right units.</li>
  </ol></div>
</template>

<template id="tpl-practice4">
  <h2 class="title">Mixed Practice — Set 4</h2>
  <p class="sub">13 more questions mixing every unit in the binder — the closest thing to a full review in one page.</p>

    <details><summary>Show Full Solution</summary><div class="ans">
    Axis of symmetry: x = −b/(2a) = −40/(2·−2) = 10.<br>

    Selling 10 hundred (1,000) units maximizes profit at $50 (in whatever profit units the model uses).
    </div></details>
  </div>

  <div class="qcard">

/* ---------- TI-84+ style calculator: state ---------- */
let angleMode = 'deg';   // 'deg' or 'rad'
let ansValue = 0;
let xStore = 0;

function setAngleMode(mode){
  angleMode = mode;
  const d = document.getElementById('degBtn'), r = document.getElementById('radBtn');
  if(d) d.classList.toggle('active', mode === 'deg');
  if(r) r.classList.toggle('active', mode === 'rad');
}

/* ---------- expression tokenizer ---------- */
function tiTokenize(str){
  const s = str.toLowerCase().replace(/\s+/g, '');
  const tokens = [];
  let i = 0;
  while(i < s.length){
    const c = s[i];
    if(/[0-9.]/.test(c)){
      let j = i;
      while(j < s.length && /[0-9.]/.test(s[j])) j++;
      const numStr = s.slice(i, j);
      if((numStr.match(/\./g) || []).length > 1) throw new Error('bad number');
      tokens.push({t:'num', v:parseFloat(numStr)});
      i = j;
    } else if(/[a-z]/.test(c)){
      let j = i;
      while(j < s.length && /[a-z]/.test(s[j])) j++;
      tokens.push({t:'ident', v:s.slice(i, j)});
      i = j;
    } else if('+-*/^(),!'.includes(c)){
      tokens.push({t:c});
      i++;
    } else {
      throw new Error('invalid character: ' + c);
    }
  }
  return tokens;
}

const TI_FUNCS = {sin:1,cos:1,tan:1,asin:1,acos:1,atan:1,log:1,ln:1,sqrt:1,abs:1,ncr:2,npr:2,mod:2,nthroot:2};

/* ---------- recursive-descent parser ---------- */
function tiParse(tokens){
  let pos = 0;
  function peek(){ return tokens[pos]; }
  function next(){ return tokens[pos++]; }
  function expect(t){ const tok = next(); if(!tok || tok.t !== t) throw new Error('expected ' + t); return tok; }

  function canStartFactor(tok){
    return tok && (tok.t === 'num' || tok.t === 'ident' || tok.t === '(');
  }

  function parseExpr(){
    let node = parseTerm();
    while(peek() && (peek().t === '+' || peek().t === '-')){
      const op = next().t;
      node = {op, a:node, b:parseTerm()};
    }
    return node;
  }
  function parseTerm(){
    let node = parseUnary();
    while(true){
      if(peek() && (peek().t === '*' || peek().t === '/')){
        const op = next().t;
        node = {op, a:node, b:parseUnary()};
      } else if(canStartFactor(peek())){
        // implicit multiplication, e.g. 2pi, 3(x+1), 2sin(30)
        node = {op:'*', a:node, b:parseUnary()};
      } else break;
    }
    return node;
  }
  function parseUnary(){
    if(peek() && peek().t === '-'){ next(); return {op:'neg', a:parseUnary()}; }
    return parsePow();
  }
  function parsePow(){
    const base = parsePostfix();
    if(peek() && peek().t === '^'){
      next();
      const exp = parseUnary();
      return {op:'^', a:base, b:exp};
    }
    return base;
  }
  function parsePostfix(){
    let node = parsePrimary();
    while(peek() && peek().t === '!'){
      next();
      node = {op:'!', a:node};
    }
    return node;
  }
  function parsePrimary(){
    const tok = peek();
    if(!tok) throw new Error('unexpected end of expression');
    if(tok.t === 'num'){ next(); return {op:'num', v:tok.v}; }
    if(tok.t === '('){
      next();
      const node = parseExpr();
      expect(')');
      return node;
    }
    if(tok.t === 'ident'){
      next();
      const name = tok.v;
      if(name === 'pi') return {op:'const', v:Math.PI};
      if(name === 'e') return {op:'const', v:Math.E};
      if(name === 'ans') return {op:'ans'};
      if(name === 'x') return {op:'var'};
      if(TI_FUNCS.hasOwnProperty(name)){
        expect('(');
        const args = [parseExpr()];
        while(peek() && peek().t === ','){ next(); args.push(parseExpr()); }
        expect(')');
        return {op:'func', name, args};
      }
      throw new Error('unknown identifier: ' + name);
    }
    throw new Error('unexpected token');
  }

  const result = parseExpr();
  if(pos !== tokens.length) throw new Error('unexpected trailing input');
  return result;
}

/* ---------- evaluator ---------- */
function tiFactorial(n){
  if(n < 0 || Math.abs(n - Math.round(n)) > 1e-9) throw new Error('factorial needs a non-negative integer');
  n = Math.round(n);
  if(n > 170) throw new Error('too large');
  let r = 1;
  for(let k = 2; k <= n; k++) r *= k;
  return r;
}
function toRad(v){ return angleMode === 'deg' ? v * Math.PI / 180 : v; }
function fromRad(v){ return angleMode === 'deg' ? v * 180 / Math.PI : v; }

function tiEvalNode(node, xVal){
  switch(node.op){
    case 'num': return node.v;
    case 'const': return node.v;
    case 'ans': return ansValue;
    case 'var': return (xVal !== undefined) ? xVal : xStore;
    case 'neg': return -tiEvalNode(node.a, xVal);
    case '!': return tiFactorial(tiEvalNode(node.a, xVal));
    case '+': return tiEvalNode(node.a, xVal) + tiEvalNode(node.b, xVal);
    case '-': return tiEvalNode(node.a, xVal) - tiEvalNode(node.b, xVal);
    case '*': return tiEvalNode(node.a, xVal) * tiEvalNode(node.b, xVal);
    case '/': return tiEvalNode(node.a, xVal) / tiEvalNode(node.b, xVal);
    case '^': return Math.pow(tiEvalNode(node.a, xVal), tiEvalNode(node.b, xVal));
    case 'func': {
      const a = node.args.map(arg => tiEvalNode(arg, xVal));
      switch(node.name){
        case 'sin': return Math.sin(toRad(a[0]));
        case 'cos': return Math.cos(toRad(a[0]));
        case 'tan': return Math.tan(toRad(a[0]));
        case 'asin': return fromRad(Math.asin(a[0]));
        case 'acos': return fromRad(Math.acos(a[0]));
        case 'atan': return fromRad(Math.atan(a[0]));
        case 'log': return Math.log10(a[0]);
        case 'ln': return Math.log(a[0]);
        case 'sqrt': return Math.sqrt(a[0]);
        case 'abs': return Math.abs(a[0]);
        case 'ncr': return Math.round(tiFactorial(a[0]) / (tiFactorial(a[1]) * tiFactorial(a[0]-a[1])));
        case 'npr': return Math.round(tiFactorial(a[0]) / tiFactorial(a[0]-a[1]));
        case 'mod': return a[0] - a[1] * Math.floor(a[0]/a[1]);
        case 'nthroot': return Math.pow(a[0], 1/a[1]);
        default: throw new Error('unknown function');
      }
    }
    default: throw new Error('bad node');
  }
}
function tiEvalExpr(str, xVal){
  const tokens = tiTokenize(str);
  const ast = tiParse(tokens);
  const val = tiEvalNode(ast, xVal);
  if(typeof val !== 'number' || !isFinite(val)) throw new Error('invalid result');
  return val;
}

/* ---------- basic calculator UI ---------- */
function calcInput(v){

function calcSquare(){

}
function calcPercent(){

function calcReciprocal(){

}
function calcFactorial(){
  const el = document.getElementById('calcExpr');

}
function calcStoX(){
  const el = document.getElementById('calcExpr');
  const disp = document.getElementById('xStoreDisplay');
  const hist = document.getElementById('calcHist');
  if(!el) return;
  try{
    const val = tiEvalExpr(el.textContent);

}
function calcFormat(n){
  if(Math.abs(n) < 1e-10) n = 0;
  return (Math.round(n * 1e8) / 1e8).toString();
}
function calcEvaluate(){
  const el = document.getElementById('calcExpr');
  const hist = document.getElementById('calcHist');
  if(!el) return;
  const raw = el.textContent;
  try{
    const val = tiEvalExpr(raw);
    ansValue = val;
    if(hist) hist.textContent = raw + ' =';
    el.textContent = calcFormat(val);
  }catch(err){
    el.textContent = 'Error';
  }
}

/* ---------- TI mode tabs (CALC / GRAPH / TABLE / STAT / ALGEBRA) ---------- */
function tiShow(mode){
  document.querySelectorAll('.ti-tab').forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
  document.querySelectorAll('.ti-mode').forEach(m => m.classList.toggle('active', m.dataset.mode === mode));
}

/* ---------- Y= / GRAPH ---------- */
function drawGraph(){
  const canvas = document.getElementById('graphCanvas');
  const info = document.getElementById('graphInfo');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const xmin = parseFloat(document.getElementById('winXmin').value);
  const xmax = parseFloat(document.getElementById('winXmax').value);
  const ymin = parseFloat(document.getElementById('winYmin').value);
  const ymax = parseFloat(document.getElementById('winYmax').value);
  const y1expr = document.getElementById('graphY1').value.trim();
  const y2expr = document.getElementById('graphY2').value.trim();

  ctx.clearRect(0, 0, W, H);
  const toPx = (x) => (x - xmin) / (xmax - xmin) * W;
  const toPy = (y) => H - (y - ymin) / (ymax - ymin) * H;

  // grid + axes
  ctx.strokeStyle = '#202022';
  ctx.lineWidth = 1;
  for(let gx = Math.ceil(xmin); gx <= xmax; gx++){
    ctx.beginPath(); ctx.moveTo(toPx(gx), 0); ctx.lineTo(toPx(gx), H); ctx.stroke();
  }
  for(let gy = Math.ceil(ymin); gy <= ymax; gy++){
    ctx.beginPath(); ctx.moveTo(0, toPy(gy)); ctx.lineTo(W, toPy(gy)); ctx.stroke();
  }
  ctx.strokeStyle = '#6a6a6c';
  ctx.lineWidth = 1.5;
  if(xmin <= 0 && xmax >= 0){ ctx.beginPath(); ctx.moveTo(toPx(0), 0); ctx.lineTo(toPx(0), H); ctx.stroke(); }
  if(ymin <= 0 && ymax >= 0){ ctx.beginPath(); ctx.moveTo(0, toPy(0)); ctx.lineTo(W, toPy(0)); ctx.stroke(); }

  function plot(expr, color){
    if(!expr) return {zeros:[], sampleMin:Infinity, sampleMax:-Infinity};
    ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.beginPath();
    let started = false, prevY = null, prevPx = null;
    const zeros = [];
    let sampleMin = Infinity, sampleMax = -Infinity, sampleMinX = 0, sampleMaxX = 0;
    const steps = W;
    for(let px = 0; px <= steps; px++){
      const x = xmin + (px/steps) * (xmax - xmin);
      let y;
      try{ y = tiEvalExpr(expr, x); }catch(e){ y = null; }
      if(y !== null && isFinite(y)){
        if(y < sampleMin){ sampleMin = y; sampleMinX = x; }
        if(y > sampleMax){ sampleMax = y; sampleMaxX = x; }
        if(prevY !== null && (prevY < 0) !== (y < 0) && Math.abs(y - prevY) < (ymax-ymin)){
          zeros.push(x);
        }
        const py = toPy(y);
        const bigJump = prevY !== null && Math.abs(y - prevY) > (ymax - ymin) * 1.5;
        if(!started || bigJump){ ctx.moveTo(toPx(x), py); started = true; }
        else { ctx.lineTo(toPx(x), py); }
        prevY = y;
      } else {
        prevY = null; started = false;
      }
    }
    ctx.stroke();
    return {zeros, sampleMin, sampleMax, sampleMinX, sampleMaxX};
  }

  const r1 = plot(y1expr, '#f0f0f0');
  const r2 = plot(y2expr, '#9a9a9c');

  let msg = 'Y\u2081 approx. zero(s) near x \u2248 ' + (r1.zeros.length ? r1.zeros.map(z=>calcFormat(z)).join(', ') : 'none found in window');
  msg += '\nY\u2081 min sampled \u2248 ' + calcFormat(r1.sampleMin) + ' at x\u2248' + calcFormat(r1.sampleMinX) +
         '   max sampled \u2248 ' + calcFormat(r1.sampleMax) + ' at x\u2248' + calcFormat(r1.sampleMaxX);
  if(y2expr){
    msg += '\nY\u2082 approx. zero(s) near x \u2248 ' + (r2.zeros.length ? r2.zeros.map(z=>calcFormat(z)).join(', ') : 'none found in window');
  }
  if(info) info.textContent = msg;
}

/* ---------- TABLE ---------- */
function buildTable(){
  const expr = document.getElementById('tableY1').value.trim();
  const start = parseFloat(document.getElementById('tblStart').value);
  const step = parseFloat(document.getElementById('tblStep').value) || 1;
  const out = document.getElementById('tableOut');
  if(!out) return;
  let html = '<tr><th>X</th><th>Y\u2081</th></tr>';
  for(let i = 0; i < 15; i++){
    const x = start + i * step;
    let yText;
    try{ yText = calcFormat(tiEvalExpr(expr, x)); }catch(e){ yText = 'ERR'; }
    html += '<tr><td>' + calcFormat(x) + '</td><td>' + yText + '</td></tr>';
  }
  out.innerHTML = html;
}

/* ---------- STAT ---------- */
function parseList(str){
  return str.split(',').map(s => parseFloat(s.trim())).filter(n => !isNaN(n));
}
function compute1VarStats(){
  const box = document.getElementById('stat1Result');
  const data = parseList(document.getElementById('stat1List').value);
  if(data.length === 0){ box.textContent = 'Enter at least one number.'; return; }
  const n = data.length;
  const sum = data.reduce((a,b) => a+b, 0);
  const mean = sum / n;
  const sorted = [...data].sort((a,b) => a-b);
  const median = n % 2 ? sorted[(n-1)/2] : (sorted[n/2-1] + sorted[n/2]) / 2;
  const variance = data.reduce((a,b) => a + Math.pow(b-mean,2), 0) / (n - 1 > 0 ? n - 1 : 1);
  const sampleSD = Math.sqrt(variance);
  const popSD = Math.sqrt(data.reduce((a,b) => a + Math.pow(b-mean,2), 0) / n);
  box.textContent =
    'n = ' + n +
    '\n\u03a3x = ' + calcFormat(sum) +
    '\nx\u0304 (mean) = ' + calcFormat(mean) +
    '\nmedian = ' + calcFormat(median) +
    '\nSx (sample stdev) = ' + calcFormat(sampleSD) +
    '\n\u03c3x (population stdev) = ' + calcFormat(popSD) +
    '\nminX = ' + calcFormat(sorted[0]) + '   maxX = ' + calcFormat(sorted[n-1]);
}
function computeRegression(){
  const box = document.getElementById('statRegResult');
  const xs = parseList(document.getElementById('statX').value);
  const ys = parseList(document.getElementById('statY').value);
  if(xs.length < 2 || xs.length !== ys.length){ box.textContent = 'Enter matching X and Y lists with at least 2 points.'; return; }
  const n = xs.length;
  const sumX = xs.reduce((a,b)=>a+b,0), sumY = ys.reduce((a,b)=>a+b,0);
  const meanX = sumX/n, meanY = sumY/n;
  let sxy=0, sxx=0, syy=0;
  for(let i=0;i<n;i++){ sxy += (xs[i]-meanX)*(ys[i]-meanY); sxx += Math.pow(xs[i]-meanX,2); syy += Math.pow(ys[i]-meanY,2); }
  const m = sxy/sxx;
  const b = meanY - m*meanX;
  const r = sxy / Math.sqrt(sxx*syy);
  box.textContent =
    'Linear Regression: y = ax + b' +
    '\na (slope) = ' + calcFormat(m) +
    '\nb (intercept) = ' + calcFormat(b) +
    '\nr (correlation) = ' + calcFormat(r) +
    '\nr\u00b2 = ' + calcFormat(r*r) +
    '\nEquation: y = ' + calcFormat(m) + 'x ' + (b>=0?'+ '+calcFormat(b):'- '+calcFormat(Math.abs(b)));

  const canvas = document.getElementById('regCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);
  const xMin = Math.min(...xs), xMax = Math.max(...xs);
  const yMin = Math.min(...ys), yMax = Math.max(...ys);
  const padX = (xMax-xMin || 1) * 0.15, padY = (yMax-yMin || 1) * 0.15;
  const gxmin = xMin-padX, gxmax = xMax+padX, gymin = yMin-padY, gymax = yMax+padY;
  const toPx = x => (x-gxmin)/(gxmax-gxmin)*W;
  const toPy = y => H - (y-gymin)/(gymax-gymin)*H;
  ctx.strokeStyle = '#6a6a6c'; ctx.lineWidth = 1.5;
  ctx.strokeRect(0.5,0.5,W-1,H-1);
  ctx.fillStyle = '#f0f0f0';
  for(let i=0;i<n;i++){ ctx.beginPath(); ctx.arc(toPx(xs[i]), toPy(ys[i]), 4, 0, Math.PI*2); ctx.fill(); }
  ctx.strokeStyle = '#9a9a9c'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(toPx(gxmin), toPy(m*gxmin+b)); ctx.lineTo(toPx(gxmax), toPy(m*gxmax+b)); ctx.stroke();
}

/* ---------- algebra tool solvers ---------- */
function showTool(name){
  document.querySelectorAll('.tool-tab').forEach(t => t.classList.toggle('active', t.dataset.tool === name));
  document.querySelectorAll('.tool-body').forEach(b => b.classList.toggle('active', b.dataset.tool === name));
}
function toolNum(id){
  const v = parseFloat(document.getElementById(id).value);
  return isNaN(v) ? 0 : v;
}
function toolFmt(n){
  if(Math.abs(n) < 1e-9) n = 0;
  return (Math.round(n * 1e6) / 1e6).toString();
}
function computeSlope(){
  const x1=toolNum('slopeX1'), y1=toolNum('slopeY1'), x2=toolNum('slopeX2'), y2=toolNum('slopeY2');
  const box = document.getElementById('slopeResult');
  if(x2 - x1 === 0){
    box.textContent = 'Slope is undefined (vertical line): x = ' + toolFmt(x1);
    return;
  }
  const m = (y2 - y1) / (x2 - x1);
  const b = y1 - m * x1;
  const line = (m === 0)
    ? 'y = ' + toolFmt(y1) + ' (horizontal line)'
    : 'y = ' + toolFmt(m) + 'x ' + (b >= 0 ? '+ ' + toolFmt(b) : '- ' + toolFmt(Math.abs(b)));
  box.textContent = 'Slope: m = (' + toolFmt(y2) + ' - ' + toolFmt(y1) + ') / (' + toolFmt(x2) + ' - ' + toolFmt(x1) + ') = ' + toolFmt(m) +
    '\nEquation: ' + line;
}
function computeDistMid(){
  const x1=toolNum('dmX1'), y1=toolNum('dmY1'), x2=toolNum('dmX2'), y2=toolNum('dmY2');
  const d = Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
  document.getElementById('dmResult').textContent =
    'Distance: d = \u221a[(' + toolFmt(x2) + '-' + toolFmt(x1) + ')\u00b2 + (' + toolFmt(y2) + '-' + toolFmt(y1) + ')\u00b2] = ' + toolFmt(d) +
    '\nMidpoint: M = (' + toolFmt(mx) + ', ' + toolFmt(my) + ')';
}
function computeLinear(){
  const a=toolNum('linA'), b=toolNum('linB'), c=toolNum('linC');
  const box = document.getElementById('linResult');
  if(a === 0){
    box.textContent = (b === c)
      ? 'a = 0: every value of x works (infinite solutions), since ' + toolFmt(b) + ' = ' + toolFmt(c) + ' is always true.'
      : 'a = 0: no solution, since ' + toolFmt(b) + ' \u2260 ' + toolFmt(c) + '.';
    return;
  }
  const x = (c - b) / a;
  box.textContent = toolFmt(a) + 'x + ' + toolFmt(b) + ' = ' + toolFmt(c) +
    '\n' + toolFmt(a) + 'x = ' + toolFmt(c - b) +
    '\nx = ' + toolFmt(x);
}
function computeQuad(){
  const a=toolNum('quadA'), b=toolNum('quadB'), c=toolNum('quadC');
  const box = document.getElementById('quadResult');
  if(a === 0){
    box.textContent = 'a cannot be 0 for a quadratic — try the Linear Equation solver instead.';
    return;
  }
  const disc = b*b - 4*a*c;
  const axis = -b / (2*a);
  const vy = a*axis*axis + b*axis + c;
  let rootsText;
  if(disc > 0){
    const r1 = (-b + Math.sqrt(disc)) / (2*a);
    const r2 = (-b - Math.sqrt(disc)) / (2*a);
    rootsText = '2 real roots: x = ' + toolFmt(r1) + ' or x = ' + toolFmt(r2);
  } else if(disc === 0){
    rootsText = '1 real root (double root): x = ' + toolFmt(-b/(2*a));
  } else {
    const re = -b/(2*a);
    const im = Math.sqrt(-disc)/(2*a);
    rootsText = 'No real roots: x = ' + toolFmt(re) + ' \u00b1 ' + toolFmt(im) + 'i';
  }
  box.textContent = 'Discriminant: b\u00b2 − 4ac = ' + toolFmt(disc) +
    '\n' + rootsText +
    '\nAxis of symmetry: x = ' + toolFmt(axis) +
    '\nVertex: (' + toolFmt(axis) + ', ' + toolFmt(vy) + ')';
}
function computeSystem(){
  const a1=toolNum('sysA1'), b1=toolNum('sysB1'), c1=toolNum('sysC1');
  const a2=toolNum('sysA2'), b2=toolNum('sysB2'), c2=toolNum('sysC2');
  const box = document.getElementById('sysResult');
  const det = a1*b2 - a2*b1;
  if(det === 0){
    box.textContent = 'Determinant = 0: the lines are parallel — either no solution (distinct parallel lines) or infinitely many solutions (the same line), depending on the constants.';
    return;
  }
  const x = (c1*b2 - c2*b1) / det;
  const y = (a1*c2 - a2*c1) / det;
  box.textContent = 'Using elimination (Cramer\'s rule):' +
    '\nx = (c\u2081b\u2082 − c\u2082b\u2081) / (a\u2081b\u2082 − a\u2082b\u2081) = ' + toolFmt(x) +
    '\ny = (a\u2081c\u2082 − a\u2082c\u2081) / (a\u2081b\u2082 − a\u2082b\u2081) = ' + toolFmt(y) +
    '\nSolution: (' + toolFmt(x) + ', ' + toolFmt(y) + ')';
}

/* ---------- "made by sskies" decode animation in sidebar footer ---------- */
const target = "MADE BY SSKIES";
const scrambleChars = "!<>-_\\/[]{}=+*^?#";
const decodeEl = document.getElementById('sidebarDecode');
let frame = 0;
const revealSpeed = 3;

function renderDecodeFrame(){
  let out = "";
  const lockedCount = Math.floor(frame / revealSpeed);
  for(let i=0;i<target.length;i++){
    if(target[i] === " "){ out += " "; continue; }
    out += (i < lockedCount) ? target[i] : scrambleChars[Math.floor(Math.random()*scrambleChars.length)];
  }
  decodeEl.innerHTML = out + '<span class="cursor"></span>';
  frame++;
  if(lockedCount <= target.length){
    setTimeout(renderDecodeFrame, 30);
  } else {
    decodeEl.innerHTML = target + '<span class="cursor"></span>';
  }
}
renderDecodeFrame();

/* ---------- ASCII starfield background ---------- */
const canvas = document.getElementById('ascii-bg');
const ctx = canvas.getContext('2d');
let W, H, cells = [];
const CHARSET = ['.', ':', '+', '*', 'x', '\u00b7', '\u00b0'];

function resize(){
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  const cell = 26;
  const cols = Math.ceil(W / cell);
  const rows = Math.ceil(H / cell);
  cells = [];
  for(let i=0;i<cols*rows;i++){
    if(Math.random() < 0.05){
      cells.push({
        x: (i % cols) * cell + cell/2,
        y: Math.floor(i / cols) * cell + cell/2,
        ch: CHARSET[Math.floor(Math.random()*CHARSET.length)],
        base: Math.random()*0.4 + 0.06,
        speed: Math.random()*0.6 + 0.15,
        phase: Math.random()*Math.PI*2,
        size: Math.random()*6 + 8
      });
    }
  }
}
window.addEventListener('resize', resize);
resize();

function draw(t){
  ctx.clearRect(0,0,W,H);
  ctx.textAlign = 'center';
  for(const c of cells){
    const tw = c.base + Math.sin(t*0.001*c.speed + c.phase) * 0.3;
    const alpha = Math.max(0, Math.min(1, tw));
    ctx.font = c.size + 'px "JetBrains Mono", monospace';
    ctx.fillStyle = 'rgba(200,200,200,' + alpha.toFixed(2) + ')';
    ctx.fillText(c.ch, c.x, c.y);
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
