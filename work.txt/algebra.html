<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Tab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --black:#0a0a0a;
  --panel:#131314;
  --panel-2:#1a1a1b;
  --panel-3:#1f1f21;
  --line:#2c2c2e;
  --line-soft:#202022;
  --white:#f0f0f0;
  --gray-1:#cfcfcf;
  --gray-2:#9a9a9c;
  --gray-3:#6a6a6c;
  --gray-4:#454547;
  --glow:rgba(240,240,240,.4);
  --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 10px 26px -14px rgba(0,0,0,.8);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--black);
  color:var(--gray-1);
  font-family:'VT323', monospace;
  font-size:19px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.disp,.nav-label,.pin,.eyebrow,button{font-family:'Press Start 2P', monospace;}
code,.mono,.formula{font-family:'JetBrains Mono',monospace;}

/* ===== ASCII backdrop ===== */
#ascii-bg{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:0;
  pointer-events:none;
  background:radial-gradient(ellipse at 20% 15%, #1c1c1d 0%, #0a0a0a 55%);
}

/* layout shell */
.shell{
  position:relative;
  z-index:2;
  display:flex;
  min-height:100vh;
}

/* ===== SIDEBAR ===== */
.sidebar{
  --w-collapsed:66px;
  --w-expanded:290px;
  width:var(--w-expanded);
  flex:none;
  background:rgba(19,19,20,.86);
  backdrop-filter:blur(10px);
  color:var(--gray-1);
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
  overflow-x:hidden;
  border-right:1px solid var(--line-soft);
  transition:width .28s cubic-bezier(.4,0,.2,1);
}
.sidebar.collapsed{width:var(--w-collapsed);}
.sidebar::-webkit-scrollbar{width:6px;}
.sidebar::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px;}

.sidebar-head{
  padding:20px 16px 14px;
  border-bottom:1px solid var(--line-soft);
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:8px;
}
.sidebar-head .brand{display:flex; align-items:center; gap:10px; min-width:0;}
.sidebar-head .brand-mark{
  width:32px;height:32px;flex:none;
  background:linear-gradient(155deg,#e8e8e8,#3a3a3a 70%);
  border-radius:4px;
  display:flex; align-items:center; justify-content:center;
  font-family:'Press Start 2P',monospace;
  font-size:12px;
  color:#0a0a0a;
}
.sidebar-head .tag{
  display:block;
  font-family:'Press Start 2P',monospace;
  font-size:8px;
  letter-spacing:.06em;
  color:var(--gray-3);
  margin-bottom:8px;
  white-space:nowrap;
  overflow:hidden;
}
.sidebar-head h1{
  font-size:12px;
  margin:0 0 6px;
  line-height:1.5;
  color:var(--white);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.sidebar-head p{
  margin:0;
  font-size:15px;
  color:var(--gray-3);
  font-family:'VT323',monospace;
  white-space:nowrap;
  overflow:hidden;
}
.sidebar-head .brand-text{min-width:0; overflow:hidden;}
.sidebar.collapsed .brand-text{display:none;}

.collapse-btn{
  flex:none;
  width:26px; height:26px;
  border-radius:4px;
  border:1px solid var(--line);
  background:var(--panel-2);
  color:var(--gray-2);
  cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:transform .28s ease, background .15s ease, color .15s ease;
}
.collapse-btn:hover{background:var(--panel-3); color:var(--white);}
.collapse-btn svg{width:13px;height:13px;}
.sidebar.collapsed .collapse-btn svg{transform:rotate(180deg);}

.nav-group{padding:10px 0 6px;}
.nav-label{
  font-family:'Press Start 2P',monospace;
  font-size:8.5px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--gray-4);
  padding:14px 16px 8px;
  white-space:nowrap;
  overflow:hidden;
}
.sidebar.collapsed .nav-label{opacity:0; height:0; padding-top:0; padding-bottom:0; overflow:hidden;}
.nav-btn{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  text-align:left;
  background:none;
  border:none;
  color:var(--gray-2);
  font-family:'VT323',monospace;
  font-size:17px;
  padding:9px 16px 9px 14px;
  cursor:pointer;
  border-left:3px solid transparent;
  transition:background .12s, color .12s, border-color .12s;
  white-space:nowrap;
  overflow:hidden;
}
.nav-btn .num{
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  color:var(--gray-4);
  width:20px;
  flex:none;
}
.nav-btn:hover{background:var(--panel-2); color:var(--white);}
.nav-btn.active{
  background:var(--panel-3);
  border-left-color:var(--white);
  color:var(--white);
}
.sidebar-foot{
  padding:14px 16px 20px;
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  color:var(--gray-4);
  border-top:1px solid var(--line-soft);
  margin-top:10px;
  white-space:nowrap;
  overflow:hidden;
}
.sidebar-foot .decode{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--gray-2);
  letter-spacing:.02em;
}
.sidebar-foot .decode .cursor{
  display:inline-block; width:6px; height:11px;
  background:var(--gray-2); margin-left:2px; vertical-align:-1px;
  animation:blink 1s steps(1) infinite;
}
@keyframes blink{50%{opacity:0;}}

/* ===== MAIN ===== */
.main{
  flex:1;
  min-width:0;
  position:relative;
  background:var(--black);
}
.topbar{
  position:sticky;
  top:0;
  z-index:5;
  background:rgba(10,10,10,.86);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line-soft);
  padding:16px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.topbar .crumbs{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--gray-3);
  letter-spacing:.06em;
  text-transform:uppercase;
}
.topbar .pagebadge{
  font-family:'Press Start 2P',monospace;
  font-size:9px;
  color:var(--black);
  background:var(--gray-1);
  padding:5px 9px;
  border-radius:3px;
}
.content{
  max-width:880px;
  margin:0 auto;
  padding:40px 40px 110px;
  position:relative;
  z-index:2;
}
.page{display:none;}
.page.active{display:block; animation:fade .25s ease;}
@keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

.page h2.title{
  font-family:'Press Start 2P',monospace;
  font-size:22px;
  line-height:1.6;
  margin:0 0 14px;
  color:var(--white);
  text-shadow:0 0 20px var(--glow);
}
.page .sub{
  color:var(--gray-2);
  font-size:18px;
  margin:0 0 30px;
  max-width:640px;
  font-family:'VT323',monospace;
}
.tear{
  border:none;
  border-top:1px dashed var(--line);
  margin:30px 0;
}

/* formula cards */
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-left:4px solid var(--gray-1);
  border-radius:4px;
  padding:20px 22px;
  margin:0 0 22px;
  box-shadow:var(--shadow);
}
.card h3{
  margin:0 0 12px;
  font-size:13px;
  line-height:1.6;
  color:var(--white);
  display:flex;
  align-items:center;
  gap:10px;
}
.card h3 .pin{
  font-family:'Press Start 2P',monospace;
  font-size:8px;
  background:var(--gray-1);
  color:var(--black);
  padding:4px 7px;
  border-radius:3px;
  letter-spacing:.02em;
}
.formula{
  display:block;
  font-size:18px;
  font-weight:600;
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:4px;
  padding:12px 16px;
  margin:6px 0 14px;
  color:var(--white);
  overflow-x:auto;
}
.card .row{margin:10px 0; font-size:17.5px;}
.card .row b{
  font-family:'Press Start 2P',monospace;
  font-size:9.5px;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:var(--gray-3);
  display:block;
  margin-bottom:5px;
}
.card .remember{
  background:var(--panel-2);
  border:1px dashed var(--gray-3);
  border-radius:4px;
  padding:9px 12px;
  font-size:17px;
}
.card .example{
  font-family:'JetBrains Mono',monospace;
  font-size:13.5px;
  background:var(--panel-3);
  border:1px solid var(--line);
  border-radius:4px;
  padding:9px 12px;
  color:var(--gray-1);
}

/* mistakes */
.mistake{
  display:flex;
  gap:16px;
  background:var(--panel);
  border:1px solid var(--line);
  border-left:4px solid var(--gray-2);
  border-radius:4px;
  padding:16px 18px;
  margin-bottom:14px;
}
.mistake .no{
  font-family:'Press Start 2P',monospace;
  color:var(--white);
  font-size:12px;
  flex:none;
}
.mistake .wrong{color:var(--gray-3); font-family:'JetBrains Mono',monospace; font-size:13.5px;}
.mistake .right{color:var(--white); font-family:'JetBrains Mono',monospace; font-size:13.5px;}

/* top 100 */
.fact-group{margin-bottom:28px;}
.fact-group h3{
  color:var(--white);
  border-bottom:1px solid var(--line);
  padding-bottom:8px;
  font-size:12px;
}
.fact-list{list-style:none; margin:14px 0 0; padding:0; counter-reset:fact;}
.fact-list li{
  counter-increment:fact;
  padding:8px 0 8px 42px;
  position:relative;
  border-bottom:1px solid var(--line-soft);
  font-size:17.5px;
}
.fact-list li::before{
  content:counter(fact);
  position:absolute;
  left:0; top:7px;
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  color:var(--black);
  background:var(--gray-2);
  width:24px; height:24px;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
}

/* cram sheet grid */
.cram-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
.cram-cell{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:4px;
  padding:12px 14px;
}
.cram-cell h4{
  margin:0 0 8px;
  font-size:10px;
  color:var(--white);
  font-family:'Press Start 2P',monospace;
  text-transform:uppercase;
  letter-spacing:.02em;
}
.cram-cell .f{
  font-family:'JetBrains Mono',monospace;
  font-size:13px;
  display:block;
  margin:4px 0;
  color:var(--gray-1);
}
@media(max-width:640px){.cram-grid{grid-template-columns:1fr;}}

/* checklist (night before) */
.checklist{list-style:none; margin:0; padding:0;}
.checklist li{
  display:flex; gap:12px; align-items:flex-start;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:4px;
  padding:12px 14px;
  margin-bottom:10px;
  font-size:17.5px;
}
.checklist .box{
  flex:none; width:18px; height:18px;
  border:2px solid var(--gray-2);
  border-radius:3px;
  margin-top:3px;
}
.timebox{
  font-family:'Press Start 2P',monospace;
  font-size:8px;
  color:var(--black);
  background:var(--gray-1);
  padding:4px 8px;
  border-radius:3px;
  margin-right:10px;
  white-space:nowrap;
}

/* practice tests */
.qcard{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:4px;
  padding:16px 18px;
  margin-bottom:14px;
}
.qcard .qhead{
  display:flex; gap:10px; align-items:baseline;
  font-family:'VT323',monospace;
  font-weight:600;
  font-size:19px;
  margin-bottom:8px;
}
.qcard .qnum{
  font-family:'Press Start 2P',monospace;
  color:var(--black);
  background:var(--gray-1);
  border-radius:3px;
  padding:3px 8px;
  font-size:9px;
}
.qcard details{
  margin-top:10px;
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:4px;
  padding:8px 12px;
}
.qcard summary{
  cursor:pointer;
  font-family:'Press Start 2P',monospace;
  font-size:9px;
  color:var(--white);
}
.qcard .ans{
  font-family:'JetBrains Mono',monospace;
  font-size:13.5px;
  margin-top:8px;
  color:var(--gray-1);
}

.callout{
  background:var(--panel);
  border-left:3px solid var(--gray-1);
  border-radius:4px;
  padding:12px 16px;
  margin:16px 0;
  font-size:17px;
}
.callout.warn{border-left-color:var(--gray-2);}
.callout.tip{border-left-color:var(--gray-3);}

table.regtable{width:100%; border-collapse:collapse; margin:14px 0; font-size:16.5px;}
table.regtable th, table.regtable td{border:1px solid var(--line); padding:8px 10px; text-align:left;}
table.regtable th{background:var(--panel-3); color:var(--white); font-family:'Press Start 2P',monospace; font-size:9px; letter-spacing:.02em;}
table.regtable tr:nth-child(even) td{background:var(--panel-2);}

@media(max-width:860px){
  .shell{flex-direction:column;}
  .sidebar{width:100%; height:auto; position:relative;}
  .content{padding:24px 18px 80px;}
  .topbar{padding:12px 18px;}
}

/* ===== additions: vocab / steps / quiz / graph / trick ===== */
.vocab-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px;}
.vocab-item{background:var(--panel-2); border:1px solid var(--line); border-radius:4px; padding:8px 12px; font-size:16px;}
.vocab-item b{color:var(--white); font-family:'JetBrains Mono',monospace; font-size:13.5px; display:block; margin-bottom:2px;}
@media(max-width:640px){.vocab-grid{grid-template-columns:1fr;}}
.steps-list{margin:8px 0 0; padding-left:22px;}
.steps-list li{margin-bottom:6px; font-size:17.5px;}
.diff-tag{
  display:inline-block; font-family:'Press Start 2P',monospace; font-size:8px;
  padding:4px 8px; border-radius:3px; margin-right:8px; color:var(--black);
}
.diff-easy{background:var(--gray-1);}
.diff-med{background:var(--gray-2);}
.diff-hard{background:var(--gray-3); color:var(--white);}
.graph-card{background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:16px; margin-bottom:18px; text-align:center;}
.graph-card svg{max-width:100%; height:auto;}
.graph-caption{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--gray-2); margin-top:8px;}
.quiz-block{background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:14px 18px; margin-bottom:10px;}
.quiz-block .qn{font-family:'Press Start 2P',monospace; font-size:9px; color:var(--white); margin-right:8px;}
.section-label{
  font-family:'Press Start 2P',monospace; font-size:11px; color:var(--white);
  margin:26px 0 12px; padding-bottom:8px; border-bottom:1px solid var(--line);
}
.trick-card{background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--gray-2); border-radius:4px; padding:14px 18px; margin-bottom:12px;}
.trick-card .t-title{font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--white); font-size:14.5px; margin-bottom:4px;}

</style>
</head>
<canvas id="ascii-bg"></canvas>

<template id="tpl-slope">
  <h2 class="title">Slope Formulas</h2>
  <p class="sub">Slope measures how steep a line is and which way it's tilted. Almost every linear topic on the Regents comes back to slope.</p>

  <div class="card">
    <h3><span class="pin">FORMULA</span> The Slope Formula</h3>
    <span class="formula">m = (y&#8322; − y&#8321;) / (x&#8322; − x&#8321;)</span>
    <div class="row"><b>What it means</b> Slope is "rise over run" — how much y changes for every one unit that x changes. A slope of 2 means y climbs 2 for every 1 step right.</div>
    <div class="row"><b>When to use it</b> You're given any two points on a line (or two data points in a table/graph) and need the steepness or rate of change between them.</div>
    <div class="remember"><b>Remember it:</b> "Rise over Run." Write the y's on top, the x's on bottom, and keep point 1 and point 2 in the same order top and bottom.</div>
    <div class="example">Example: (2,3) and (6,11) → m = (11−3)/(6−2) = 8/4 = 2</div>
  </div>

  <div class="card">
    <h3><span class="pin">FORMULA</span> Slope-Intercept Form</h3>
    <span class="formula">y = mx + b</span>
    <div class="row"><b>What it means</b> m is the slope; b is the y-intercept, the point where the line crosses the y-axis (where x = 0).</div>
    <div class="row"><b>When to use it</b> Graphing a line fast, or writing an equation when you already know the slope and where it starts on the y-axis.</div>
    <div class="remember"><b>Remember it:</b> "b is where you Begin" (on the y-axis); m is how much you Move each step right.</div>
    <div class="example">Example: slope 3, y-intercept −2 → y = 3x − 2</div>
  </div>

  <div class="card">
    <h3><span class="pin">FORMULA</span> Point-Slope Form</h3>
    <span class="formula">y − y&#8321; = m(x − x&#8321;)</span>
    <div class="row"><b>What it means</b> Builds a line's equation directly from one known point and the slope — no y-intercept needed.</div>
    <div class="row"><b>When to use it</b> You have a slope and a single point (not necessarily the y-intercept).</div>
    <div class="remember"><b>Remember it:</b> "Minus what you know." Whatever point you're given gets subtracted straight into the formula.</div>
    <div class="example">Example: slope 3 through (2,1) → y − 1 = 3(x − 2)</div>
  </div>

  <div class="card">
    <h3><span class="pin">FORMULA</span> Standard Form</h3>
    <span class="formula">Ax + By = C</span>
    <div class="row"><b>What it means</b> A general way to write a line, useful for solving systems by elimination and for reading intercepts quickly.</div>
    <div class="row"><b>When to use it</b> Solving systems of equations, or finding both intercepts fast (set x = 0 for the y-intercept, set y = 0 for the x-intercept).</div>
    <div class="remember"><b>Remember it:</b> A, B, C — alphabetical order — and A is usually kept positive with no fractions.</div>
  </div>

  <div class="card">
    <h3><span class="pin">RULE</span> Parallel &amp; Perpendicular Slopes</h3>
    <span class="formula">Parallel: m&#8321; = m&#8322;    Perpendicular: m&#8321; · m&#8322; = −1</span>
    <div class="row"><b>What it means</b> Parallel lines tilt exactly the same amount and never cross. Perpendicular lines meet at a right angle, and their slopes are negative reciprocals of each other.</div>
    <div class="row"><b>When to use it</b> Any question that describes two lines' relationship, or asks you to write an equation parallel/perpendicular to a given line.</div>
    <div class="remember"><b>Remember it:</b> "Parallel = pals, same slope forever." For perpendicular: flip the fraction, then flip the sign.</div>
    <div class="example">Example: a line has slope 2/3 → a perpendicular line has slope −3/2</div>
  </div>
</template>

<template id="tpl-distance">
  <h2 class="title">Distance Formula</h2>
  <p class="sub">Finds the straight-line length between any two points on the coordinate plane.</p>
  <div class="card">
    <h3><span class="pin">FORMULA</span> Distance Between Two Points</h3>
    <span class="formula">d = √[(x&#8322; − x&#8321;)&sup2; + (y&#8322; − y&#8321;)&sup2;]</span>
    <div class="row"><b>What it means</b> It's the Pythagorean theorem in disguise. The horizontal gap (x&#8322;−x&#8321;) and vertical gap (y&#8322;−y&#8321;) are the two legs of a right triangle, and the distance between the points is the hypotenuse.</div>
    <div class="row"><b>When to use it</b> Finding the length of a segment on a graph, the perimeter of a shape given its coordinates, or checking whether a figure has equal sides (e.g., proving a triangle is isosceles).</div>
    <div class="remember"><b>Remember it:</b> Picture a right triangle stretched between the two points — it's just a² + b² = c² with a and b as the coordinate differences.</div>
    <div class="example">Example: (1,2) and (4,6) → d = √[(4−1)² + (6−2)²] = √(9+16) = √25 = 5</div>
  </div>
  <div class="callout">On the Regents, distance-formula questions are often disguised as "find the perimeter" or "is this a right triangle" problems — the formula is the same either way.</div>
</template>

<template id="tpl-midpoint">
  <h2 class="title">Midpoint Formula</h2>
  <p class="sub">Finds the exact center point between two coordinates.</p>
  <div class="card">
    <h3><span class="pin">FORMULA</span> Midpoint of a Segment</h3>
    <span class="formula">M = ( (x&#8321;+x&#8322;)/2 , (y&#8321;+y&#8322;)/2 )</span>
    <div class="row"><b>What it means</b> The midpoint is just the average of the two x-coordinates and the average of the two y-coordinates.</div>
    <div class="row"><b>When to use it</b> Finding the center of a segment, or the center of a circle when you're given the endpoints of a diameter.</div>
    <div class="remember"><b>Remember it:</b> "Average the x's, average the y's." No subtraction anywhere — that's how you know it's not the distance formula.</div>
    <div class="example">Example: (2,3) and (8,7) → M = ((2+8)/2, (3+7)/2) = (5, 5)</div>
  </div>
</template>

<template id="tpl-quadratic">
  <h2 class="title">Quadratic Formula</h2>
  <p class="sub">Solves any quadratic equation for x — even the ones that won't factor nicely.</p>
  <div class="card">
    <h3><span class="pin">FORMULA</span> For ax² + bx + c = 0</h3>
    <span class="formula">x = ( −b ± √(b&sup2; − 4ac) ) / (2a)</span>
    <div class="row"><b>What it means</b> It gives both solutions (roots) of a quadratic equation at once — the ± means "add for one answer, subtract for the other."</div>
    <div class="row"><b>When to use it</b> Whenever a quadratic won't factor easily, or a problem specifically asks for exact/irrational solutions.</div>
    <div class="remember"><b>Remember it:</b> Sing it to "Pop Goes the Weasel" — <i>"x equals negative b, plus or minus the square root, of b squared minus four-a-c, all over two-a."</i></div>
    <div class="example">Example: x² + 5x + 6 = 0 → x = (−5 ± √(25−24))/2 = (−5 ± 1)/2 → x = −2 or x = −3</div>
  </div>
  <div class="card">
    <h3><span class="pin">RULE</span> The Discriminant</h3>
    <span class="formula">b&sup2; − 4ac</span>
    <div class="row"><b>What it means</b> The part under the square root tells you what kind of solutions to expect, before you even finish solving.</div>
    <table class="regtable">
      <tr><th>Discriminant</th><th>What it tells you</th></tr>
      <tr><td>Positive</td><td>2 real solutions</td></tr>
      <tr><td>Zero</td><td>1 real solution (a double root — the vertex touches the x-axis)</td></tr>
      <tr><td>Negative</td><td>No real solutions (2 imaginary solutions)</td></tr>
    </table>
    <div class="remember"><b>Remember it:</b> Positive → parabola crosses the x-axis twice. Zero → it just touches. Negative → it never touches.</div>
  </div>
</template>

<template id="tpl-exponents">
  <h2 class="title">Exponent Rules</h2>
  <p class="sub">Rules for combining powers — every one of these only works when the bases match (except the power rules).</p>

  <div class="card"><h3><span class="pin">RULE</span> Product Rule</h3><span class="formula">a<sup>m</sup> · a<sup>n</sup> = a<sup>m+n</sup></span>
  <div class="row"><b>What it means</b> Multiplying same-base powers keeps the base and adds the exponents.</div>
  <div class="row"><b>When to use it</b> Multiplying two terms that share a base, like variables in a monomial.</div>
  <div class="remember"><b>Remember it:</b> "Multiply → Add."</div>
  <div class="example">x³ · x⁴ = x⁷</div></div>

  <div class="card"><h3><span class="pin">RULE</span> Quotient Rule</h3><span class="formula">a<sup>m</sup> / a<sup>n</sup> = a<sup>m−n</sup></span>
  <div class="row"><b>What it means</b> Dividing same-base powers keeps the base and subtracts the exponents.</div>
  <div class="remember"><b>Remember it:</b> "Divide → Subtract."</div>
  <div class="example">x⁷ / x³ = x⁴</div></div>

  <div class="card"><h3><span class="pin">RULE</span> Power Rule</h3><span class="formula">(a<sup>m</sup>)<sup>n</sup> = a<sup>mn</sup></span>
  <div class="row"><b>What it means</b> Raising a power to another power multiplies the exponents.</div>
  <div class="remember"><b>Remember it:</b> "Power of a power → Multiply."</div>
  <div class="example">(x³)⁴ = x¹²</div></div>

  <div class="card"><h3><span class="pin">RULE</span> Zero &amp; Negative Exponents</h3><span class="formula">a&#8304; = 1     a<sup>−n</sup> = 1/a<sup>n</sup></span>
  <div class="row"><b>What it means</b> Anything (except 0) to the zero power is 1. A negative exponent means "flip me to the other side of the fraction" — it does not make the value negative.</div>
  <div class="remember"><b>Remember it:</b> "Negative exponents flip, they don't flip the sign."</div>
  <div class="example">2⁻³ = 1/2³ = 1/8</div></div>

  <div class="card"><h3><span class="pin">RULE</span> Power of a Product / Quotient</h3><span class="formula">(ab)<sup>n</sup> = a<sup>n</sup>b<sup>n</sup>     (a/b)<sup>n</sup> = a<sup>n</sup>/b<sup>n</sup></span>
  <div class="row"><b>What it means</b> The outside exponent distributes to every factor inside the parentheses.</div>
  <div class="example">(2x)³ = 8x³</div></div>

  <div class="card"><h3><span class="pin">RULE</span> Fractional Exponents</h3><span class="formula">a<sup>m/n</sup> = (ⁿ√a)<sup>m</sup></span>
  <div class="row"><b>What it means</b> The denominator of the exponent is the root, the numerator is the power.</div>
  <div class="remember"><b>Remember it:</b> "Bottom is the root (like a root cellar), top is the power."</div>
  <div class="example">8^(2/3) = (³√8)² = 2² = 4</div></div>
</template>

<template id="tpl-factoring">
  <h2 class="title">Factoring Patterns</h2>
  <p class="sub">Factoring reverses multiplication — every pattern below turns an expanded expression back into a product.</p>

  <div class="card"><h3><span class="pin">STEP 1</span> Greatest Common Factor (GCF)</h3>
  <span class="formula">ab + ac = a(b + c)</span>
  <div class="row"><b>What it means</b> Pull out the largest factor common to every term before trying anything else.</div>
  <div class="row"><b>When to use it</b> Always check first — every factoring problem starts here.</div>
  <div class="remember"><b>Remember it:</b> "GCF first, always."</div>
  <div class="example">6x² + 9x = 3x(2x + 3)</div></div>

  <div class="card"><h3><span class="pin">PATTERN</span> Difference of Squares</h3>
  <span class="formula">a&sup2; − b&sup2; = (a − b)(a + b)</span>
  <div class="row"><b>What it means</b> Two perfect squares being subtracted always split into a sum and a difference of their roots.</div>
  <div class="row"><b>When to use it</b> A binomial (2 terms) with a minus sign, both terms perfect squares.</div>
  <div class="remember"><b>Remember it:</b> "No middle term? Twins with opposite signs."</div>
  <div class="example">x² − 25 = (x − 5)(x + 5)</div></div>

  <div class="card"><h3><span class="pin">PATTERN</span> Perfect Square Trinomial</h3>
  <span class="formula">a&sup2; + 2ab + b&sup2; = (a + b)&sup2;      a&sup2; − 2ab + b&sup2; = (a − b)&sup2;</span>
  <div class="row"><b>What it means</b> Comes from squaring a binomial — the first and last terms are perfect squares, and the middle term is double their product.</div>
  <div class="example">x² + 6x + 9 = (x + 3)²</div></div>

  <div class="card"><h3><span class="pin">METHOD</span> Trinomial Factoring</h3>
  <span class="formula">x&sup2; + bx + c = (x + p)(x + q), where pq = c and p + q = b</span>
  <div class="row"><b>What it means</b> Find two numbers that multiply to the constant and add to the middle coefficient.</div>
  <div class="row"><b>When to use it</b> Any trinomial with a leading coefficient of 1.</div>
  <div class="remember"><b>Remember it:</b> "Multiply to the last, add to the middle."</div>
  <div class="example">x² + 7x + 12 → 3 & 4 multiply to 12, add to 7 → (x+3)(x+4)</div></div>

  <div class="card"><h3><span class="pin">METHOD</span> AC Method &amp; Grouping</h3>
  <span class="formula">ax&sup2; + bx + c → split bx using two numbers that multiply to ac and add to b, then group</span>
  <div class="row"><b>When to use it</b> Trinomials where the leading coefficient is not 1.</div>
  <div class="example">2x² + 7x + 3 → numbers 6 & 1 (multiply to 6, add to 7) → 2x²+6x+x+3 → 2x(x+3)+1(x+3) → (2x+1)(x+3)</div></div>
</template>

<template id="tpl-foil">
  <h2 class="title">FOIL</h2>
  <p class="sub">The order for multiplying two binomials together, term by term.</p>
  <div class="card">
    <h3><span class="pin">METHOD</span> First · Outer · Inner · Last</h3>
    <span class="formula">(a + b)(c + d) = ac + ad + bc + bd</span>
    <div class="row"><b>What it means</b> FOIL is just an order of operations for distributing twice — multiply the First terms, then the Outer terms, then the Inner terms, then the Last terms, and add everything together.</div>
    <div class="row"><b>When to use it</b> Multiplying any two binomials (two two-term expressions).</div>
    <div class="remember"><b>Remember it:</b> F-O-I-L — First, Outer, Inner, Last. Draw the "smile and eyebrows" arcs connecting the terms if it helps.</div>
    <div class="example">(x + 3)(x + 5) = x² + 5x + 3x + 15 = x² + 8x + 15</div>
  </div>
  <div class="callout warn"><b>Watch out:</b> FOIL only works for binomial × binomial. For anything bigger (like a trinomial times a binomial), distribute every term instead.</div>
</template>

<template id="tpl-radicals">
  <h2 class="title">Radical Rules</h2>
  <p class="sub">Rules for simplifying and combining square roots.</p>

  <div class="card"><h3><span class="pin">RULE</span> Product &amp; Quotient Rules</h3>
  <span class="formula">√(ab) = √a · √b       √(a/b) = √a / √b</span>
  <div class="row"><b>What it means</b> A root of a product (or quotient) can be split into the root of each piece — which is how you pull perfect squares out.</div>
  <div class="remember"><b>Remember it:</b> Look for the biggest perfect-square factor hiding inside the number.</div>
  <div class="example">√50 = √(25·2) = √25·√2 = 5√2</div></div>

  <div class="card"><h3><span class="pin">RULE</span> Adding &amp; Subtracting Radicals</h3>
  <span class="formula">a√n ± b√n = (a ± b)√n</span>
  <div class="row"><b>What it means</b> Only "like radicals" (the same number under the root) can combine — treat √n like a variable.</div>
  <div class="remember"><b>Remember it:</b> "Same root, same rules as like terms."</div>
  <div class="example">3√2 + 5√2 = 8√2, but 3√2 + 5√3 cannot combine</div></div>

  <div class="card"><h3><span class="pin">RULE</span> Rationalizing the Denominator</h3>
  <span class="formula">a/√b → (a·√b)/b</span>
  <div class="row"><b>What it means</b> A radical isn't allowed to stay in the denominator, so multiply the top and bottom by that radical to clear it out.</div>
  <div class="remember"><b>Remember it:</b> "No radicals allowed in the basement (denominator)."</div>
  <div class="example">5/√3 = (5√3)/3</div></div>
</template>

<template id="tpl-functions">
  <h2 class="title">Function Formulas</h2>
  <p class="sub">The core toolkit for reading, writing, and transforming functions.</p>

  <div class="card"><h3><span class="pin">NOTATION</span> Function Notation</h3>
  <span class="formula">f(x) = "the output of function f when the input is x"</span>
  <div class="row"><b>When to use it</b> Anytime you need to evaluate a function at a specific input — just substitute that value in for x.</div>
  <div class="remember"><b>Remember it:</b> f(3) does NOT mean f times 3 — it means "plug 3 in."</div>
  <div class="example">f(x) = 2x² − x + 1 → f(3) = 2(9) − 3 + 1 = 16</div></div>

  <div class="card"><h3><span class="pin">RULE</span> Vertical Line Test</h3>
  <div class="row"><b>What it means</b> If any vertical line crosses a graph more than once, the graph is not a function — one input can't have two outputs.</div>
  <div class="remember"><b>Remember it:</b> "One x, one y — or it's not a function."</div></div>

  <div class="card"><h3><span class="pin">FORMULA</span> Average Rate of Change</h3>
  <span class="formula">( f(b) − f(a) ) / (b − a)</span>
  <div class="row"><b>What it means</b> The slope between two points on any curve — how fast the function's output is changing on average over that interval.</div>
  <div class="row"><b>When to use it</b> Comparing how quickly two functions grow, or finding "average speed" style word problems.</div>
  <div class="example">f(x)=x², from x=1 to x=4 → (16−1)/(4−1) = 5</div></div>

  <div class="card"><h3><span class="pin">RULE</span> Transformations</h3>
  <table class="regtable">
    <tr><th>Change</th><th>Effect</th></tr>
    <tr><td>f(x) + k</td><td>shifts graph up (k&gt;0) or down (k&lt;0)</td></tr>
    <tr><td>f(x + k)</td><td>shifts graph left (k&gt;0) or right (k&lt;0) — opposite of what it looks like</td></tr>
    <tr><td>a·f(x)</td><td>stretches (|a|&gt;1) or compresses (|a|&lt;1) vertically</td></tr>
    <tr><td>−f(x)</td><td>reflects over the x-axis</td></tr>
  </table>
  <div class="remember"><b>Remember it:</b> "Outside the parentheses acts normal; inside the parentheses acts backwards."</div></div>

  <div class="card"><h3><span class="pin">FORMULA</span> Sequences</h3>
  <span class="formula">Arithmetic: a<sub>n</sub> = a&#8321; + (n−1)d      Geometric: a<sub>n</sub> = a&#8321; · r<sup>(n−1)</sup></span>
  <div class="row"><b>What it means</b> Arithmetic sequences add the same amount (d) each step; geometric sequences multiply by the same ratio (r) each step.</div>
  <div class="remember"><b>Remember it:</b> "Linear ADDS, exponential MULTIPLIES" — arithmetic behaves like a line, geometric behaves like exponential growth.</div></div>
</template>

<template id="tpl-regents">
  <h2 class="title">Algebra I Regents — Exam Review</h2>
  <p class="sub">What to expect on test day, based on the official NYSED exam structure.</p>

  <div class="card">
    <h3>Exam Format</h3>
    <table class="regtable">
      <tr><th>Part</th><th>Question Type</th><th>Count</th><th>Points Each</th><th>Total</th></tr>
      <tr><td>I</td><td>Multiple choice</td><td>24</td><td>2</td><td>48</td></tr>
      <tr><td>II</td><td>Short constructed response</td><td>8</td><td>2</td><td>16</td></tr>
      <tr><td>III</td><td>Constructed response</td><td>4</td><td>4</td><td>16</td></tr>
      <tr><td>IV</td><td>Extended constructed response</td><td>1</td><td>6</td><td>6</td></tr>
    </table>
    <div class="row"><b>Time</b> 3 hours. <b>Calculator</b> A graphing calculator is required for the entire exam (no CAS models like the TI-89 or TI-Nspire CAS). <b>Reference sheet</b> A formula reference sheet — including the quadratic formula, sequence formulas, and exponential growth/decay — is printed in the exam booklet, so you don't need to memorize those from scratch, just know when to use them.</div>
  </div>

  <div class="card">
    <h3>What's Tested</h3>
    <div class="row">The exam blueprint weights topics roughly as: <b>Algebra</b> (equations, inequalities, factoring, systems) is the largest share, <b>Functions</b> (notation, graphs, transformations, sequences) is the second largest, and <b>Number &amp; Quantity</b> plus <b>Statistics &amp; Probability</b> make up smaller remaining portions.</div>
  </div>

  <div class="callout warn"><b>Scoring changes each administration.</b> Your raw score (out of the total points above) converts to a 0–100 scaled score using a conversion chart that NYSED releases separately for every exam date — it is not the same chart from year to year. Passing (Level 3) generally falls in the mid-60s and up, but check the official conversion chart for your specific test date rather than relying on a past one.</div>

  <div class="card">
    <h3>Test-Day Strategy</h3>
    <div class="row"><b>Part I (multiple choice):</b> No penalty for guessing and no partial credit — answer every question, even a guess. Eliminate obviously wrong choices first.</div>
    <div class="row"><b>Parts II–IV (constructed response):</b> Partial credit is real — show every step, label your final answer, and never leave a box blank. A wrong final answer with correct method still earns points.</div>
    <div class="row"><b>Pacing:</b> With 3 hours for 37 questions, that's roughly 4–5 minutes per question on average — but Part I questions usually go faster, leaving extra time for the longer constructed-response problems.</div>
  </div>
</template>

<template id="tpl-mistakes">
  <h2 class="title">Common Mistakes</h2>
  <p class="sub">The errors that cost the most points, semester after semester — with the fix right next to each one.</p>

  <div class="mistake"><div class="no">01</div><div><b>Forgetting to flip the inequality sign.</b><br><span class="wrong">Wrong: −2x &lt; 6 → x &lt; −3</span><br><span class="right">Right: −2x &lt; 6 → x &gt; −3 (flip when multiplying/dividing by a negative)</span></div></div>

  <div class="mistake"><div class="no">02</div><div><b>Distributing a negative sign incorrectly.</b><br><span class="wrong">Wrong: −(x − 3) = −x − 3</span><br><span class="right">Right: −(x − 3) = −x + 3 (the negative flips every term inside)</span></div></div>

  <div class="mistake"><div class="no">03</div><div><b>Square-rooting both sides and losing a solution.</b><br><span class="wrong">Wrong: x² = 16 → x = 4</span><br><span class="right">Right: x² = 16 → x = ±4</span></div></div>

  <div class="mistake"><div class="no">04</div><div><b>Mixing up slope and y-intercept.</b><br><span class="wrong">Wrong: reading y = 3x − 2 as slope −2, intercept 3</span><br><span class="right">Right: in y = mx + b, m (3) is slope, b (−2) is the y-intercept</span></div></div>

  <div class="mistake"><div class="no">05</div><div><b>Skipping a FOIL term.</b><br><span class="wrong">Wrong: (x+3)(x+5) = x² + 15</span><br><span class="right">Right: (x+3)(x+5) = x² + 5x + 3x + 15 = x² + 8x + 15</span></div></div>

  <div class="mistake"><div class="no">06</div><div><b>Factoring without checking for a GCF first.</b><br><span class="wrong">Wrong: 4x² + 8x → jumping straight to trinomial rules</span><br><span class="right">Right: pull out the GCF first → 4x(x + 2)</span></div></div>

  <div class="mistake"><div class="no">07</div><div><b>Adding exponents with different bases.</b><br><span class="wrong">Wrong: x³ · y² = (xy)⁵</span><br><span class="right">Right: exponent rules only combine when the base is the same — x³·y² stays as is</span></div></div>

  <div class="mistake"><div class="no">08</div><div><b>The "freshman's dream" error — squaring a binomial as two separate squares.</b><br><span class="wrong">Wrong: (x + y)² = x² + y²</span><br><span class="right">Right: (x + y)² = x² + 2xy + y² (don't forget the middle term)</span></div></div>

  <div class="mistake"><div class="no">09</div><div><b>Sign errors in the quadratic formula.</b><br><span class="wrong">Wrong: forgetting −b becomes positive when b is negative</span><br><span class="right">Right: carefully substitute the sign of b before simplifying, and always apply ± to the whole square root</span></div></div>

  <div class="mistake"><div class="no">10</div><div><b>Answering a different question than what was asked.</b><br><span class="wrong">Wrong: solving for x when the question asks for f(x), or leaving units off a word problem</span><br><span class="right">Right: re-read the question after solving and confirm you answered exactly what it asked</span></div></div>

  <div class="mistake"><div class="no">11</div><div><b>Rounding too early.</b><br><span class="wrong">Wrong: rounding a decimal mid-problem, then carrying the rounded value through several more steps</span><br><span class="right">Right: keep exact values (or full decimals) until the final answer, then round once</span></div></div>

  <div class="mistake"><div class="no">12</div><div><b>Confusing domain and range.</b><br><span class="wrong">Wrong: calling the set of y-values the domain</span><br><span class="right">Right: domain = all possible x-values (inputs); range = all possible y-values (outputs)</span></div></div>

  <div class="mistake"><div class="no">13</div><div><b>Not checking for extraneous solutions.</b><br><span class="wrong">Wrong: accepting every solution that comes out of a radical or rational equation</span><br><span class="right">Right: plug every solution back into the original equation — some make the equation false or undefined and must be thrown out</span></div></div>

  <div class="mistake"><div class="no">14</div><div><b>Leaving a constructed-response question blank.</b><br><span class="wrong">Wrong: skipping a problem because the final answer isn't obvious</span><br><span class="right">Right: show whatever steps you're sure of — Parts II–IV award partial credit for correct method, even with the wrong final answer</span></div></div>

  <div class="mistake"><div class="no">15</div><div><b>Combining unlike terms or unlike radicals.</b><br><span class="wrong">Wrong: 3x + 2x² = 5x³, or 2√3 + 5√2 = 7√5</span><br><span class="right">Right: only combine matching variable/exponent terms or matching radicals — 3x and 2x² stay separate; 2√3 and 5√2 stay separate</span></div></div>
</template>

<template id="tpl-top100">
  <h2 class="title">Top 100 Algebra Facts</h2>
  <p class="sub">A rapid-fire reference covering the whole course — ten groups of ten, organized by topic.</p>

  <div class="fact-group"><h3>Numbers &amp; Expressions</h3><ol class="fact-list">
  <li>A variable is a letter that represents an unknown or changing number.</li>
  <li>A coefficient is the number multiplied in front of a variable.</li>
  <li>A term is a single number, variable, or product/quotient of numbers and variables.</li>
  <li>Like terms have the exact same variable(s) raised to the exact same power(s).</li>
  <li>Order of operations: Parentheses, Exponents, Multiplication/Division, Addition/Subtraction (PEMDAS), left to right within each level.</li>
  <li>The distributive property: a(b + c) = ab + ac.</li>
  <li>The additive identity is 0 (adding it changes nothing); the multiplicative identity is 1.</li>
  <li>Opposites (additive inverses) sum to 0; reciprocals (multiplicative inverses) multiply to 1.</li>
  <li>Absolute value measures distance from zero and is always non-negative.</li>
  <li>A constant is a term with no variable — it never changes.</li>
  </ol></div>

  <div class="fact-group"><h3>Solving Equations</h3><ol class="fact-list">
  <li>Whatever you do to one side of an equation, you must do to the other.</li>
  <li>To isolate a variable, undo operations in reverse order of PEMDAS.</li>
  <li>An equation with no solution simplifies to a false statement (like 3 = 5).</li>
  <li>An equation with infinite solutions simplifies to a true statement (like 4 = 4).</li>
  <li>To solve a literal equation, isolate the requested variable just like any other equation.</li>
  <li>Multiplying or dividing an inequality by a negative flips the inequality sign.</li>
  <li>Compound inequalities ("and") describe an overlap; ("or") describe two separate regions.</li>
  <li>Absolute value equations |x| = a split into two cases: x = a and x = −a.</li>
  <li>Always check your solution by substituting it back into the original equation.</li>
  <li>A proportion is two equal ratios; solve by cross-multiplying.</li>
  </ol></div>

  <div class="fact-group"><h3>Linear Relationships</h3><ol class="fact-list">
  <li>A linear equation graphs as a straight line and has a constant rate of change.</li>
  <li>Slope tells direction: positive slopes rise left to right, negative slopes fall.</li>
  <li>A horizontal line has a slope of 0; a vertical line has an undefined slope.</li>
  <li>The x-intercept is where a line crosses the x-axis (y = 0).</li>
  <li>The y-intercept is where a line crosses the y-axis (x = 0).</li>
  <li>Two points always determine exactly one line.</li>
  <li>A system of equations is a set of equations solved together, at the same time.</li>
  <li>Systems can be solved by graphing, substitution, or elimination.</li>
  <li>A system's solution is the point (or points) where all the equations are true together.</li>
  <li>Parallel lines that never intersect form a system with no solution.</li>
  </ol></div>

  <div class="fact-group"><h3>Polynomials &amp; Factoring</h3><ol class="fact-list">
  <li>A polynomial is a sum of terms with non-negative whole-number exponents.</li>
  <li>Monomial = 1 term, binomial = 2 terms, trinomial = 3 terms.</li>
  <li>The degree of a polynomial is its highest exponent.</li>
  <li>Add/subtract polynomials by combining like terms only.</li>
  <li>Multiply polynomials by distributing every term in one by every term in the other.</li>
  <li>Factoring is the reverse process of multiplying polynomials out.</li>
  <li>A fully factored expression can't be broken down any further.</li>
  <li>The zero product property: if ab = 0, then a = 0 or b = 0.</li>
  <li>The zero product property is exactly how factoring solves quadratic equations.</li>
  <li>Not every trinomial factors nicely — that's when the quadratic formula steps in.</li>
  </ol></div>

  <div class="fact-group"><h3>Quadratics &amp; Parabolas</h3><ol class="fact-list">
  <li>A quadratic function has the form y = ax² + bx + c, with a ≠ 0.</li>
  <li>Every quadratic graphs as a parabola, a symmetric U-shaped curve.</li>
  <li>If a &gt; 0, the parabola opens upward (has a minimum); if a &lt; 0, it opens downward (has a maximum).</li>
  <li>The vertex is the highest or lowest point on a parabola.</li>
  <li>The axis of symmetry is the vertical line x = −b/(2a) that splits the parabola in half.</li>
  <li>The roots (zeros/solutions) of a quadratic are where the parabola crosses the x-axis.</li>
  <li>A quadratic can have 0, 1, or 2 real roots.</li>
  <li>Vertex form, y = a(x − h)² + k, shows the vertex directly as (h, k).</li>
  <li>Completing the square converts standard form into vertex form.</li>
  <li>Quadratics model motion under gravity, area problems, and projectile paths.</li>
  </ol></div>

  <div class="fact-group"><h3>Exponents &amp; Radicals</h3><ol class="fact-list">
  <li>An exponent tells you how many times to multiply the base by itself.</li>
  <li>Exponent rules only combine terms that share the same base.</li>
  <li>A negative exponent means "reciprocal," not "negative value."</li>
  <li>A square root asks "what number times itself gives this?"</li>
  <li>Every positive number has two square roots, one positive and one negative.</li>
  <li>A perfect square is the square of a whole number (1, 4, 9, 16, 25...).</li>
  <li>Radicals simplify by factoring out the largest perfect square.</li>
  <li>You cannot combine radicals unless the number underneath matches.</li>
  <li>Rational exponents connect roots and powers: a^(1/n) = ⁿ√a.</li>
  <li>Scientific notation writes very large or small numbers as a × 10ⁿ, with 1 ≤ a &lt; 10.</li>
  </ol></div>

  <div class="fact-group"><h3>Functions</h3><ol class="fact-list">
  <li>A function assigns exactly one output to every input.</li>
  <li>Domain = all valid inputs; range = all resulting outputs.</li>
  <li>f(x) is read "f of x," and represents the output for input x.</li>
  <li>The vertical line test checks whether a graph represents a function.</li>
  <li>A function is increasing where its graph rises left to right, decreasing where it falls.</li>
  <li>Rate of change describes how quickly a function's output changes relative to its input.</li>
  <li>Linear functions have a constant rate of change; quadratics and exponentials don't.</li>
  <li>A piecewise function uses different rules over different intervals of the domain.</li>
  <li>Even functions are symmetric about the y-axis; odd functions are symmetric about the origin.</li>
  <li>Composition of functions, f(g(x)), plugs one whole function in as another's input.</li>
  </ol></div>

  <div class="fact-group"><h3>Exponential Functions &amp; Sequences</h3><ol class="fact-list">
  <li>Exponential functions have the form y = a·bˣ, where b is the growth/decay factor.</li>
  <li>If b &gt; 1, the function grows; if 0 &lt; b &lt; 1, it decays.</li>
  <li>Growth formula: A = a(1 + r)ᵗ; decay formula: A = a(1 − r)ᵗ, where r is the rate as a decimal.</li>
  <li>Exponential functions change by a constant percent, not a constant amount.</li>
  <li>A sequence is an ordered list of numbers following a pattern.</li>
  <li>An arithmetic sequence has a constant common difference between terms.</li>
  <li>A geometric sequence has a constant common ratio between terms.</li>
  <li>Arithmetic sequences correspond to linear growth; geometric sequences correspond to exponential growth.</li>
  <li>The recursive formula for arithmetic sequences: aₙ = aₙ₋₁ + d.</li>
  <li>The recursive formula for geometric sequences: aₙ = aₙ₋₁ · r.</li>
  </ol></div>

  <div class="fact-group"><h3>Statistics &amp; Data</h3><ol class="fact-list">
  <li>Mean is the average; median is the middle value; mode is the most frequent value.</li>
  <li>A scatter plot displays the relationship between two numeric variables.</li>
  <li>Positive correlation: as one variable increases, so does the other.</li>
  <li>Negative correlation: as one variable increases, the other decreases.</li>
  <li>A line of best fit approximates the trend in scattered data with a single line.</li>
  <li>Correlation does not prove causation — a relationship doesn't mean one causes the other.</li>
  <li>An outlier is a data point far removed from the overall pattern.</li>
  <li>Residuals measure the vertical distance between a data point and the line of best fit.</li>
  <li>Two-way frequency tables organize categorical data by two variables at once.</li>
  <li>Interpolation predicts within the data range; extrapolation predicts beyond it (and is riskier).</li>
  </ol></div>

  <div class="fact-group"><h3>Word Problems &amp; Modeling</h3><ol class="fact-list">
  <li>Translate "is" as equals, "of" as multiply, and "more/less than" carefully — order matters.</li>
  <li>Define your variable in words before writing any equation.</li>
  <li>Consecutive integers are n, n+1, n+2...; consecutive even/odd integers skip by 2.</li>
  <li>"At least" means ≥; "at most" means ≤; "more than" means &gt;; "fewer than" means &lt;.</li>
  <li>Rate problems often use distance = rate × time.</li>
  <li>Mixture problems combine two amounts with different values into one total.</li>
  <li>Break-even problems occur where cost and revenue functions intersect.</li>
  <li>Choose linear, quadratic, or exponential models based on how the situation actually changes (steady, curved, or by percent).</li>
  <li>Always define a reasonable domain for a real-world function (e.g., time or quantity can't be negative).</li>
  <li>Re-read the question after solving to make sure your final answer matches what was actually asked, in the right units.</li>
  </ol></div>
</template>

<template id="tpl-practice1">

<template id="tpl-practice2">
  <h2 class="title">Mixed Practice — Set 2</h2>
  <p class="sub">12 more original questions covering inequalities, radicals, sequences, and functions.</p>

  <div class="qcard"><div class="qhead"><span class="qnum">Q1</span> Solve the inequality: −2x + 5 &lt; 11</div>
  <details><summary>Show Answer</summary><div class="ans">−2x &lt; 6 → x &gt; −3 (sign flips because we divided by a negative)</div></details></div>

  <div class="qcard"><div class="qhead"><span class="qnum">Q2</span> Simplify: √50</div>
  <details><summary>Show Answer</summary><div class="ans">√(25·2) = 5√2</div></details></div>

  <div class="qcard"><div class="qhead"><span class="qnum">Q3</span> Simplify: √18 + √8</div>
  <details><summary>Show Answer</summary><div class="ans">3√2 + 2√2 = 5√2</div></details></div>

  <div class="qcard"><div class="qhead"><span class="qnum">Q4</span> Find the distance between (−1, 2) and (3, 5).</div>
  <details><summary>Show Answer</summary><div class="ans">d = √[(3−(−1))² + (5−2)²] = √(16+9) = √25 = 5</div></details></div>

  <div class="qcard"><div class="qhead"><span class="qnum">Q5</span> Find the midpoint of (−4, 6) and (2, −2).</div>
  <details><summary>Show Answer</summary><div class="ans">M = ((−4+2)/2, (6+(−2))/2) = (−1, 2)</div></details></div>

  <div class="qcard"><div class="qhead"><span class="qnum">Q6</span> Is 3, 7, 11, 15... arithmetic or geometric? Find the next term.</div>
  <details><summary>Show Answer</summary><div class="ans">Arithmetic, common difference d = 4 → next term = 19</div></details></div>

  <div class="qcard"><div class="qhead"><span class="qnum">Q7</span> Is 2, 6, 18, 54... arithmetic or geometric? Find the next term.</div>
  <details><summary>Show Answer</summary><div class="ans">Geometric, common ratio r = 3 → next term = 162</div></details></div>

  <div class="qcard"><div class="qhead"><span class="qnum">Q8</span> A table shows x: 1, 2, 3 and y: 5, 8, 11. Find the rate of change and an equation for y.</div>
  <details><summary>Show Answer</summary><div class="ans">rate of change = 3 → y = 3x + 2 (check x=1: 3(1)+2=5 ✓)</div></details></div>

  <div class="qcard"><div class="qhead"><span class="qnum">Q9</span> A population starts at 200 and grows 5% per year. Write the model and find the population after 3 years.</div>
  <details><summary>Show Answer</summary><div class="ans">A = 200(1.05)ᵗ → A(3) = 200(1.157625) ≈ 232</div></details></div>

  <div class="qcard"><div class="qhead"><span class="qnum">Q10</span> Find the average rate of change of f(x) = x² from x = 1 to x = 4.</div>
  <details><summary>Show Answer</summary><div class="ans">(f(4) − f(1))/(4 − 1) = (16 − 1)/3 = 5</div></details></div>

  <div class="qcard"><div class="qhead"><span class="qnum">Q11</span> Find the domain of f(x) = 1/(x − 3).</div>
  <details><summary>Show Answer</summary><div class="ans">All real numbers except x = 3 (division by zero is undefined there)</div></details></div>

  <div class="qcard"><div class="qhead"><span class="qnum">Q12</span> A right triangle has legs of 6 and 8. Find the hypotenuse.</div>
  <details><summary>Show Answer</summary><div class="ans">√(6² + 8²) = √(36 + 64) = √100 = 10</div></details></div>
</template>

<template id="tpl-pemdas">
  <h2 class="title">Order of Operations (PEMDAS)</h2>
  <p class="sub">The universal rulebook for which operation to do first — so everyone gets the same answer to the same expression.</p>

  <div class="card"><h3>Definition</h3>
  <div class="row"><b>Order of Operations</b> is the agreed-upon sequence for evaluating a math expression that has more than one operation, so the expression only has one correct value.</div>
  <div class="vocab-grid">
    <div class="vocab-item"><b>Expression</b> a math phrase with numbers, variables, and operations — no equals sign.</div>
    <div class="vocab-item"><b>Grouping symbol</b> parentheses ( ), brackets [ ], braces { }.</div>
    <div class="vocab-item"><b>Exponent</b> a small raised number showing repeated multiplication.</div>
    <div class="vocab-item"><b>Term</b> a piece of an expression separated by + or −.</div>
  </div></div>

  <div class="card"><h3>Key Rule</h3>
  <span class="formula">P.E.M.D.A.S. → Parentheses → Exponents → Multiply/Divide (left→right) → Add/Subtract (left→right)</span>
  <div class="remember"><b>Remember it:</b> "Please Excuse My Dear Aunt Sally." Multiplication and division are the SAME rank (whichever comes first, left to right) — same with addition and subtraction.</div></div>

  <div class="card"><h3>Step-by-Step Method</h3>
  <ol class="steps-list">
    <li>Solve everything inside grouping symbols first (innermost first).</li>
    <li>Evaluate all exponents.</li>
    <li>Multiply and divide, moving left to right.</li>
    <li>Add and subtract, moving left to right.</li>
  </ol></div>

  <div class="card"><h3>Worked Examples</h3>
  <div class="row"><span class="diff-tag diff-easy">EASY</span> 3 + 4 × 2</div>
  <div class="example">Multiply first: 4×2=8 → 3+8 = <b>11</b></div>
  <div class="row"><span class="diff-tag diff-med">MEDIUM</span> (3 + 4) × 2² − 5</div>
  <div class="example">Parentheses: 7 → Exponent: 2²=4 → 7×4=28 → 28−5 = <b>23</b></div>
  <div class="row"><span class="diff-tag diff-hard">HARD</span> 2[5 + (8 − 3)²] ÷ 5 − 1</div>
  <div class="example">Inner parens: 8−3=5 → exponent: 5²=25 → bracket: 5+25=30 → 2×30=60 → 60÷5=12 → 12−1 = <b>11</b></div>
  </div>

  <div class="card"><h3>What If We Change Something?</h3>
  <div class="row"><b>What if the exponent moved outside the parentheses?</b> (3+4×2)² changes which numbers get squared entirely — always resolve the grouping symbol before applying the exponent to it.</div>
  <div class="row"><b>What if there were no parentheses at all?</b> 3 + 4 × 2² − 5 still follows PEMDAS: exponent first (4), then multiply (4×4=16), then add/subtract → 3+16−5=14. Removing grouping symbols can completely change the answer.</div>
  <div class="row"><b>What if division came before multiplication in the expression?</b> Still just go left to right — 8 ÷ 2 × 2 = 4×2 = 8, NOT 8÷4=2. Division isn't always "done last."</div>
  </div>

  <div class="mistake"><div class="no">01</div><div><b>Assuming multiplication always beats division.</b> They're equal rank — go left to right.</div></div>
  <div class="mistake"><div class="no">02</div><div><b>Squaring the wrong part of the expression</b> because the grouping symbol wasn't resolved first.</div></div>
  <div class="mistake"><div class="no">03</div><div><b>Doing addition before multiplication</b> just because it appears first left to right in the expression.</div></div>

  <div class="callout tip"><b>Test tip:</b> Circle every grouping symbol before you write a single number — it stops you from squaring or multiplying the wrong chunk.</div>
  <div class="callout"><b>Real-world use:</b> Following PEMDAS is exactly like following a recipe in order — mixing steps out of order changes the result, whether it's a cake or a formula in a spreadsheet.</div>

  <h3 class="section-label">Practice Problems</h3>
  <div class="qcard"><div class="qhead"><span class="qnum">P1</span> 6 + 2 × (9 − 5)</div><details><summary>Show Answer</summary><div class="ans">6 + 2×4 = 6+8 = 14</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P2</span> 5² − 3 × 4</div><details><summary>Show Answer</summary><div class="ans">25 − 12 = 13</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P3</span> (12 − 2) ÷ 5 + 3²</div><details><summary>Show Answer</summary><div class="ans">10÷5 + 9 = 2+9 = 11</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P4</span> 4 + 3[10 − (2+2)]</div><details><summary>Show Answer</summary><div class="ans">4 + 3[10−4] = 4+3(6) = 4+18 = 22</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">CHALLENGE</span> 3 + [2(4 − 1)]² ÷ 6</div><details><summary>Show Answer</summary><div class="ans">2(3)=6 → 6²=36 → 36÷6=6 → 3+6 = 9</div></details></div>

  <h3 class="section-label">Things to Remember</h3>
  <ul class="steps-list"><li>Grouping symbols first, always — innermost to outermost.</li><li>Multiplication/division and addition/subtraction are each a tied pair — break ties left to right.</li><li>An exponent only applies to what's directly attached to it (a number, or a resolved group).</li></ul>

  <h3 class="section-label">Mini Quiz</h3>
  <div class="quiz-block"><span class="qn">Q1</span>Evaluate: 8 − 2 × 3 <details><summary>Answer</summary><div class="ans">8−6=2</div></details></div>
  <div class="quiz-block"><span class="qn">Q2</span>Evaluate: (6+2)² ÷ 4 <details><summary>Answer</summary><div class="ans">64÷4=16</div></details></div>
  <div class="quiz-block"><span class="qn">Q3</span>Evaluate: 10 − 3 + 4 <details><summary>Answer</summary><div class="ans">left to right: 7+4=11</div></details></div>
  <div class="quiz-block"><span class="qn">Q4</span>Evaluate: 5 + 2[8 ÷ 2 − 1] <details><summary>Answer</summary><div class="ans">8÷2=4, 4−1=3, 2(3)=6, 5+6=11</div></details></div>

  <div class="qcard"><div class="qhead"><span class="qnum">EXAM</span> Evaluate: 4² − 3(7 − 5)² + 12 ÷ 3</div>
  <details><summary>Show Answer</summary><div class="ans">16 − 3(4) + 4 = 16 − 12 + 4 = 8</div></details></div>
</template>

<template id="tpl-numbers">
  <h2 class="title">Integers, Fractions &amp; Decimals</h2>
  <p class="sub">The number toolkit every later Algebra topic depends on.</p>

  <div class="card"><h3>Definition</h3>
  <div class="row"><b>Integers</b> are whole numbers and their opposites (…−2,−1,0,1,2…) — no fractions or decimals. <b>Fractions</b> represent a part of a whole. <b>Decimals</b> are another way to write fractional amounts using place value.</div>
  <div class="vocab-grid">
    <div class="vocab-item"><b>Numerator</b> top number of a fraction — the part.</div>
    <div class="vocab-item"><b>Denominator</b> bottom number of a fraction — the whole.</div>
    <div class="vocab-item"><b>Reciprocal</b> a fraction flipped upside down.</div>
    <div class="vocab-item"><b>LCD</b> least common denominator — needed to add/subtract unlike fractions.</div>
  </div></div>

  <div class="card"><h3>Key Rules</h3>
  <span class="formula">Same-sign integers add, keep sign · Different-sign integers subtract, keep sign of larger</span>
  <span class="formula">a/b + c/d = (ad + bc)/bd     a/b × c/d = ac/bd     a/b ÷ c/d = a/b × d/c</span>
  <div class="remember"><b>Remember it:</b> "Keep, Change, Flip" for fraction division — keep the first fraction, change ÷ to ×, flip the second.</div></div>

  <div class="card"><h3>Step-by-Step: Adding Unlike Fractions</h3>
  <ol class="steps-list"><li>Find the LCD of the denominators.</li><li>Rewrite each fraction with that denominator.</li><li>Add or subtract the numerators only.</li><li>Simplify if possible.</li></ol></div>

  <div class="card"><h3>Worked Examples</h3>
  <div class="row"><span class="diff-tag diff-easy">EASY</span> −7 + 3</div><div class="example">different signs, keep sign of larger magnitude: −(7−3) = <b>−4</b></div>
  <div class="row"><span class="diff-tag diff-med">MEDIUM</span> 2/3 + 1/4</div><div class="example">LCD=12 → 8/12 + 3/12 = <b>11/12</b></div>
  <div class="row"><span class="diff-tag diff-hard">HARD</span> −5.6 ÷ (−0.8) × 2</div><div class="example">−5.6÷−0.8 = 7 (negatives cancel) → 7×2 = <b>14</b></div>
  </div>

  <div class="card"><h3>What If We Change Something?</h3>
  <div class="row"><b>What if a fraction's denominator was negative?</b> −2/3 = 2/−3 — the negative can travel with the numerator, denominator, or the whole fraction; the value doesn't change.</div>
  <div class="row"><b>What if you divide instead of multiply fractions?</b> Flip the second fraction and multiply instead — division never stays division with fractions.</div>
  <div class="row"><b>What if the decimals have different numbers of digits?</b> Line up the decimal points, not the digits, before adding or subtracting.</div>
  </div>

  <div class="mistake"><div class="no">01</div><div><b>Adding fraction denominators together</b> (2/3+1/4 ≠ 3/7) — only numerators combine, after finding a common denominator.</div></div>
  <div class="mistake"><div class="no">02</div><div><b>Losing track of a negative sign</b> when subtracting a negative integer — subtracting a negative is the same as adding.</div></div>
  <div class="mistake"><div class="no">03</div><div><b>Misaligning decimal points</b> when adding/subtracting decimals of different lengths.</div></div>

  <div class="callout tip"><b>Test tip:</b> Convert messy decimals/fractions to a common form (all fractions or all decimals) before comparing or combining them.</div>
  <div class="callout"><b>Real-world use:</b> Splitting a restaurant bill, adjusting a recipe, or calculating a discount all rely on fraction and decimal operations.</div>

  <h3 class="section-label">Practice Problems</h3>
  <div class="qcard"><div class="qhead"><span class="qnum">P1</span> −8 − (−3)</div><details><summary>Show Answer</summary><div class="ans">−8+3 = −5</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P2</span> 3/5 − 1/10</div><details><summary>Show Answer</summary><div class="ans">6/10−1/10 = 5/10 = 1/2</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P3</span> 0.75 + 1.4</div><details><summary>Show Answer</summary><div class="ans">2.15</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P4</span> 2/3 ÷ 4/9</div><details><summary>Show Answer</summary><div class="ans">2/3 × 9/4 = 18/12 = 3/2</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">CHALLENGE</span> (−3/4)(2/5) − (−1/10)</div><details><summary>Show Answer</summary><div class="ans">−6/20 + 1/10 = −3/10 + 1/10 = −2/10 = −1/5</div></details></div>

  <h3 class="section-label">Things to Remember</h3>
  <ul class="steps-list"><li>Same signs add and keep the sign; different signs subtract and keep the bigger one's sign.</li><li>You need a common denominator to add or subtract fractions — never to multiply or divide them.</li><li>Line up decimal points before adding or subtracting decimals.</li></ul>

  <h3 class="section-label">Mini Quiz</h3>
  <div class="quiz-block"><span class="qn">Q1</span> −4 + (−9) <details><summary>Answer</summary><div class="ans">−13</div></details></div>
  <div class="quiz-block"><span class="qn">Q2</span> 1/2 + 3/8 <details><summary>Answer</summary><div class="ans">4/8+3/8=7/8</div></details></div>
  <div class="quiz-block"><span class="qn">Q3</span> 3.2 − 1.75 <details><summary>Answer</summary><div class="ans">1.45</div></details></div>
  <div class="quiz-block"><span class="qn">Q4</span> −6 × (−2) <details><summary>Answer</summary><div class="ans">12</div></details></div>

  <div class="qcard"><div class="qhead"><span class="qnum">EXAM</span> Simplify: (−2/3) + (5/6) × (−4/5)</div>
  <details><summary>Show Answer</summary><div class="ans">5/6 × −4/5 = −20/30 = −2/3 → −2/3 + (−2/3) = −4/3</div></details></div>
</template>

<template id="tpl-absvalue">
  <h2 class="title">Absolute Value</h2>
  <p class="sub">How far a number sits from zero — always non-negative.</p>

  <div class="card"><h3>Definition</h3>
  <div class="row">The <b>absolute value</b> of a number is its distance from 0 on the number line. Distance can never be negative, so |x| is always ≥ 0.</div>
  <div class="vocab-grid">
    <div class="vocab-item"><b>| |</b> the absolute value symbol (two vertical bars).</div>
    <div class="vocab-item"><b>Opposite</b> a number the same distance from 0 but the other direction.</div>
  </div></div>

  <div class="card"><h3>Key Rule</h3>
  <span class="formula">|x| = x if x ≥ 0     |x| = −x if x &lt; 0</span>
  <div class="remember"><b>Remember it:</b> Absolute value bars act like a "distance meter" — whatever goes in comes out positive (or zero).</div></div>

  <div class="card"><h3>Step-by-Step: Solving |x| = a</h3>
  <ol class="steps-list"><li>Isolate the absolute value expression on one side.</li><li>Split into two equations: (expression) = a and (expression) = −a.</li><li>Solve both equations separately.</li><li>Check both solutions in the original equation.</li></ol></div>

  <div class="card"><h3>Worked Examples</h3>
  <div class="row"><span class="diff-tag diff-easy">EASY</span> Evaluate |−7|</div><div class="example">distance from 0 is 7 → <b>7</b></div>
  <div class="row"><span class="diff-tag diff-med">MEDIUM</span> Solve |x − 3| = 5</div><div class="example">x−3=5 → x=8   or   x−3=−5 → x=−2</div>
  <div class="row"><span class="diff-tag diff-hard">HARD</span> Solve 2|x + 1| − 4 = 6</div><div class="example">2|x+1|=10 → |x+1|=5 → x+1=5→x=4  or  x+1=−5→x=−6</div>
  </div>

  <div class="card"><h3>What If We Change Something?</h3>
  <div class="row"><b>What if the equation equals a negative number?</b> |x| = −3 has NO solution — absolute value can never equal a negative.</div>
  <div class="row"><b>What if it's an inequality instead?</b> |x| &lt; a means −a &lt; x &lt; a (a "between" statement); |x| &gt; a splits into x &lt; −a OR x &gt; a.</div>
  <div class="row"><b>What if there's a coefficient outside the bars?</b> Isolate the absolute value expression completely (undo any outside operations) before splitting into two cases.</div>
  </div>

  <div class="mistake"><div class="no">01</div><div><b>Forgetting the negative case</b> and only solving one of the two equations.</div></div>
  <div class="mistake"><div class="no">02</div><div><b>Setting an absolute value equal to a negative number</b> and solving anyway — that equation has no solution.</div></div>
  <div class="mistake"><div class="no">03</div><div><b>Distributing into the absolute value bars</b> like they're parentheses — simplify what's inside first, then apply the definition.</div></div>

  <div class="callout tip"><b>Test tip:</b> Always isolate the bars first, then think "this becomes two equations," and always check both answers.</div>
  <div class="callout"><b>Real-world use:</b> Absolute value describes tolerances — like a manufacturing part that must be within 0.05 mm of a target size, in either direction.</div>

  <h3 class="section-label">Practice Problems</h3>
  <div class="qcard"><div class="qhead"><span class="qnum">P1</span> Evaluate |4 − 9|</div><details><summary>Show Answer</summary><div class="ans">|−5| = 5</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P2</span> Solve |x| = 12</div><details><summary>Show Answer</summary><div class="ans">x = 12 or x = −12</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P3</span> Solve |2x − 1| = 7</div><details><summary>Show Answer</summary><div class="ans">2x−1=7→x=4  or  2x−1=−7→x=−3</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P4</span> Solve |x + 5| = −2</div><details><summary>Show Answer</summary><div class="ans">No solution — absolute value can't be negative</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">CHALLENGE</span> Solve 3|2x − 4| + 1 = 19</div><details><summary>Show Answer</summary><div class="ans">3|2x−4|=18 → |2x−4|=6 → 2x−4=6→x=5  or  2x−4=−6→x=−1</div></details></div>

  <h3 class="section-label">Things to Remember</h3>
  <ul class="steps-list"><li>Absolute value is a distance — never negative.</li><li>|x| = a splits into two equations unless a is negative (then: no solution).</li><li>Always isolate the bars before splitting into cases.</li></ul>

  <h3 class="section-label">Mini Quiz</h3>
  <div class="quiz-block"><span class="qn">Q1</span> |−15| <details><summary>Answer</summary><div class="ans">15</div></details></div>
  <div class="quiz-block"><span class="qn">Q2</span> Solve |x−2|=9 <details><summary>Answer</summary><div class="ans">x=11 or x=−7</div></details></div>
  <div class="quiz-block"><span class="qn">Q3</span> Solve |x|+3=3 <details><summary>Answer</summary><div class="ans">|x|=0 → x=0</div></details></div>
  <div class="quiz-block"><span class="qn">Q4</span> Does |x|=−4 have a solution? <details><summary>Answer</summary><div class="ans">No</div></details></div>

  <div class="qcard"><div class="qhead"><span class="qnum">EXAM</span> Solve: 5 − |3x + 2| = −4</div>
  <details><summary>Show Answer</summary><div class="ans">−|3x+2|=−9 → |3x+2|=9 → 3x+2=9→x=7/3  or  3x+2=−9→x=−11/3</div></details></div>
</template>

<template id="tpl-scinotation">
  <h2 class="title">Scientific Notation</h2>
  <p class="sub">A compact way to write extremely large or extremely small numbers.</p>

  <div class="card"><h3>Definition</h3>
  <div class="row"><b>Scientific notation</b> writes a number as a decimal between 1 and 10, multiplied by a power of 10.</div>
  <div class="vocab-grid">
    <div class="vocab-item"><b>Coefficient</b> the decimal part, 1 ≤ a &lt; 10.</div>
    <div class="vocab-item"><b>Power of 10</b> tells how many places the decimal moved.</div>
  </div></div>

  <div class="card"><h3>Key Rule</h3>
  <span class="formula">a × 10ⁿ,  where 1 ≤ a &lt; 10</span>
  <div class="remember"><b>Remember it:</b> Positive exponent = big number (decimal moves right); negative exponent = small number (decimal moves left).</div></div>

  <div class="card"><h3>Step-by-Step: Standard → Scientific</h3>
  <ol class="steps-list"><li>Move the decimal point until only one non-zero digit remains before it.</li><li>Count how many places you moved it — that's your exponent.</li><li>Moved left → positive exponent. Moved right → negative exponent.</li></ol></div>

  <div class="card"><h3>Worked Examples</h3>
  <div class="row"><span class="diff-tag diff-easy">EASY</span> Write 5,400 in scientific notation</div><div class="example">5.4 × 10³</div>
  <div class="row"><span class="diff-tag diff-med">MEDIUM</span> Write 0.00032 in scientific notation</div><div class="example">3.2 × 10⁻⁴</div>
  <div class="row"><span class="diff-tag diff-hard">HARD</span> Multiply (3×10⁴)(2×10⁻⁶)</div><div class="example">3×2=6, 10⁴·10⁻⁶=10⁻² → <b>6×10⁻²</b></div>
  </div>

  <div class="card"><h3>What If We Change Something?</h3>
  <div class="row"><b>What if the coefficient comes out ≥ 10?</b> Like 42 × 10³ — renormalize: 4.2 × 10⁴ (adjust the exponent by however many places you re-shift the decimal).</div>
  <div class="row"><b>What if you're dividing instead of multiplying?</b> Divide the coefficients, subtract the exponents: (8×10⁵)÷(2×10²) = 4×10³.</div>
  <div class="row"><b>What if you need to add two numbers in scientific notation?</b> Convert them to the same power of 10 first, then add the coefficients.</div>
  </div>

  <div class="mistake"><div class="no">01</div><div><b>Leaving the coefficient outside 1–10</b>, like writing 42×10³ instead of 4.2×10⁴.</div></div>
  <div class="mistake"><div class="no">02</div><div><b>Mixing up the sign of the exponent</b> — small numbers (less than 1) need a NEGATIVE exponent.</div></div>
  <div class="mistake"><div class="no">03</div><div><b>Adding exponents when multiplying coefficients only</b>, or forgetting to combine the powers of 10 at all.</div></div>

  <div class="callout tip"><b>Test tip:</b> Count decimal places carefully with your finger or pencil tip — miscounting by one place is the #1 error.</div>
  <div class="callout"><b>Real-world use:</b> Scientists use scientific notation for things like the distance to a star (huge) or the size of a virus (tiny) — writing all those zeros would be impractical.</div>

  <h3 class="section-label">Practice Problems</h3>
  <div class="qcard"><div class="qhead"><span class="qnum">P1</span> Write 812,000 in scientific notation</div><details><summary>Show Answer</summary><div class="ans">8.12 × 10⁵</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P2</span> Write 0.0007 in scientific notation</div><details><summary>Show Answer</summary><div class="ans">7 × 10⁻⁴</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P3</span> Write 6.1 × 10⁶ in standard form</div><details><summary>Show Answer</summary><div class="ans">6,100,000</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P4</span> (5×10³)(4×10²)</div><details><summary>Show Answer</summary><div class="ans">20×10⁵ = 2×10⁶</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">CHALLENGE</span> (9×10⁷) ÷ (3×10⁻²)</div><details><summary>Show Answer</summary><div class="ans">3×10⁹</div></details></div>

  <h3 class="section-label">Things to Remember</h3>
  <ul class="steps-list"><li>Coefficient must satisfy 1 ≤ a &lt; 10.</li><li>Big numbers get positive exponents; small (less than 1) numbers get negative exponents.</li><li>Multiplying: multiply coefficients, add exponents. Dividing: divide coefficients, subtract exponents.</li></ul>

  <h3 class="section-label">Mini Quiz</h3>
  <div class="quiz-block"><span class="qn">Q1</span> Write 93,000,000 in scientific notation <details><summary>Answer</summary><div class="ans">9.3×10⁷</div></details></div>
  <div class="quiz-block"><span class="qn">Q2</span> Write 4×10⁻³ in standard form <details><summary>Answer</summary><div class="ans">0.004</div></details></div>
  <div class="quiz-block"><span class="qn">Q3</span> (2×10²)(3×10⁴) <details><summary>Answer</summary><div class="ans">6×10⁶</div></details></div>
  <div class="quiz-block"><span class="qn">Q4</span> (8×10⁶)÷(4×10³) <details><summary>Answer</summary><div class="ans">2×10³</div></details></div>

  <div class="qcard"><div class="qhead"><span class="qnum">EXAM</span> Simplify and write in scientific notation: (6×10⁵)(5×10⁻²)</div>
  <details><summary>Show Answer</summary><div class="ans">30×10³ = 3×10⁴</div></details></div>
</template>
<template id="tpl-expressions">
  <h2 class="title">Simplifying Expressions</h2>
  <p class="sub">Combining like terms and distributing — the two moves you'll use in almost every Algebra problem.</p>

  <div class="card"><h3>Definition</h3>
  <div class="row">To <b>simplify</b> an expression means to rewrite it in its shortest, most reduced form by combining like terms and clearing parentheses — without changing its value.</div>
  <div class="vocab-grid">
    <div class="vocab-item"><b>Like terms</b> terms with the exact same variable(s) raised to the exact same power(s).</div>
    <div class="vocab-item"><b>Distributive Property</b> a(b + c) = ab + ac.</div>
  </div></div>

  <div class="card"><h3>Key Rule</h3>
  <span class="formula">a(b + c) = ab + ac       Only combine terms with matching variable parts</span>
  <div class="remember"><b>Remember it:</b> Distribute like you're handing out candy to everyone inside the parentheses — every term gets a piece.</div></div>

  <div class="card"><h3>Step-by-Step Method</h3>
  <ol class="steps-list"><li>Distribute any number or variable multiplied onto a parenthesis.</li><li>Identify like terms (same variable, same exponent).</li><li>Combine like terms by adding/subtracting their coefficients.</li><li>Write the simplified expression, usually highest exponent first.</li></ol></div>

  <div class="card"><h3>Worked Examples</h3>
  <div class="row"><span class="diff-tag diff-easy">EASY</span> 4x + 3x − 2</div><div class="example">combine like terms: <b>7x − 2</b></div>
  <div class="row"><span class="diff-tag diff-med">MEDIUM</span> 3(x + 4) − 2x</div><div class="example">distribute: 3x+12−2x → combine: <b>x + 12</b></div>
  <div class="row"><span class="diff-tag diff-hard">HARD</span> 2(3x − 5) − 4(x − 1)</div><div class="example">6x−10 −4x+4 → combine: <b>2x − 6</b></div>
  </div>

  <div class="card"><h3>What If We Change Something?</h3>
  <div class="row"><b>What if the number outside is negative?</b> −2(x − 5) = −2x + 10 — the negative distributes and flips both signs inside.</div>
  <div class="row"><b>What if there are two variables, like x and y?</b> Combine x-terms with x-terms and y-terms with y-terms separately — they can never combine with each other.</div>
  <div class="row"><b>What if a term has no visible coefficient?</b> Treat it as an invisible 1 (or −1 if there's a lone minus sign) — x means 1x.</div>
  </div>

  <div class="mistake"><div class="no">01</div><div><b>Forgetting to distribute the sign</b> on −(x − 5), turning it into −x−5 instead of −x+5.</div></div>
  <div class="mistake"><div class="no">02</div><div><b>Combining unlike terms</b>, like adding 3x and 5x² as if they were the same kind of term.</div></div>
  <div class="mistake"><div class="no">03</div><div><b>Only distributing to the first term inside the parentheses</b> and forgetting the rest.</div></div>

  <div class="callout tip"><b>Test tip:</b> Underline or circle each group of like terms in a different way before combining — it prevents rushed mistakes.</div>
  <div class="callout"><b>Real-world use:</b> Simplifying a total-cost expression (like 3 shirts at x dollars plus 2 more shirts at x dollars) mirrors exactly how a receipt gets totaled.</div>

  <h3 class="section-label">Practice Problems</h3>
  <div class="qcard"><div class="qhead"><span class="qnum">P1</span> 5y − 2 + 3y + 7</div><details><summary>Show Answer</summary><div class="ans">8y + 5</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P2</span> 2(4x − 3)</div><details><summary>Show Answer</summary><div class="ans">8x − 6</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P3</span> −3(x + 2) + 5x</div><details><summary>Show Answer</summary><div class="ans">−3x−6+5x = 2x−6</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">P4</span> 6x + 2y − 4x + y</div><details><summary>Show Answer</summary><div class="ans">2x + 3y</div></details></div>
  <div class="qcard"><div class="qhead"><span class="qnum">CHALLENGE</span> 4(2x − 1) − 3(x + 2) + 5</div><details><summary>Show Answer</summary><div class="ans">8x−4−3x−6+5 = 5x−5</div></details></div>
